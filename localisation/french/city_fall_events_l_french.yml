l_french:
 city_fall_news.8.t:0 "La chute de Bordeaux"
 city_fall_news.8.d:0 "Bordeaux, connue pour sa riche histoire et son importance culturelle, est tombée aux mains de l’armée [new_controller.GetAdjective]. Alors que la défense [old_controller.GetAdjective] opposa une résistance féroce, l’envahisseur avança le long de la Garonne et captura le port de la Lune, la clé de la ville.\n\n\nLes rapports indiquent que la plupart des bâtiments, y compris la Place de la Bourse et le Grand Théâtre, ont subis peu ou pas de dégâts. Cependant, le port de la ville a été pratiquement détruit après de violents affrontements, et l’administration militaire [new_controller.GetAdjective] a déjà ordonné aux ouvriers locaux de le réparer pour un usage futur comme base navale."
 city_fall_news.8.a:0 "Oh non..."
 city_fall_news.8.b:0 "Intéressant"
 city_fall_news.8.c:0 "La guerre prend une direction inattendue."
 city_fall_news.9.t:0 "La chute de Marseille"
 city_fall_news.9.d:0 "La bataille de Marseille s'est terminée par une victoire [new_controller.GetAdjective] décisive. Après avoir capturé le centre de la ville et ses installations navales, l'armée [new_controller.GetAdjective] s'est avancée pour sécuriser les faubourgs et nettoyer les poches de résistance jusqu'à Aix-en-Provence. Avant de battre en retraite, la garnison [old_controller.GetAdjective] a réussi à faire sauter le pont transbordeur de Marseille pour ralentir la progression [new_controller.GetAdjective]. La bataille a laissé sa marque sur les infrastructures de la ville, alors que le Vieux Port porte maintenant les cicatrices de la bataille, tout comme la Vieille Ville. Néanmoins, [new_controller.GetNameDEF] est désormais en pleine possession de la cité phocéenne."
 city_fall_news.9.a:0 "Malheureux..."
 city_fall_news.9.b:0 "Bonne nouvelle!"
 city_fall_news.9.c:0 "Une grande victoire pour [new_controller.GetNameDEF]."
  city_fall_news.56.t:0 "La chute de Tunis"
 city_fall_news.56.d:0 "Aujourd'hui, la bataille pour Tunis s'est terminée par une victoire décisive pour [new_controller.GetNameDEF]. Après d’âpres affrontements, l'armée [new_controller.GetAdjective] a réussi à distancer les défenceurs stationnés dans la zone et les piéger, avant d’entrer dans la ville et sécuriser son port en eaux profondes, assurant ainsi leur contrôle.\n\nAprès la sécurisation de Tunis par l'armée [new_controller.GetAdjective], un défilé de la victoire a été préparé à la hâte le long de l'avenue Gambetta, tandis que les habitants observaient avec curiosité les évènements."
 city_fall_news.56.a:0 "Malheureux."
 city_fall_news.56.b:0 "La campagne de Tunisie est un succès!"
 city_fall_news.56.c:0 "Intéressant."
 city_fall_news.57.t:0 "La chute de Dakar"
 city_fall_news.57.d:0 "Aujourd'hui, les troupes [new_controller.GetAdjective] ont pénétré dans la ville ouest-africaine de Dakar après une courte bataille, au cours de laquelle la garnison [old_controller.GetAdjective] a tenté en vain de défendre la ville, avant de se rendre. Désormais sécurisée, son petit port est aux mains de l’armée [new_controller.GetAdjective].\n\nEn Afrique, Dakar est la ville la plus à l'ouest du continent et le port le plus important de sa côte atlantique. Elle est véritablement la porte vers l'Afrique de l'Ouest, ce qui signifie que [new_controller.GetNameDEF] possède désormais la base d'opérations la plus importante de la région."
 city_fall_news.57.a:0 "Malheureux."
 city_fall_news.57.b:0 "Le Sénégal est entre nos mains!"
 city_fall_news.57.c:0 "[new_controller.GetNameDEFCap] a la porte ouverte vers l'Afrique de l'ouest désormais."
  city_fall_news.65.t:0 "La chute de Damas"
 city_fall_news.65.d:0 "Après de violents combats, Damas est tombée aux mains de l'armée [new_controller.GetAdjective]. Après être entrés en périphérie de la ville, les premiers combats avec la garnison [old_controller.GetAdjective] ont éclatés, ces derniers ont tenté de lancer une contre-attaque, en vain. Après avoir défendu leur position, ils avancèrent et prirent le contrôle des forts de pierre surplombant Damas, avec des combats particulièrement acharnés dans la région de Mazzeh et près de la rivière Barada. Avec la capitale syrienne, ainsi que ses hauteurs, entre les mains [new_controller.GetAdjective], leur position au Moyen-Orient sont fortement renforcées."
 city_fall_news.65.a:0 "Bon sang!"
 city_fall_news.65.b:0 "Intéressant"
 city_fall_news.65.c:0 "Quelles conséquences pour le Proche-Orient?"
  city_fall_news.75.t:0 "La chute d'Hanoi"
 city_fall_news.75.d:0 "Des rapports récents provenant d’Hanoï ont désormais confirmé que la ville a chuté face à l'avance [new_controller.GetAdjective]. Selon la propagande [new_controller.GetAdjective], ils ont encerclé le centre-ville en prenant le contrôle de ses périphéries, permettant à la garnison de se rassembler pour battre en retraite. Avec la plus importante ville d'Indochine sous son contrôle, la positions de [new_controller.GetNameDEF] dans la région est désormais fortement renforcé, tandis que l'[old_controller.GetNameDEF] se retrouve très désorganisée."
 city_fall_news.75.a:0 "Nous la reprendrons!"
 city_fall_news.75.b:0 "Intéressant"
 city_fall_news.75.c:0 "[new_controller.GetNameDEFCap] a désormais un pied en Indochine."