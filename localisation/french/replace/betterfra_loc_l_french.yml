FRA_force_the_issue_desc:1 "Nous avons parcouru un long chemin depuis la création du Front populaire. Mais nous ne pouvons pas laisser notre travail à moitié terminé. Les grèves actuelles exigent un leadership radical pour y mettre fin. Il est temps que tous les membres de la gauche fassent un choix et prennent position : soit avec la révolution, soit contre elle."
FRA_industrial_collectivization_desc:0 "L'économie française est aujourd'hui composée de petites entreprises avec peu d'employés, qui sont toujours en concurrence les unes avec les autres et qui épuisent les ressources dans une production à petite échelle inefficace. Nous allons exploiter leur division et inciter les travailleurs à s'emparer de ces entreprises pour eux-mêmes."
FRA_celebrate_the_commune_desc:0 "Même si elle fut de courte durée, la Commune de Paris fut la première tentative de création d'une société communiste sur le sol français. Tout comme les ouvriers de Paris en 1871 ont pris les armes contre la réaction, nous devons aujourd'hui nous battre contre le fascisme !"
