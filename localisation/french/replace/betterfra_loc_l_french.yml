FRA_economic_devastation:0 "Dévastation économique"
provisional_france_focus:0 "Gouvernement provisoire de France"
FRA_corf:0 "Planifier de nouvelles fortifications"
FRA_corf_desc:0 "La disparition de la CORF annoncée mi-1935, et effective fin 1935, se traduit par un transfert de responsabilité entier de l'effort de construction des organisations défensives aux frontières vers les Régions Militaires . Celles-ci deviennent responsables devant le ministère de la Guerre autant de la finalisation des chantiers CORF et de l'amélioration de ces fortifications, que de la construction des compléments et renforcements qu'elles jugeraient nécessaire… dans la limite des budgets alloués bien sur."
FRA_defense_minister:0 "Ministre de la Défense Nationale"
FRA_air_minister:0 "Ministre de l'Air"
FPM_anti_fascist:0 "Anti Fasciste"
FRA_georges_monnet:0 "Georges Monnet"
FRA_marx_dormoy:0 "Marx Dormoy"
FRA_pierre_taittinger:0 "Pierre Taittinger"
FRA_guy_la_chambre:0 "Guy La Chambre"

FRA_henri_dentz:0 "Henri Dentz"
FRA_marquis:0 "André Marquis"
FRA_liberation:0 "Libération"
 FRA_liberation_desc:0 "L'heure de la libération a sonné ! Nous avons rétabli le siège de notre gouvernement à Paris et maintenant le reste de la France doit se joindre à nous pour résister à l'occupant ! Nous les jetterons hors de France et sur le Rhin !"
FRA_french_liberation_army_desc:0 "Il est temps de chasser l'ennemi hors du sol Francais !"
 FRA_lend_lease:0 "Prêt-bail"
 FRA_lend_lease_desc:0 "Après des années de guerre, nous ne pouvons plus compter sur notre propre base industrielle pour nous fournir les armements dont nous avons besoin. Nous devons faire appel à nos alliés pour obtenir un soutien supplémentaire."
 FRA_lessons_of_1940:0 "Leçons de la défaite"
 FRA_lessons_of_1940_desc:0 "L'expérience de notre récente défaite a montré que nous devons réformer notre doctrine militaire afin que l'inflexibilité qui nous a paralysés à l'époque ne nous afflige plus aujourd'hui."
 francefell1936tt:0 "1936"
 francefell1937tt:0 "1937"
 francefell1938tt:0 "1938"
 francefell1939tt:0 "1939"
 francefell1940tt:0 "1940"
 francefell1941tt:0 "1941"
 francefell1942tt:0 "1942"
 francefell1943tt:0 "1943"
 francefell1944tt:0 "1944"
 francefell1945tt:0 "1945"
 francefell1946tt:0 "1946"
 FRA_division_blindee:0 "Division Blindée"
 FRA_division_blindee_desc:0 "Il est désormais clair que les blindés sont un élément décisif de la guerre. Nous devons réformer nos divisions blindées pour repousser l'ennemi !"
 FRA_oath_of_kufra:0 "Serment de Kufra"
 FRA_oath_of_kufra_desc:0 "Jurez de ne pas déposer les armes tant que nos couleurs, nos belles couleurs, ne flotteront pas sur la cathédrale de Strasbourg. - Serment de Koufa, 2 mars 1941"
 FRA_ecole_nationale_dadministration:0 "École nationale d'administration"
 FRA_ecole_nationale_dadministration_desc:0 "Le rétablissement du gouvernement sur le sol français nécessitera une fonction publique forte, beaucoup de nos anciens administrateurs ayant collaboré avec l'ennemi."
 FRA_the_marshall_plan:0 "[GetMarshalPlan]"
 FRA_the_marshall_plan_desc:0 "[GetMarshalPlanDesc]"
 FRAMarshalPlan:0 "Le plan Marshall"
 FRANoMarshalPlan:0 "Reconstruire la France"
 FRAMarshalPlanDesc:0 "Le plan Marshall, nommé d'après le secrétaire d'État américain George Marshall, est un plan audacieux visant à aider les économies de l'Europe occidentale à se redresser, maintenant que la guerre est terminée. Nous prendrons toute l'aide possible pour reconstruire la France."
 FRANoMarshalPlanDesc:0 "Maintenant que la guerre est finie, nous pouvons commencer à redresser l'économie. Même si la guerre a été dévastatrice et que cela prendra certainement beaucoup de temps, la France s'en sortira."
 FRA_european_integration:0 "Intégration européenne"
 FRA_european_integration_desc:0 "Afin de garantir qu'une telle guerre ne se reproduise pas sur ce continent, il est prudent que nous entremêlions nos économies. L'heure est à la réconciliation."
 FRA_coal_and_steel:0 "Charbon et acier"
 FRA_coal_and_steel_desc:0 "Deux des ingrédients les plus importants pour la guerre, le charbon et l'acier, pourraient peut-être être mis en commun dans toute l'Europe au sein d'un marché commun, ce qui rendrait la guerre entre nous non seulement impensable, mais matériellement impossible."
 FRA_the_european_union:0 "L'Union européenne"
 FRA_the_european_union_desc:0 "Avec la montée en puissance d'autres puissances à travers le monde, l'Europe ne peut plus se permettre de se battre entre elle. Nous devons travailler ensemble dans le cadre d'une alliance, ou peut-être même d'un seul État, afin de garantir la pérennité de la paix et la pertinence du monde."
 FRA_european_integration_base:0 "$FRA_european_integration$"
 FRA_european_integration_base_desc: "$FRA_european_integration_desc$"
 FRA_coal_and_steel_base:0 "$FRA_coal_and_steel$"
 FRA_coal_and_steel_base_desc: "$FRA_coal_and_steel_desc$"
 FRA_the_european_union_base:0 "$FRA_the_european_union$"
 FRA_the_european_union_base_desc: "$FRA_the_european_union_desc$"
 FRA_social_security:0 "Sécurité sociale"
 FRA_social_security_desc:0 "Après des années d'occupation, de nombreux Français sont appauvris et souffrent encore des conséquences de la guerre. Nous devrions mettre en place un programme de sécurité sociale pour aider ceux qui sont dans le besoin."
 FRA_renewed_dirigisme:0 "Renouveler le Dirigisme"
 FRA_renewed_dirigisme_desc:0 "Afin de ramener la France sur la scène internationale en tant qu'économie majeure, nous devons immédiatement commencer à planifier la reconstruction et la croissance de notre économie."
 FRA_epuration_legale:0 "Épuration légale"
 FRA_epuration_sauvage:0 "Épuration sauvage"
 FRA_epuration_legale_desc:0 "Les traîtres qui ont collaboré avec les occupants ne pourront jamais être pardonnés. Nous devons immédiatement les purger de leurs positions et de leur statut. En même temps, nous ne pouvons pas permettre que cette purge se fasse par la violence populaire. Nous entamerons immédiatement des poursuites judiciaires."
 FRA_constituent_assembly:0 "L'Assemblée constituante"
 FRA_constituent_assembly_desc:0 "Le gouvernement de la Troisième République nous a laissé tomber. Il est clair que la France a besoin d'une nouvelle constitution. La question qui se pose alors est la suivante : quelle forme de gouvernement devons-nous adopter ?"
 FRA_gaullism:0 "Gaullisme" 
 FRA_gaullism_desc:0 "De Gaulle a plaidé en faveur d'un gouvernement fort, centralisé sous l'autorité d'un président fort. Il est d'ailleurs clair qu'il souhaite que ce président fort soit lui-même."
 FRA_sideline_the_assembly:0 "Mise à l'écart de l'Assemblée"
 FRA_sideline_the_assembly_desc:0 "L'assemblée élue est dominée par les socialistes et les communistes, groupes opposés à l'objectif de De Gaulle d'une présidence forte. Nous devrions les mettre à l'écart et commencer à travailler avec d'autres groupes politiques et institutions pour atteindre nos objectifs."
 FRA_align_the_opposition:0 "Aligner l'opposition"
 FRA_align_the_opposition_desc:0 "L'opposition aux partis primaires de l'Assemblée, composée principalement de conservateurs et de radicaux, l'establishment politique d'avant la guerre, s'oppose actuellement à l'établissement d'une nouvelle constitution. Peut-être pourrions-nous attiser leurs craintes à l'égard de la gauche et les rallier à notre cause."
 FRA_a_deal_with_bidault:0 "Un accord avec Bidault"
 FRA_a_deal_with_bidault_desc:0 "Le Parti républicain populaire est en accord avec De Gaulle sur de nombreux points et est l'héritage de la résistance gaulliste pendant la guerre. Malgré cela, il est d'accord avec les socialistes et les communistes sur un régime parlementaire. Un accord avec son chef, Georges Bidault, pourrait peut-être changer la donne."
 FRA_presidential_democracy:0 "Démocratie présidentielle"
 FRA_presidential_democracy_desc:0 "Les excès politiques de la Troisième République peuvent être attribués à son système politique perpétuellement instable, dépendant d'une Chambre en perpétuel changement. Un système basé sur un président fort permettra d'éviter cela."
 FRA_the_fourth_republic:0 "La quatrième République"
 FRA_the_fourth_republic_desc:0 "Le temps du gouvernement provisoire est révolu ! Il est temps de proclamer la création d'une nouvelle IVe République, qui résistera à l'épreuve du temps."
 FRA_tripartisme:0 "Tripartisme"
 FRA_tripartisme_desc:0 "Au lendemain de la Libération, trois grands partis ont accédé au pouvoir sous forme de coalition. Le Mouvement républicain populaire, la Section française de l'Internationale ouvrière et le Parti communiste français. Souhaitant un régime parlementaire à l'image de la IIIe République, ils dominent l'Assemblée constituante."
 FRA_christian_democracy:0 "Démocratie chrétienne"
 FRA_christian_democracy_desc:0 "Le Mouvement républicain populaire, un parti chrétien-démocrate, est le plus grand parti non gauchiste de l'assemblée constituante. Dirigé par Georges Bidault, il gouverne au centre avec des méthodes de droite pour atteindre des objectifs de gauche."
 FRA_workers_internationale:0 "L'Internationale ouvrière"
 FRA_workers_internationale_desc:0 "Les socialistes français, au premier plan depuis des décennies, sont revenus au pouvoir grâce à leur intense résistance contre l'occupant. Plus forts que jamais, de nombreuses réformes sociales et économiques pourraient encore voir le jour en France."
 FRA_parti_des_75000:0 "le Parti des 75 000 Fusillés"
 FRA_parti_des_75000_desc:0 "Nous sommes le parti des 75 000 fusillés ! Les communistes français, autrefois un parti mineur, sont devenus l'un des plus grands partis du pays, revendiquant l'héritage de la résistance de gauche pendant la guerre."
 FRA_reestablish_the_senate:0 "Rétablir le Sénat"
 FRA_reestablish_the_senate_desc:0 "Le bicamérisme qui a caractérisé la Troisième République n'était pas nécessairement une mauvaise chose. Bien que parfois gênant, un tel système pourrait à nouveau nous servir moyennant quelques réformes."
 FRA_council_of_the_republic:0 "Conseil de la République"
 FRA_council_of_the_republic_desc:0 "Le Sénat, qui a toujours été un problème dans la dernière République, devrait être réformé et jouer un rôle plus consultatif, en tant que Conseil de la République. Les lois sont du ressort de l'assemblée."
 FRA_unicameralism:0 "Unicamérisme"
 FRA_unicameralism_desc:0 "Pourquoi une chambre haute ? L'Assemblée nationale est la représentation naturelle du peuple français. Une telle assemblée pourrait aussi être dominée par la cause marxiste...."
 FRA_a_second_third_republic:0 "Une seconde troisième République"
 FRA_a_second_third_republic_desc:0 "La forme de gouvernement de la Troisième République sera largement conservée, avec des changements là où c'est nécessaire. Nous sommes confiants dans notre capacité à maintenir un gouvernement stable cette fois-ci."
 FRA_republic_of_the_assembly:0 "République de l'Assemblée"
 FRA_republic_of_the_assembly_desc:0 "L'Assemblée nationale régnera en maître dans ce nouveau gouvernement. La voix du travailleur français, non étouffée par des institutions non démocratiques, sera enfin entendue !"
FRA_french_liberation_army:0 "Chasser l'ennemi hors de France"
provisional_france_focus:0 "Gouvernement provisoire de la France"
FRA_reconstruction2:0 "Reconstruction"
FRA_reconstruction:0 "Reconstruction"
FRA_reconstruction_desc:0 "La guerre a laissé la France en partie détruite, et il faut maintenant commencer à reconstruire."
FRA_kickstart_economy:0 "Relancer l'économie"
FRA_kickstart_economy_desc:0 "Nous devons relancer nos usines de guerre, d'abord pour rééquiper notre armée, mais surtout pour relancer l'économie !"
FRA_liberation_army:0 "Armée Française de la Libération"

FRA_french_genius:0 "Ingéniosité française"
FRA_french_genius_desc:0 "Dans l'histoire de France, même dans les périodes les plus sombres, ses habitants ont su se créer un sursaut national pour ne pas périr. Il est temps de le faire à nouveau !"
FRA_conseil_national_economique:0 "Instaurer le Conseil National Économique"
 FRA_conseil_national_economique_desc:0 "Le Conseil National Économique a été créée en 1925 mais n'a toujours pas été mis en place. Une assemblée constitutionnelle composée de représentants sociaux devrait permettre d'aider notre économie."
 FRA_ivory_coast_rubber:0 "Développer les plantations de Côte d'Ivoire"
 FRA_ivory_coast_rubber_desc:0 "Nous avons cruellement besoin de caoutchouc, nous pourrions en produire en Côte d'Ivoire où le climat y est parfaitement adapté."
FRA_usa_equipement:0 "Standardiser l'équipement"
FRA_usa_equipement_desc:0 "Notre armée est remplie d'équipements disparates d'avant l'armistice, de nos alliés, des différentes captures d'ennemis. Il est temps de commencer un début de standardisation pour y voir plus clair !"
 FPM_one_strongest_claimant:0 "Un §YPrétendant§! au §YTrône de France§! a plus de points que l'un de ses concurrents."
 FRA_withdraw_from_contested_territories:0 "Rétrocession des territoires contestés"
 FRA_withdraw_from_contested_territories_desc:0 "Bien que les conditions ne soient pas idéales, il nous faut rétrocéder nos comptoirs de Pondichéry et Kouang-Tchéou-Wan à leurs nations légitimes."
 FRA_maghreb_independence:0 "Départ des protectorats"
 FRA_maghreb_independence_desc:0 "Il est temps de laisser au Maroc et à la Tunisie le droit à l'indépendance et l'autodétermination."
 FRA_indochina_independence:0 "Dissoudre l'Indochine française"
 FRA_indochina_independence_desc:0 "Malgré la résistance des colons, les mouvements communistes puissants du Laos, du Cambodge, mais surtout du Viêt Nam, sont prêts à assurer l'indépendance et la construction de ces nouvelles nations."
 FRA_syrian_independence:0 "Indépendance de la Syrie"
 FRA_syrian_independence_desc:0 "Les accords de Sykes-Picot avait privé de leur liberté les syriens pour laquelle ils s'étaient battus. Il est temps de réparer cette erreur."
 FRA_west_african_independence:0 "Fondation d'une nation ouest-africaine"
 FRA_west_african_independence_desc:0 "La colonisation brutale de l'Afrique doit laisser la place à la construction d'une puissante union des nations d'Afrique de l'Ouest sous la bannière du socialisme."
 FRA_central_african_independence:0 "Fondation d'une nation centrafricaine"
 FRA_central_african_independence_desc:0 "La colonisation brutale de l'Afrique doit laisser la place à la construction d'une puissante union des nations d'Afrique Centrale sous la bannière du socialisme."
 FRA_Madagascar_independence:0 "Indépendance de Madagascar"
 FRA_Madagascar_independence_desc:0 "L'invasion et l'occupation de Madagascar a été un exemple du pire dont fut capable l'impérialisme français. Il est plus que temps de laisser aux peuples de l'île la liberté qu'ils réclament."
 FRA_Tahiti_independence:0 "Indépendance de Tahiti"
 FRA_Tahiti_independence_desc:0 "Les peuples océaniens sont dispersés dans le Pacifique, mais unis par la volonté d'être libres. Nous pouvons maintenant la leur accorder."
 FRA_american_independences:0 "Indépendances américaines"
 FRA_american_independences_desc:0 "Nous avons par le passé permis aux États-Unis d'arracher leur indépendance, nous pouvons désormais faire de même pour les petites nations sous notre autorité."
 FRA_algerian_question:0 "La question Algérienne"
 FRA_algerian_question_desc:0 "La colonisation de l'Algérie dure depuis plus d'un siècle, de nombreux européens y sont installés depuis des générations, la décolonisation risque d'être délicate."
 FRA_decolonization:0 "Décolonisation"
 FRA_decolonization_desc:0 "Nous avons enfin achevé la décolonisation et arraché les peuples que nous opprimions des griffes de l'impérialisme! C'est une nouvelle ère qui s'annonce pour la France et pour le monde entier!"
 FRA_departements_doutremer:0 "Départements d'Outre-Mer"
 FRA_departements_doutremer_desc:0 "Certains de nos territoires les plus intégrés sont tout à fait prêts à devenir des départements français à part entière, ce que des propositions de lois demandaient depuis plus d'un siècle."
FRA_invite_yugoslavia2:0 "Inviter la Yougoslavie"
FRA_invite_yugoslavia2_desc:0 "Ce pays, créé de toutes pièces après la Grande Guerre, a un grand intérêt stratégique dans la région, et une alliance avec la Yougoslavie pourrait nous être très utile."
FRA_revive_the_franco_polish_alliance2:0 "Alliance Franco-Polonaise"
FRA_revive_the_franco_polish_alliance2_desc:0 "La Pologne a toujours été notre alliée historique. Il est donc naturel que nous nous tournions vers elle."
FRA_heritor_of_foch:0 "Héritier de Foch"
FRA_heritor_of_foch_desc:0 "Depuis la Grande Guerre, Foch et Weygand ont toujours été très proches et se sont toujours respectés. Avant sa mort, le maréchal Foch avait déclaré : "Si la France est en danger, appelez Weygand". Ce jour est arrivé et le successeur de Foch galvanise les troupes et la population !"
FRA_ww1_stock:0 "Ressortir les stocks de la Grande Guerre"
FRA_ww1_stock_desc:0 "Compte tenu de la situation actuelle, nous devons ressortir nos anciennes réserves datant de la Grande Guerre !"
FRA_laffly:0 "Laffly"
FRA_laffly_organization: "$FRA_laffly$"
FRA_mac:0 "MAC"
FRA_mac_organization: "$FRA_mac$"
FRA_berliet:0 "Berliet"
FRA_berliet_organization: "$FRA_berliet$"
fra.4.t:0 "Opération Anton"
fra.4.d:0 "Les Allemands n'ont pas apprécié nos tractations secrètes avec les Alliés depuis l'opération Torch. Le responsable sur place, l'amiral Darlan, avait négocié une paix séparée avec les Alliés en Afrique du Nord, qui plaçait nos troupes sous le commandement des Alliés et les préparait ainsi à combattre l'Allemagne. L'Allemagne menace de nous envahir depuis ce matin et les premières troupes ennemies ont franchi la frontière aujourd'hui. Nos chances de résister sont minces, que devons-nous faire ?"
fra.4.a:0 "Impossible de résister..."
fra.4.b:0 "Enfin, l'heure de la revanche a sonné !"
fra.3.t:0 "La France attaquée"
fra.3.d:0 "Les Alliés nous ont attaqués, mais à la surprise générale, les Allemands ne nous ont pas envahis, ne nous assurant seulement grande volonté de coopérer avec nous pour vaincre les Alliés. Ils nous poussent donc fortement à rejoindre leur guerre. Le gouvernement est très divisé, comme d'habitude, et il est clair que nous ne pouvons plus rester neutres face à cette situation. Il est temps de choisir son camp, nous serons les seuls à être jugés par l'histoire..."
fra.3.a:0 "Les Alliés doivent être abattus"
fra.3.b:0 "Enfin, l'heure de la revanche a sonné !"
FRA_anton_tooltip:0 "§RVichy pourrait bien essayer d'entrer en contact avec les alliés si nous ne l'envahissons pas...§!"
FRA_le_roy_desc:0 "Maintenant que nous avons détruit toute forme de républicanisme, le Roi peut retourner sur son trône en paix. La mission de l'action française est accomplie, l'absolutisme est revenu en France. Vive le Roy !"
FRA_le_roy:0 "Vive le Roy"
absolutism:0 "Absolutisme"
france.346.t:0 "Décret sur la teneur de l'alcool"
france.346.d:0 "Ce matin, un décret est entré en vigueur pour faire passer la limite en alcool du pastis à 45°. La mesure a été approuvée par l'Académie de Médecine, considérant que cette teneur était autorisée depuis toujours en Algérie. Les producteurs de pastis ont tout de suite compris comment cela pourrait leur profiter, notamment le jeune Paul Ricard avec son nouveau pastis ‘à la marseillaise' qui séduit de plus en plus de clients et fait déjà de l'ombre à la célèbre marque Pernod. Monsieur Paul Ricard commence à développer son entreprise déjà fleurissante chez nos voisins espagnols et italiens, ainsi que plus au nord vers Lyon et Paris.\n Démocratisant l'apéritif et prônant la convivialité du sud, l'entreprise Ricard a tout pour devenir un nouveau fleuron national !"
france.346.a:0 "Garçon ! un pastis RICARD"
france.346.b:0 "Garçon ! un pastis PERNOD"
FRA_LA_ROCQUE:0 "République Française"
FRA_train_resistance:0 "Entraîner la résistance"
FRA_train_resistance_desc:0 "Maintenant que les mouvements de résistance sont suffisamment forts, il est temps de parachuter des officiers sur le territoire occupé. Ils vivront avec les maquisards et les formeront au combat."
FRA_maquis3:0 "Maquis"
VIC_rebuild_the_military:0 "Armée d'Armistice"
FRA_revolution_nationale:0 "Révolution Nationale"
fra.2.t:0 "Opération Torch"
fra.2.d:0 "L'objectif de notre état-major est de lancer l'opération Torch, destinée à resserrer l'étau sur les forces ennemies en Afrique du Nord. Pour ce faire, nous devrons nous battre contre nos anciens alliés, les Français, ce qui n'est pas du goût de tout le monde. Cependant, le général Weygand a déjà mis en place un vaste réseau d'espionnage avec les accords Murphy-Weygand. Il a également créé l'Armée D'Afrique qui, bien entraînée, en fait une force imposante et non négligeable, ce qui pouvait clairement faire pencher la balance en notre faveur. De plus, Weygand, très anti-allemand, dispose de nombreux partisans en Afrique. Il est donc possible que cette région se rallie à nous. En France métropolitaine, Vichy reste flou, certains fervents partisans de la collaboration ne seront pas enclins à nous aider, mais il est fort probable que des ordres secrets soient prévus pour nous accueillir et se joindre à nous dans notre combat contre l'Allemagne. La situation est tendue, faut-il lancer l'opération et se battre contre nos anciens alliés ?"
fra.2.a:0 "Déclencher l'opération Torch"
fra.2.b:0 "C'est trop risqué"
newsfml.100.t:0 "La chute de Lyon"
newsfml.100.d:0 "Ce matin, l’ancienne capitale des Gaules est tombée aux mains des envahisseurs allemands. Les troupes françaises ainsi que les tirailleurs sénégalais se sont vaillamment battus dans les villages aux abords de la cité, mais celle-ci a été déclarée ville ouverte afin de limiter les destructions et de protéger sa population, affaiblissant considérablement la défense côté français, de nombreux ponts devant être laissés intacts...Des chars germaniques ont été aperçus sur la place Bellecour, et des motards allemands poussent leur reconnaissance au loin en passant par les berges du Rhône.\nLes Lyonnais, épargnés durant la guerre franco-prussienne et la Grande Guerre, pourraient bien être, cette fois-ci, occupés..."
newsfml.100.a:0 "Quelle victoire !"
newsfml.100.b:0 "Inattendu !"
newsfml.100.c:0 "Quel désastre..."
FRA_Peshkov:0 "Zinovy Peshkov"
FRA_london_provisional_gov:0 "Gouvernement en exile à Londres"
FRA_london_provisional_gov_desc:0 "Il est temps de créer un gouvernement en exil avec nos alliés britanniques et de commencer à être reconnu dans le monde entier comme le gouvernement légitime de la France."
FRA_legitimacy_idea:0 "Gouvernement en exile à Londres"
FRA_legitimacy_idea_desc:0 "Il est temps de créer un gouvernement en exil avec nos alliés britanniques et de commencer à être reconnu dans le monde entier comme le gouvernement légitime de la France."
FRA_2DB:0 "2e division blindée"
FRA_2DB_desc:0 "L'idée d'une force mécanique supérieure prônée par de Gaulle sera mise en œuvre grâce à notre première véritable division de chars. La victoire est à nous !"
war_demand_armistice:0 "Continuer le Combat"
war_demand_armistice_desc:0 "La guerre a très mal commencé et les Allemands contrôlent déjà Paris. Il est peut-être temps de penser à un armistice ou à un autre plan d'action pour poursuivre le combat..."
FRA_path_to_liberation:0 "Préparer la revanche"
FRA_path_to_liberation_desc:0 "Nous devons nous préparer à libérer un jour le territoire métropolitain."
newsfml.120.t:0 "Le miracle de Dunkerque"
newsfml.120.d:0 "Alors que les lignes de défense françaises s'effondrent, leur allié britannique a pris la décision d'évacuer ses troupes du continent, pariant sur le fait que le combat en France est maintenant sans espoir. Les Français ont donc décidé d'utiliser leurs dernières réserves pour sauver leur allié et lui permettre de poursuivre le combat. Ce matin, les soldats français à Dunkerque et dans ses environs ont fini par se rendre après plusieurs jours d'un combat désespéré. Cela a  permis au corps expéditionnaire britannique d'être évacué in extremis, ce qui constitue un tournant dans cette guerre qui semblait mal partie... Il est impossible de savoir combien de temps les combats se poursuivront en métropole après ces défaites successives, mais une chose est sûre : La France a donné le peu qu'il lui restait pour sauver son allié et lui permettre de continuer le combat !"
newsfml.120.a:0 "On ne gagne pas une guerre avec des évacuations..."
FRA_tonkin_mines:0 "Développement des mines du Tonkin"
FRA_tonkin_mines_desc:0 "Le sol de notre colonie d'Indochine regorge de ressources. Quelques investissements pourraient s'avérer très rentables..."
FRA_syria_oil:0 "Développement des puits de pétrole en Syrie"
FRA_syria_oil_desc:0 "Nos géologues ont découvert des gisements de pétrole en Syrie, il ne nous reste plus qu'à les exploiter !"
FRA_hydroelectricity:0 "Développement de l'hydroéléctricité"
FRA_hydroelectricity_desc:0 "En 1935, les "décrets Laval" ont imposé une baisse des prix de l'électricité, pour stimuler la demande. Nous devons continuer de construire de telles infrastructures : des plans sont déjà en cours pour la Centrale hydroélectrique de Génissiat, la Centrale hydroélectrique de Donzère-Mondragon et la Centrale hydroélectrique de Sainte-Croix."
FRA_cef:0 "Corps expéditionnaire français en Italie"
FRA_CEF1:0 "Corps expéditionnaire français en Italie"
FRA_CEF1_desc:0 "Nous devons envoyer un corps expéditionnaire en Italie pour aider nos alliés"
FRA_army_of_africa:0 "Armée D'Afrique"
FRA_army_of_africa_desc:0 "Nous devons intégrer dans notre armée l'Armée d'Afrique, créée sous Vichy par le général Weygand dans le but de libérer notre patrie. Cette armée bien entraînée nous sera plus qu'utile."
FRA_army_of_liberation1:0 "Armée française de la Libération"
FRA_army_of_liberation1_desc:0 "Nous devons reconstruire une armée capable d'aider nos alliés à libérer notre patrie. Avec l'aide de l'Armée d'Afrique de Weygand et d'autres troupes, nous formerons une force capable d'envahir un jour l'Allemagne !"
FRA_army_of_liberation:0 "Reconstruire l'armée"

FRA_move_capital_in_bordeaux:0 "Transférer la capitale à Bordeaux"
FRA_move_capital_in_bordeaux_desc:0 "Paris est menacé et risque de tomber aux mains des envahisseurs. Il faut penser à évacuer l'administration vers une ville sûre, loin des combats. Bordeaux semble être le lieu idéal pour cela !"
FRA_move_capital_back_in_paris:0 "Re-transférer la capitale à Paris"
FRA_move_capital_back_in_paris_desc:0 "Il est temps de réinstaller le gouvernement dans la Ville Lumière !"
FRA_resistance_not_unified:0 "Résistance non-unifiée"
FRA_resistance_not_unified_desc:0 "La résistance en France, bien que présente, n'est pas très unifiée. Les souvenirs de la République refont surface et les différents groupes préfèrent faire la guerre entre eux plutôt qu'à l'occupant. Ces divisions extrêmes nuisent à l'efficacité même des mouvements de résistance, pourtant bien présents."
FRA_spain_forts:0 "Fortifier les Pyrénées"
FRA_spain_forts_desc:0 "Le sud du pays reste toujours un axe d'invasion possible, nous devons couvrir ce secteur pour prévenir une attaque."
germany.337.t:0 "Indécision de l'état major"
germany.337.d:0 "L'état-major de notre pays est divisé sur l'offensive à mener pour détruire la France. Les généraux von Rundstedt et von Block optent pour une offensive similaire au plan Schlieffen de la Grande Guerre. Manstein, quant à lui, opte pour une offensive risquée et audacieuse qui, en cas de succès, donnerait à l'Allemagne une victoire rapide."
germany.337.a:0 "Le Führer aura le dernier mot !"
FRA_maginot_speech2:0 "Drole de guerre"
FRA_maginot_speech:0 "Déclaration de guerre"
daladier_allocution:0 "Déclaration de guerre"
daladier_allocution_desc:0 "Le 26 septembre, il disait : les Allemands des Sudètes sont le dernier des problèmes qui devra être résolu. J'ai assuré à M. Chamberlain qu'une fois ce problème réglé, il n'y aura plus de problèmes territoriaux et le 29 septembre, à la conférence de Munich, il nous affirmait et m'affirmait à moi-même à plusieurs reprises, qu'il ne songeait nullement à annexer les tchèques, qu'il n'en voulait d'ailleurs à aucun prix car il tenait à tenir intacte la pureté de la race allemande. Il réclamait le pays des sudètes où la majorité de la population était de race et de langue germanique. Quoiqu'a-t-on pensé. Mais le 13 mars 1939, Prague était occupée, la bohème envahie, la Tchécoslovaquie toute entière réduite à la servitude. Le 12 septembre 1938 M. Hitler disait encore : L'Allemagne a décidé et elle a promis de considérer les frontières de la Pologne comme irrévocables. C'est pourquoi lorsque monsieur Hitler nous dit aujourd'hui que lorsqu'après avoir détruit la Pologne, il ne demande plus rien, lorsqu'il affirme qu'il ne veut rien de la France, et qu'il respectera ses frontières, Les Français savent qu'il ne manquerait pas, s'il le pouvait, de détruire la France comme il a détruit l'Autriche, comme il a détruit la Tchécoslovaquie, comme il s'acharne à détruire la Pologne. Mein Kamf nous avertit : n'est-il pas écrit qu'il faut isoler la France et l'abattre ?"
RULE_OPTION_FML_EASY_MODE:0 "§GMode Blitzkrieg Désactivé§!"
RULE_OPTION_FML_EASY_MODE_DESC:0 "L'Allemagne IA ne recevra aucun buffs au printemps 1940."
RULE_OPTION_FML_HARD_MODE:0 "§CMode Blitzkrieg facile§!"
RULE_OPTION_FML_HARD_MODE_DESC:0 "L'Allemagne IA recevra des buffs mineures au printemps 1940."
RULE_OPTION_FML_MEDIUM_MODE:0 "§OMode Blitzkrieg moyen§!"
RULE_OPTION_FML_MEDIUM_MODE_DESC:0 "L'Allemagne IA recevra des buffs au printemps 1940."
RULE_OPTION_FML_BLITZ_MODE:0 "§R Mode Blitzkrieg Difficile§!"
RULE_OPTION_FML_BLITZ_MODE_DESC:0 "L'IA Allemande reçevra des buffs §Rmajeurs§! au printemps 1940."
GER_phoney_war:0 "Indécision de l'état major"
GER_phoney_war_desc:0 "L'état-major allemand est divisé entre les vétérans de la Grande Guerre et les officiers plus jeunes et plus audacieux sur le projet d'invasion de la France. Cette situation retarde inévitablement l'offensive..."
GER_fall_gelb_medium:0 "Fall Gelb"
FPM_disjointed_government1:0 "Gouvernement désuni"
 FPM_disjointed_government1_desc:0 "L'état de la politique française est loin d'être stable. Bien que des réformes soient nécessaires et bienvenues, la nation est divisée et se laisser entraîner dans un conflit la mettrait en grand danger." 
fra.1.t:0 "Opération Anton"
fra.1.d:0 "Ce matin, les Alliés viennent de déclarer la guerre à Vichy dans le but de s'emparer de l'Afrique du Nord. Les dirigeants de Vichy sont déterminés à défendre leur territoire, mais il est probable qu'ils souhaitent secrètement rejoindre les Alliés avec l'Armée d'Afrique formée par Weygand. Il est peut-être temps d'envahir la zone "libre" avec l'opération Anton pour pallier à ce risque..."
fra.1.a:0 "Déclencher l'opération Anton"
fra.1.b:0 "Vichy pourrait encore s'avérer utile"
newsfml.114.t:0 "Sabordage de la flotte française"
newsfml.114.d:0 "Il y a 15 jours, l'Allemagne a exécuté l'opération Anton et a mis fin à l'existence de la France de Vichy par peur de son double jeu avec les Alliés. En métropole, les troupes françaises n'ont pas engagé les hostilités avec les Allemands par crainte de représailles sévères contre la population locale. Malgré cela, Toulon n'a pas tout de suite été occupé par l'armée allemande. Mais, les marins français de Toulon, sous les ordres de l'amiral Darlan, voyant les Allemands se rapprocher pour tenter un coup de main et saisir leur flotte complète, ont sabordé l'ensemble de la Marine de guerre pour éviter qu'elle ne tombe aux mains de l'ennemi. Un revers important pour l'Allemagne qui se voyait récupérer cette importante flotte pour son effort de guerre..."
newsfml.114.a:0 "Le baroud d'honneur des marins français !"
FRA_de_gaulle2_desc:0 "Pour la Patrie !"
FRA_de_gaulle2:0 "La mort avant le déshonneur"
FRA_improvised_weapons:0 "Armes improvisées"
FRA_improvised_weapons_desc:0 "Quand le résistant n'a rien pour se battre, il improvise ! Voler, récupérer et fabriquer des armes de toutes sortes est un art dans lequel le résistant français est passé maître."
FRA_sabotages:0 "Sabotages Français"
FRA_break_german_lines:0 "Détruire la logistique Allemande"
FRA_break_german_lines_desc:0 "Pour réduire l'effort de guerre allemand, attaquons ses communications et ses infrastructures"
FRA_royalists_resistance:0 "Coopération avec les Royalistes"
FRA_cooperation_with_the_royalists:0 "Coopérer avec les Royalistes"
FRA_cooperation_with_the_royalists_desc:0 "Malgré les divisions internes et le fait que le chef de l'Action française, Charles Maurras, soit resté à Vichy, de nombreux résistants, issus de milieux monarchistes, sont déterminés à se battre."
FRA_paris_question:0 "Prendre une décision pour Paris"
FRA_infantry_cavalry:0 "Rivalités entre Infanterie et Cavalerie"
FRA_infantry_cavalry_desc:0 "Le développement de l'excellent char SOMUA 35 met en lumière la rivalité entre les armes d'infanterie et de cavalerie. La cavalerie n'étant pas autorisée à produire des chars, elle les produit sous le sigle "Automitrailleuse". Cette rivalité est préjudiciable au développement des doctrines et des blindés."
FRA_medium_armor_focus:0 "Mettre le S35 en production"
FRA_military_police:0 "Gendarmerie"
FRA_military_police_desc:0 "La gendarmerie fait office de police militaire en France. La police militaire maintient l'ordre et réprime la résistance dans les territoires occupés."
FRA_MAURRAS:0 "Royaume de France"
FRA_BOURBON:0 "Royaume de France"
FRA_ORLEANS:0 "Royaume de France"
FRA_fascism_party_francisque:0 "Mouvement Franciste"
FRA_fascism_party_leagues:0 "Ligues d'extrême droite"
VICTORY_POINTS_5291:0 "Verdun"
FRA_bainville_legacy2:0 "Héritage de Jacques Bainville"
FRA_bainville_legacy3:0 "Héritage de Jacques Bainville"
FRA_bainville_legacy:0 "Héritage de Jacques Bainville"
FRA_bainville_legacy_desc:0 "Jacques Bainville a été l'une des figures les plus importantes du mouvement. Ses écrits sont une référence, même pour ses adversaires qui reconnaissent son intelligence et sa valeur. L'un de ses ouvrages, "Les Conséquences Politiques de la Paix", est un cri d'alarme sur les questions de sécurité nationale après le Traité de Versailles, dont il faut tenir compte !"
FRA_revolution_ideas2:0 "Idées de la Révolution"
FPM_austerlitz_legacy:0 "Héritage d'Austerlitz"
FRA_austerlitz_legacy:0 "Héritage d'Austerlitz"
FRA_austerlitz_legacy_desc:0 "La bataille d'Austerlitz est l'une des plus grandes victoires de l'empire. Nous devons nous en inspirer !"
FRA_our_old_allie:0 "Contacter notre ancien Allié"
FRA_our_old_allie_desc:0 "L'Espagne était un allié fiable avant que Napoléon Ier ne tente de voler la couronne espagnole. Peut-être pourrions-nous essayer de recréer cette alliance."
FRA_attack_spain:0 "Rétribution pour la guérilla"
FRA_attack_spain_desc:0 "Notre ancien allié espagnol nous a poignardés dans le dos pendant la guerre de la Péninsule. Ces Espagnols fourbes ont même mené une guérilla contre nos troupes, prouvant ainsi qu'ils n'ont aucune valeur..."
FPM_heir_to_the_empire2:0 "Héritier de l'Empire"
FRA_empire_francais:0 "Système Continental"
FRA_maurras_alliance:0 "Bloc Latin"
FRA_leon_daudet:0 "Léon Daudet"
FRA_6_february_34_winner:0 "Vainqueur de la Crise du 6 février 1934" 
FPM_polemist:0 "Polémiste" 
FRA_true_enemy:0 "Les véritables enemis"
FRA_true_enemy_desc:0 "La IIIe République a été fondée sur les juifs et les francs-maçons, tout comme les systèmes marxistes.  Il faut libérer la France de ces sectes et lui montrer la seule voie possible : Jésus."
FRA_the_true_enemy:0 "Les véritables enemies"
FRA_the_true_enemy_desc:0 "Les éléments indésirables de la société, à savoir les juifs, les francs-maçons et les communistes, doivent être expulsés."
FRA_go_with_belgium:0 "Alliance Franco-Belge"
FRA_go_with_belgium_desc:0 "Bainville nous prévient qu'après le Traité de Versailles, le seul véritable allié de la France est la Belgique. Après les erreurs successives de nos hommes d'État, la Belgique s'enfonce peu à peu dans la neutralité, et il est temps de lui montrer le vrai chemin à nos côtés."
FRA_orient_diplomacy:0 "L'axe Varsovie-Budapest"
FRA_orient_diplomacy_desc:0 "Maurras a plaidé en faveur de la création d'un axe Varsovie-Budapest, auquel la France devrait s'aligner. Nous devrions tendre la main aux États qui le composent."
FRA_hegemony_francais:0 "Génie Français"
FRA_hegemony_francais_desc:0 "Notre pays, même après avoir été détruit par la République, regorge encore d'un magnifique sens du génie national. Il est temps d'en faire bon usage."
FRA_6_34:0 "Célébrer le 6 Février 1934"
FRA_6_34_desc:0 "Le 6 février 1934, nous avions presque détruit la République. Maintenant que c'est fait, il est temps de célébrer cette date qui marque le début de notre lutte acharnée contre la décadence."
FRA_enforce_versailles:0 "Enforcer le traité de Versailles"
FRA_enforce_versailles_desc:0 "Comme Bainville l'avait prédit, l'Allemagne n'a pas respecté le traité de Versailles de très nombreuses fois. Il est temps de la remettre dans le droit chemin."
FRA_papal_states:0 "Restaurer la Paupautée"
FRA_papal_states_desc:0 "L'Italie unifiée met le Pape à l'écart, il est temps que cela cesse. La France est la fille aînée de la chrétienté !"
FRA_patriotisme:0 "Détruire l'idéologie Républicaine"
FRA_patriotisme_desc:0 "Pendant des années, la République s'est installée, détruisant l'âme même de la France : l'autonomie régionale, le christianisme, etc... Tout cela a été détruit pour centraliser la France. Aujourd'hui, ce temps est révolu !"
FRA_prepare_for_germany:0 "L'Erreur de 1871"
FRA_prepare_for_germany_desc:0 "La défaite de 1871 s'est produite à un moment où la France était isolée diplomatiquement face à une Allemagne en pleine expansion. Le contexte actuel est exactement le même, grâce au terrible traité de Versailles rédigé par nos parlementaires."
FRA_up_with_jean_darc2:0 "Vénérer Jeanne d'Arc"
FRA_up_with_jean_darc2_desc:0 "Il est temps de montrer aux enfants de France un vrai héros chrétien combattant !"
FRA_1866_memories:0 "Jamais d'autres Sadowa"
FRA_1866_memories_desc:0 "Sadowa marque l'expansion et l'agressivité de la Prusse. À l'époque, elle n'a pas été prise au sérieux et le sort de la France a été désastreux. Aujourd'hui, avec une Allemagne belliqueuse, nous nous trouvons dans une situation similaire et nous devons donc nous réarmer pour ne pas commettre à nouveau la même erreur."
FRA_reestablish_austria_hungary:0 "Réorganiser les petits États"
FRA_reestablish_austria_hungary_desc:0 "L'émiettement des petits États créés autour de l'Allemagne est vivement dénoncé par Bainville. Selon lui, ces États, incapables d'exercer une quelconque influence, se soumettront tôt ou tard à l'Allemagne. Il faut prendre ces idées au sérieux et détruire ces États pour reformer un royaume austro-hongrois qui aura du poids."
FRA_form_austria_hungary:0 "Faire renaitre l'aigle à deux têtes"
FRA_form_austria_hungary_desc:0 "L'Autriche-Hongrie, détruite à la fin de la Grande Guerre, doit être rétablie pour peser face à l'Allemagne."
FRA_disunite_germany2:0 "Détruire l'oeuvre de Bismarck"
FRA_disunite_germany2_desc:0 "Comme l'a dit Bainville, il faut désunir l'Allemagne et détruire le militarisme prussien pour se préparer à de nouvelles attaques."
FRA_disunite_italy2:0 "Le coeur du Catholicisme"
FRA_disunite_italy2_desc:0 "Les États pontificaux ont été le cœur du catholicisme pendant des siècles. Il est temps de les recréer !"
laval_trait:0 "Pacifiste Résolu"

###armistice event####
france.785.t:0 "Refus des Américains"
france.785.d:0 "Le Président [USA.GetLeader] a répondu aujourd'hui à l'appel à l'aide lancé par le télégramme français par une réponse négative, soulignant que l'esprit combatif des armées alliées l'avait fortement impressionné. Ce discours laisse entendre que les Américains sont encore loin d'être prêts à réellement s'engager à nos côtés..."
france.785.a:0 "La situation est très grave !"
france.10.t:0 "La Ville Lumière s'assombrit"
france.10.d:0 "Notre armée est repoussée de toutes parts et les Allemands sont entrés dans Paris aujourd'hui. Après avoir hissé leur drapeau sur la Tour Eiffel, les troupes allemandes ont défilé sur les Champs-Élysées. Le gouvernement s'est déplacé à Bordeaux pour poursuivre le combat, mais il est clair qu'il faut maintenant trouver une réponse appropriée à cette situation catastrophique..."
france.10.e:0 "La France n'est pas encore vaincue !"
france.781.t:0 "Le Gouvernement de [FRA.GetLeader] tombe"
france.781.d:0 "Le gouvernement de [FRA.GetLeader] n'ayant pas réussi à trouver une solution viable et précise pour poursuivre la guerre, le Maréchal Pétain, héros de la Grande Guerre et vainqueur de Verdun, a pris la tête du pays. Les hommes de la République ont fui ou sont accablés et impuissants face à une situation qui se dégrade chaque heure. La France est au bord de l'agonie et le Maréchal demande aujourd'hui à l'ennemi les conditions pour établir un armistice et sauver ce qui peut l'être. D'autre part, un certain général de Gaulle, réfugié en Angleterre, s'est exprimé sur les ondes de la BBC, appelant à ne pas écouter le gouvernement et à rejoindre son mouvement pour continuer le combat. Même si son mouvement est peu écouté, certains commencent déjà à le rejoindre en très petit nombre..."
france.781.a:0 "Il faut demander l'Armistice.."
france.781.b:0 "Il faut continuer le Combat !"
france.783.t:0 "Projet d'Union Franco-Britanique"
france.783.d:0 "Un projet d'Union franco-britannique conçu par Jean Monnet a été présenté aujourd'hui aux gouvernements français et britanniques. La situation exceptionnellement grave dans laquelle se trouvent les deux nations à l'heure actuelle exige que ce projet fou soit pris au sérieux. Les deux pays, ennemis depuis des siècles, ne feraient plus qu'un pendant la durée de la guerre, avec un commandement, des citoyens, un territoire qui seraient à la fois Français et Anglais. L'opposition est forte de part et d'autre, les Français en particulier craignant de passer sous la coupe des Britanniques..."
france.783.a:0 "Une idée stupéfiante, mais la seule qu'il nous reste..."
france.783.b:0 "Nous ne deviendrons pas une Colonie Anglaise !"
FRA_de_gaulle_desc:0 "Le gouvernement demande à l'armée un dernier effort pour la patrie !"
USA_oudtated_mil:0 "US Army"
USA_oudtated_mil_desc:0 "En 1917, les États-Unis ont connu la guerre moderne pour la première fois. Notre armée n'a pas été modernisée depuis la Première Guerre mondiale et n'est pas préparée au conflit actuel. Nos alliés devront former nos troupes, comme ils l'ont fait en 1917 et 1918, pour compenser ce manque de préparation. Notre armée devra relever des défis avant de pouvoir être modernisée"  
franceusa.778.a:0 "Le destin de la France en dépend..."
france.778.b:0 "La France peut encore tenir seule !"
franceusa.778.d:0 "La France a joué un rôle essentiel dans l'indépendance des États-Unis, mais elle se trouve aujourd'hui dans une situation difficile. Dans un dernier effort pour maintenir l'unité nationale et rester dans la guerre, le gouvernement français pourrait demander l'aide des États-Unis. Grâce à leur économie solide et à leur main-d'œuvre abondante, les États-Unis ont le potentiel nécessaire pour renverser la vapeur dans ce conflit. Appelons les Doughboys !"
franceusa.778.t:0 "Un télégramme pour le président [USA.GetLeader] ?"
france.777.a:0 "Faire un Réduit Breton"
france.777.b:0 "Continuer la lutte en Afrique du Nord"
france.777.c:0 "Se replier sur Bordeaux"
france.777.t:0 "Ou se replier ?"
france.777.d:0 "Les généraux de Gaulle et Weygand font tous deux pression sur le gouvernement pour qu'il choisisse un plan de poursuite des combats. De Gaulle opte pour le Réduit Breton : Si les lignes rompent, l'armée pourra se replier chez nos amis anglais. Weygand, quant à lui, soutient le repli sur l'Afrique du Nord comme la meilleure option possible dans cette horrible situation... Le gouvernement lui préconise de se replier sur Bordeaux, n'écoutant pas vraiment Weygand et De Gaulle même si la ville semble indéfendable..."
france.779.a:0 "Le destin de notre vieil allié en dépend"
france.779.b:0 "Nous ne pouvons pas nous le permettre"
france.779.d:0 "La France a joué un rôle essentiel dans l'indépendance des États-Unis, mais elle se trouve aujourd'hui dans une situation difficile. Dans un dernier effort pour maintenir l'unité nationale et rester dans la guerre, le gouvernement français demande de l'aide à notre nation, rappelant l'aide qu'elle a pu fournir durant la guerre pour notre indépendance. Selon les paroles du gouvernement, notre intervention liée à nos capacités industrielles pourrait bien faire pencher la balance dans leur camp, seulement est-ce que notre population et nos intérêts seraient en accord avec cette difficile proposition..."
france.779.t:0 "Un télégramme urgent de la France"
france.780.t:0 "Pressions pour l'Armistice"
france.780.d:0 "De nombreux membres du gouvernement sont favorables à un armistice, qui permettrait de sauver la France d'une défaite horrible et de "sauver les meubles". Le Maréchal Pétain et le général Weygand en sont de fervents partisans, ce qui éviterait aussi une capitulation honteuse en rase campagne. D'autres, comme le général De Gaulle, ont appelé à poursuivre le combat en Angleterre, même si leur voix n'a pas été beaucoup entendue. Enfin, on pourrait poursuivre le combat en métropole, mais comme le dit Weygand, il faut un objectif précis, sinon l'armée risque d'être inutilement sacrifiée. De nombreux responsables politiques ont déjà fui, ce qui rend cette tâche difficile..."
france.780.a:0 "Il faut demander l'Armistice..."
france.780.b:0 "Il faut continuer le combat chez nos alliés !"
france.780.c:0 "Il faut continuer le combat en Métropole !"
FRA_retreat_colonies:0 "Retraite dans les colonies"
FRA_retreat_colonies_desc:0 "La métropole étant occupée, le gouvernement a décidé de se replier dans ses colonies pour poursuivre la lutte."
france.31.t: "[FRA.GetLeader] démissionne"
france.31.d: "Avec l'effondrement de la Troisième République et le refus du gouvernement [GER.GetAdjMS] d'offrir un armistice, de nouveaux dirigeants doivent poursuivre le combat depuis les colonies. On ne peut jeter le discrédit sur les actions de [FRA.GetName] en tant que président du Conseil, et les circonstances extraordinaires auxquelles [FRA.GetLeLaLNP] [FRA.GetName] [FRA.GetAOntNP] été confronté[FRA.GetXENP] ne [FRA.GetLuiLeurNP] ont pas laissé la moindre chance. Nous ne pouvons qu'espérer qu'au bout du tunnel dans lequel [FRA.GetIlElleNP] s'engag[FRA.GetEEntNP] [FRA.GetIlElleNP] pourr[FRA.GetAOntNP] trouver la lumière."
france.31.b: "Pétain nous guidera"
france.31.c:0 "Mettez Mandel aux commandes."
FRA_determined_to_resist:0 "Le premier résistant"
####end armistice event ###

FRA_phoney_war2:0 "La drôle de guerre"
little_clemenceau:0 "Le Petit Clemenceau"
FRA_nuclear_effort:0 "Gerboise Bleue"
FRA_nuclear_effort_desc:0 "Des murmures sur les super-armes et les énergies atomiques peuvent être entendus dans les coins les plus profonds de l'establishment scientifique français. Nous devons exploiter ces développements avant que nos ennemis ne le fassent et procéder immédiatement à un essai nucléaire. La puissance de l'atome peut nous donner une arme comme l'humanité n'en a jamais vue." 
FRA_edouard_herriot:0 "Édouard Herriot"
FRA_support_ethiopia:0 "Aider l'Éthiopie"
FRA_support_ethiopia_desc:0 "En exemple de dévouement et de résistance à l'oppression, les Éthiopiens résistent farouchement à l'envahisseur, nous devrions les aider !"
sick_officer:0 "Général Malade"
sick_officer_desc:0 "§LCet officier a des problèmes médicaux qui affectent ses capacités.§!"
fpmcagoule.1.t:0 "La Cagoule"
fpmcagoule.1.d:0 "Une organisation française, connue sous le nom de "La Cagoule", nous a récemment contactés pour nous demander de l'aider à déstabiliser, voire à renverser le gouvernement de gauche en place à Paris. Bien qu'il soit peu probable que leur objectif de renverser le gouvernement puisse être atteint, ils pourraient tout de même causer un certain chaos en France, si nous leur fournissions des armes. En outre, le groupe pourrait s'avérer utile pour éliminer certains exilés politiques en France, qui continuent à ce jour à s'élever contre notre régime."
fpmcagoule.1.a:0 "Donnons à ce groupe 'la Cagoule' ce qu'il demande..."
fpmcagoule.1.b:0 "Un gaspillage de ressources pour très peu de bénéfices." 
fpmcagoule.2.t:0 "Augmentation des assassinats"
fpmcagoule.2.d:0 "Au cours des derniers mois, les assassinats se sont multipliés en France. En janvier, Dimitri Navachine, conseiller du Front populaire et exilé de l'Union soviétique, a été assassiné en plein jour. D'autres cas notables sont ceux de Carlo Rosselli et Nello Rosseli, deux antifascistes italiens opposés au régime fasciste de Rome, qui ont également été tués. D'autres cas mineurs incluent Laetitia Toureaux, dont le meurtre a également attiré l'attention. Néanmoins, les implications sont claires. Quelqu'un en France commet ces meurtres, très probablement à des fins politiques. Nous devons nous demander de qui il s'agit."
fpmcagoule.2.a:0 "Assez préoccupant"
fpmcagoule.3.t:0 "Attentats à la bombe à l'Étoile"
fpmcagoule.3.d:0 "Des explosions ont secoué Paris aujourd'hui dans des bâtiments appartenant à des associations de fabricants français, tuant 2 personnes et en blessant certainement beaucoup d'autres. Alors que beaucoup soupçonnent les communistes d'être à l'origine de ces attaques, ils ont démenti, et en effet, une enquête plus poussée montre qu'il pourrait y avoir plus derrière le complot, puisque des militants d'extrême droite liés à un groupe connu seulement sous le nom de 'La Cagoule', semblent être impliqués. L'actuel ministre de l'intérieur, Marx Dormoy, a décidé d'enquêter plus avant sur ce groupe."
fpmcagoule.3.a:0 "Il faut faire toute la lumière sur cette affaire !" 
fpmcagoule.4.t:0 "Coup d'État fasciste découvert"
fpmcagoule.4.d:0 "Le groupe fasciste, connu simplement sous le nom de "La Cagoule", dont on sait maintenant qu'il est responsable des assassinats et des attentats à la bombe de l'année dernière, a été complètement infiltré, et après une tentative de coup d'État ratée par le groupe ces derniers jours, qui était vouée à l'échec dès le départ, la police a commencé à sévir contre le groupe, en arrêtant les membres et en saisissant les armes, qu'ils possédaient en grand nombre, dont beaucoup étaient d'origine italienne. Une fois le groupe maîtrisé et les mesures de sécurité renforcées, il semble que la France n'ait plus à craindre la menace de 'La Cagoule'..."
fpmcagoule.4.a:0 "Ils n'ont jamais été une grande menace au départ."
fpmcagoule_tt:0 "La Cagoule pourrait déstabiliser §Yla France§!."
FPM_banleaguebacklash_tt:0 "Cette action pourrait avoir des répercussions mineures, sous la forme de §Y'La Cagoule'§!."
FRA_imperial_plebiscite:0 "Plébiscite impérial"
FRA_imperial_plebiscite_desc:0 "Ce n'est pas parce que l'empereur dirige la France en tant que monarque que les souhaits et les désirs de la population française peuvent être négligés. Nous soumettrons au vote des questions et des initiatives importantes sur lesquelles le gouvernement souhaite agir, afin que le peuple de France puisse s'exprimer."
FPM_resolute_socialist:0 "Socialiste résolu"
GER_BLITZKRIEG:0 "Blitzkrieg (Prioritées historiques seulement)"
france.345.t:0 "Paris ville ouverte ?"
france.345.d:0 "Nos lignes sont percées et les Allemands se trouveront bientôt aux portes de Paris. Une seconde victoire de la Marne, comme en 1914, semble impossible et le gouvernement a déjà commencé à prendre la fuite. Le généralissime Weygand, en accord avec [FRA.GetLeader] De ne pas défendre la capitale, ce qui la transformerait en un champ de bataille la détruisant probablement entièrement, tout en faisant souffrir les Parisiens. Il soutient de se replier plus au sud avec le reste de l'armée, voire tenir sur la Loire. De Gaulle, lui, veut à tout prix défendre la capitale pour l'honneur et débat vigoureusement sur cela, bien que Weygand rappelle les sacrifices humains et matériels que cela demanderait..."
france.345.a:0 "Weygand a raison !"
france.345.b:0 "De Gaulle a raison !"
france.351.t:0 "Pourquoi mourir pour Dantzig ?"
france.351.d:0 "Cette phrase, "Pourquoi mourir pour Dantzig", née dans l'article de l'éminent néo-socialiste Marcel Déat, s'est répandue dans toute la société. De nombreux Français, toutes tendances politiques confondues, sans doute en raison de la désunion de notre gouvernement, ont affirmé que la France n'avait aucun intérêt à participer à une nouvelle guerre européenne, comme celle qui a dévasté notre pays en 1914-1918, il y a si peu de temps. En effet, les positions pro-allemandes ont connu un regain à droite, en particulier au sein de l'Alliance démocratique et de la Fédération républicaine, les deux principaux partis de droite du pays. De même, il reste un important contingent pacifiste à gauche, qui est toujours présent depuis l'époque de Jean Jaurès."
france.351.a:0 "De toute façon, ce sont les Polonais qui mourront les premiers."

FRA_paguezy:0 "Jacques Henri Pagézy" 
FRA_incompetent_officer:0 "Officer Incompétent " 
VIC_chantier_de_la_jeunesse:0 "Chantiers de la Jeunesse" 
VIC_chantier_de_jeunesse:0 "Chantiers de la Jeunesse"
VIC_chantier_de_jeunesse_desc:0 "L'Armistice nous interdit de reconstruire une armée trop grande et de rétablir le service militaire obligatoire. Ces chantiers de la Jeunesse permettront aux jeunes de garder une bonne forme physique et intellectuelle. Ces jeunes apprendront un métier et réaliseront des tâches concrètes et, dans une ambiance militaire, ils seront formés à un nouveau patriotisme qui manquait au régime d'antan..."
FRA_up_with_jean_darc:0 "Vénérer Jeanne d'Arc"
FRA_up_with_jean_darc_desc:0 "Jeanne d'Arc a combattu bravement un ennemi semblant invincible, n'hésitant pas à tout sacrifier pour la patrie, et parvenant à rallier le pays sous sa bannière pour bouter l'envahisseur hors de France. Elle est assurément un symbole bien plus approprié pour la jeunesse que cette Marianne."
FRA_hartung:0 "Jules Hartung"
FRA_esperey:0 "Louis Franchet d'Espèrey"
france.341.t:0 "Exposition Universelle de 1937"
france.341.d:0 "L'Exposition Internationale des Arts et Techniques dans la Vie Moderne prend fin. Malgré son bilan économique désastreux, elle a néanmoins permis de faire rayonner notre pays aux yeux du monde !"
france.341.a:0 "Vive la France !"
france.343.t:0 "La Belgique se retire des accords franco-belges"
france.343.d:0 "Les Belges, avec la réoccupation allemande de la Rhénanie, ont malheureusement décidé de se retirer des accords franco-belges que nous avons signés en avril 1920. Si leur raisonnement de neutralité est noble, on ne peut que rappeler ce que la neutralité leur a apporté en 1914. Le résultat final est l'affaiblissement des plans de guerre français, nous empêchant de prendre des positions avancées en Belgique en cas d'attaque allemande, ce qui pourrait bien nous obliger à combattre à nouveau sur le sol français..."
france.343.a:0 "Les imbéciles !"
newsfml.112.t:0 "Exposition Universelle de 1937"
newsfml.112.d:0 "L'Exposition Internationale des Arts et Techniques dans la Vie Moderne, qui avait commencé à Paris au trocadéro, s'est terminée. La plupart des nouvelles constructions seront temporaires, il y aura cependant quelques exceptions comme le palais de Chaillot, le palais de Tokyo ou le palais d'Iéna, par exemple. La note pour la France est sévère, elle n'aura rentabilisé l'événement qu'à hauteur de 12% ! Tout cela dans un moment où l'économie française est déjà fragile... Les pavillons nationaux russes et allemands ont aussi fait forte impression, une propagande efficace pour ces deux états ! L'événement aura attiré des millions de visiteurs et placé la France au cœur de l'attention internationale. Mais alors que le monde admire ces réalisations, l'ombre de la guerre à venir semble déjà peser sur l'Europe..."
newsfml.112.a:0 "Vive la France !"
france.340.t:0 "Fusillade à Clichy"
france.340.d1:0 "Alors que De La Rocque tenait une réunion des Croix de Feu à Clichy, fief de la SFIO, de nombreux militants socialistes et communistes ont entamés une contre-manifestation pour dénoncer la conférence. Un millier de ces contre-manifestants ont tentés de pénétrer dans le cinéma où se tenait la réunion et, bien que l'événement était sous la protection de la ligue, il a rapidement dégénéré. Des coups de feu ont été tirés et des militants de la Ligue sont intervenus.\n\nBilan : 12 morts et 832 blessés. La division politique de la France est encore très présente, la gauche appelle maintenant à l'arrestation de Doriot et De La Rocque en tant que fascistes. Les radicaux et les communistes se disputent dans l'hémicycle, et à l'Internationale cela évoque le souvenir de la Commune de 1871."
france.340.d2:0 "Alors que De La Rocque faisait un meeting du PSF à Clichy dans un bastion de la SFIO, de nombreux militants Socialistes et Communistes ont fais irruption dans un contre-manifestation pour dénoncer cette conférence. Un millier de ces contre-manifestants ont tentés de pénétrer a l'intérieur du cinéma ou se tenait le rendez-vous et meme si l'évènement était encadré par la police, il a rapidement dégénéré. Des coups de feu ont retenti, la garde mobile intervient! Résultat: 8 morts et 555 blessés. La division politique de la France est encore vive. La Gauche demande l'arrestation de Doriot et De La Rocque vu comme Fascistes. Les Radicaux et Communistes se disputent à la Chambre, et à l'Internationale on parle déja du souvenir de la Commune de 1871.\nLe Front Populaire n'as décidement pas unis les Français..."
france.340.a:0 "La cohésion du Front Populaire s'effrite..."
FRA_daladier_factory_strikes:0 "Contestation de la révision des accords de Matignon"
FRA_mittelhauser:0 "Eugène Mittelhausser"
tunisia.333.t:0 "Ahmad II décède"
tunisia.333.d:0 "Le souverain Ahmad II est décédé ce matin. Trop proche des instances Françaises il était très critiqué par les mouvements de résistances. Le monarque Moncef Bey est appeler à prendre le pouvoir."
tunisia.333.a:0 "Repose en paix"
tunisia.334.t:0 "Moncef Bey est remplacé"
tunisia.334.d:0 "Le souverain Moncef Bey à été remplacé par nos gouverneurs coloniaux car accusé d'etre trop proche des mouvements indépendantistes.Lamine Bey est appelé a monter sur le trone Tunisien."
tunisia.334.a:0 "Une perte pour notre pays"
france.332.t:0 "L'héritage de l'affaire Stavisky"
france.332.d:0 "L'affaire Stavisky, qui avait mis en lumière la corruption de plusieurs hommes politiques ainsi que la négligence et l'incompétence des services publics dans la conduite de l'enquête, avait, deux ans auparavant, enflammé les ligues d'extrême droite. En conséquence, le 6 février 1934, la République était sur le point de tomber aux mains des Camelots du Roy, des Jeunesses Patriotes, des différentes ligues d'anciens combattants et du Mouvement Franciste. Seul le refus de de la Rocque d'envoyer la Croix de Feu prendre d'assaut le Palais Bourbon sauva la Troisième République, mais les émeutes entraînèrent la chute des cabinets Chautemps et Daladier, ouvrant la voie à une ère de gouvernance conservatrice, tout en unissant la gauche au sein du Front populaire... Le procès dans cette affaire devrait bientôt se terminer par 9 condamnations, dont 2 députés : Gaston Bonnaure et Joseph Garat."
france.332.a:0 "Ce désastre est enfin derrière nous !"
FRA_audet:0 "Sylvestre Gérard Audet"
GER_BLITZKRIEG:0 "Blitzkrieg"
RULE_OPTION_FML_HARD_MODE:0 "Mode de jeu Blitzkrieg activé"
RULE_OPTION_FML_HARD_MODE_DESC:0 "L'IA de l'Allemagne reçevera un buff pour réussir a envahir le Bénélux ce qui est difficile pour elle en vanilla à cause de l'ajout de la drole de guerre."
FLM_billotte_die:0 "§YGaston Billotte§! meurt."
FLM_giraud_captured:0 "§YHenri Giraud§! est capturé."
france.331.t:0 "Des pertes d'officiers"
france.331.d:0 "Le général Billotte est mort ce jour d'un accident de voiture sur une partie du front en partant d'une conférence alliée. Il est certain que la mort d'un tel général d'armée ne peut qu'avoir des effets négatifs sur notre situation à court terme....\n D'un autre côté, le réputé sans peur général Giraud vient d'être capturé par les Allemands. Après avoir tout fait pour tenter de s'évader, il s'est résolu à se rendre... Il est sûr que ce chef roublard et énergique ne manquera pas une occasion pour s'échapper, mais il reste tout de même le problème de le remplacer entre-temps !"
france.331.a:0 "Des héros qui ne seront pas oubliés"
france.330.t:0 "Exode Massif"
france.330.d:0 "Les Allemands ayant percé nos lignes et celles de la Belgique, des millions de civils du Benelux et de France partent de chez eux et fuient les envahisseurs, craignant l'occupation. Bientôt 8 millions de personnes se joignent à cet exode, créant un pays dans le pays et paralysant les routes pour l'armée..."
france.330.a:0 "Il faut absoulument remettre cela en ordre!"
FRA_larminat:0 "Edgard de Larminat"
Fra_op_dynamo:0 "Opération Dynamo"
war_help_british:0 "Opération Dynamo"
war_help_british_desc:0 "Les Anglais ont besoin de notre aide pour rembarquer, la situation de la bataille de France est catastrophique, nous devons faire barrage et aider nos alliés dans leur évacuation. Si l'Angleterre survit, la lutte continuera, même si cela implique de détruire notre armée dans une dernière défense suicidaire..."
weygandcooldown:0 "Cooldown"
war_stop_exode:0 "Stopped l'exode"
war_stop_exode_desc:0 "La police et la Gendarmerie doivent tout mettre en oeuvre pour stopper l'exode, accueillir les réfugiés et rétablir des voies de transport fiables pour nos troupes au plus vite !"
belgium_defense:0 "Protéger la Belgique"
belgium_defense_desc:0 "Depuis toujours la France est envahis par le Nord, il est donc important que la Belgique s'aligne sur nos point de vue en matière de défense ou nous pourrions etre en danger."
reynaud_allocution:0 "Allocution du Président du Conseil Paul Reynaud"
reynaud_allocution_desc:0 "Mesdames, messieurs, vous allez entendre M. Paul Reynaud, président du conseil. L'heure que nous vivons est décisive, au cours des longs siècles de notre histoire, il n'y en a eu peu de semblables. La situation est claire et elle est simple. En mars 1936, la Reichwehr est entrée en Rhénanie. En mars 1938, elle est entrée à Vienne, en mars 1939 à Prague puis à Memel, en septembre 1939 à Varsovie, dépeçant la Pologne avec la complicité des Soviets. Comme le crime suscite, le crime, ce fut l'agression soviétique contre l'héroïque Finlande et le traité d'oppression qui a suivi. A l'heure où je parle, tout est mis en oeuvre par M. Hitler Pour s'attaquer à l'indépendance économique des États balkans. Bref, sous nos yeux, par tous les moyens, tente de s'établir sur une grande partie de l'Europe, l'hégémonie du Reich."
FRA_dyle_plan:0 " Plan Dyle"
FRA_dyle_plan_desc:0 "L'état-major général a proposé plusieurs plans pour une guerre dans les Pays-Bas. Parmi ceux-ci, le plan E (Escaut) et le plan D (Dyle) sont les plus remarquables. Le plan Escaut prévoit la défense d'une bande relativement étroite de la Belgique, principalement le long de la frontière française. Le plan Dyle, en revanche, est plus radical et propose de défendre le centre de la Belgique le long de la Dyle. Une variante propose même de rejoindre les Néerlandais à Breda."
france.339.t:0 "Choisir un Plan"
france.339.d:0 "L'état-major de Gamelin est divisé sur le plan à choisir pour la prochaine guerre sur le continent, Gamelin préconise le Plan Dyle-Breda qui a l'avantage de couvrir intégralement nos alliés belges et néerlandais mais qui engagerait toutes nos réserves. D'autres généraux comme Giraud sont partisans d'une aide plus rationelle envers la Belgique seulement, qui aurait comme but de soutenir notre allié de la Grande Guerre tout en gardant nos précieuses réserves stratégiques au cas où une percée nous surprendrait!"
france.339.a:0 "Gamelin a raison, aidons le Benelux !"
france.339.b:0 "C'est bien trop risqué, Giraud à raison"
FRA_dyle_breda:0 "Plan Dyle-Breda"
FRA_escaut:0 "Plan Escaut"
FRA_coordinated_army:0 "Coordination Interarmes"
FRA_coordinated_army_desc:0 "Notre armée est en deux parties : l'une est moderne, l'autre appartient à une autre époque... L'une des principales lacunes est la réticence à adopter les radios au niveau des combattants, ce qui permettrait un combat conjoint efficace."
# FRA_victors_of_wwi:0 "Armée de Terre"
FRA_infantry_equipment_0:0 "Fusil Berthier M16"
FRA_infantry_equipment_0_short:0 "Berthier M16"
FRA_down_with_marianne:0"Abattre Marianne"
FRA_down_with_marianne_desc: "Ce culte quasi religieux adressé à Marianne, le symbole de la République française dévoyée, a embrumé l'esprit des Français. Mais elle est aussi inutile que cette République dont elle est l'allégorie, et toute trace d'elle doit être effacée."
FRA_not_another_trafalgar:0 "Jamais d'autre Trafalgar"
FRA_not_another_trafalgar_desc:0 "La seule chose qui a empêché Napoléon 1er d'envahir l'Angleterre fut la Bataille de Trafalgar, nous avons appris de nos erreurs cette fois-ci !"
FRA_revolution_ideas:0 "Idées de la Révolution"
FRA_revolution_ideas_desc:0 "Napoléon 1er a déjà tenté d'instaurer les idées de la Révolution dans notre pays, mais nos voisins se sont alliés pour le faire tomber. Veillons à ce que cela ne se reproduise pas !"
FRA_up_with_jean_darc2:0 "Glorifier Jeanne-D'Arc"
FRA_empire:0 "Un Empire qui renait"
FRA_empire_desc:0 "Les 1er et 2ème Empires ont façonné la France à jamais, la rendant plus forte et plus unie, comme le dit le proverbe : jamais deux sans trois, et celui-ci, le plus abouti, conduira la France à une grandeur jusqu'alors oubliée."
BEL_bad_army:0 "Armée négligée"
FRA_mediumtank:0 "Lignes de productions de Chars"
FRA_georges_mandel:0 "Georges Mandel"
artillery_officer:0 "Officer d'Artillerie"
artillery_officer_desc:0 "§LEntrainer comme un officer d'artillerie.§!"
weygand_promoted:0 "§YMaxime Weygand§! a été Promu"
france.338.t:0 "Fin du tour de France 1938"
france.338.d:0 "Cette 32e édition du Tour de France s'achève. Cette édition comprenait plus de 4680 km à réaliser autour de l'hexagone. L'Italien Gino Bartali est la vainqueur de cette édition avec un temps de 148 h 29 min 12 s !"
france.338.a:0 "Bravo aux Italiens !"
VIC_weygand_leader:0 "Appeler le Général Weygand"
VIC_weygand_leader_desc:0 "Notre nation est de nouveau plongée en guerre avec l'Allemagne, la seule personne assez clairvoyante pour nous sortir de la est bien Weygand !"
foch_right_hand:0 "Ancien Bras Droit de Foch"
intransigent:0 "Intransigent"
FRA_destroy_decadence_tooltip:0 "L'esprit national §YContre la décadence§! n'est plus d'actualité."
FRA_extend_the_maginot_line:0 "Investir dans la ligne Maginot"
FRA_extend_the_maginot_line_desc:0 "Au cours de la dernière guerre, les tranchées et les forts ont joué un rôle essentiel dans la défense de notre nation. Nous ne pouvons pas compter sur les autres nations pour tenir leur terrain, c'est pourquoi nous devons fortifier le nôtre."
FRA_prov_government_formed:0 "Le Gouvernement Provisoire est formé"
FRA_light_medium_armor:0 "Prendre note sur les Panzerdivisionen"
FRA_light_medium_armor_desc:0 "Certains Généraux comme Weygand ou De Gaulle poussent l'armée à concentrer ses forces blindées, comme les DLM créés par Weygand ou les récentes Panzerdivisionen allemandes. Selon eux, la dispersion des chars entre l'infanterie et la cavalerie, et au sein de chaque division, est très nocive pour l'armée."
FRA_aggressive_focus:0 "Adopter le plan de Weygand"
FRA_aggressive_focus_desc:0 "Le général Weygand avait déjà mis en garde contre le réarmement rapide de nos ennemis, le manque de modernisation de notre armée, ainsi que nos échecs diplomatiques, qui rendaient nos ennemis plus forts. Aujourd'hui, Weygand est toujours attentif à la situation et exerce une influence significative sur l'armée française. Peut-être devrions-nous tenir compte de ses paroles."
FRA_defensive_focus:0 "Poursuivre la politique de Gamelin"
FRA_defensive_focus_desc:0 "Maurice Gamelin est un général très apprécié dans les milieux politiques, ce qui est important en ces temps troublés pour la nation. Critiqué par de nombreux généraux, il est néanmoins doté d'une grande intelligence, c'est donc lui qu'il faut écouter."
FRA_nationalize_renault:0 "Nationaliser les usines Renault"
FRA_renault_nationalized:0 "§YRenault§! a été Nationalisé."
if_we_have_nationalized_renault_tt:0 "Si §YRenault§! a été Nationalisé :"
FRA_recklss_rearmment:0 "Réarmement à Tout Prix"
FRA_recklss_rearmment_desc:0 "Les gouvernements successifs ont bloqué les tentatives de réarmement de l'armée pendant de nombreuses années. Aujourd'hui, la France a accumulé un retard important et le gouvernement demande de réarmer au plus vite, alors que ses demandes sont formulées sans tenir compte des réalités du terrain, ce qui se traduit par un réarmement trop diversifié et pas aussi productif qu'il pourrait l'être...."
FRA_ready_for_war:0 "Augmenter les années de service"
FRA_rapid_rearmament:0 "Réarmement à Tout Prix"
FRA_rapid_rearmament_desc:0 "Les gouvernements successifs ont bloqué les tentatives de réarmement de l'armée pendant de nombreuses années. Aujourd'hui, la France a accumulé un retard important et le gouvernement demande de réarmer au plus vite, alors que ses demandes sont formulées sans tenir compte des réalités du terrain, ce qui se traduit par un réarmement trop diversifié et pas aussi productif qu'il pourrait l'être...."
FRA_ready_for_war:0 "Augmenter les années de service"
FRA_ready_for_war_desc:0 "Le général Weygand est préoccupé par l'insuffisance de nos effectifs et soutient fermement l'adoption d'un service de trois ans, qui renforcerait notre couverture et la supervision de nos réserves."
FRA_fortification_focus:0 "Fortifier la France"
FRA_border_forts:0 "Ajoute §Y2 Fort Terrestres§! à chaque province limitrophe d'un pays étranger dans un état national."
FRA_pressure_country_government_pol:0 "Faire pression sur le gouvernement Polonais"
FRA_promote_ideology_rallies_pol:0 "Promouvoir le communisme en Pologne"
FPM_leagues_in_action:0 "Les Ligues en action"
FPM_media_connections:0 "Connexions avec les médias"
FPM_absolutism:0 "Absolutisme"
FPM_social_nationalist:0 "Nationaliste Social"
FPM_war_heroes:0 "Héros de guerre"
FPM_revolutionary_wave:0 "Vague révolutionnaire"
FPM_popular_monarchy:0 "Monarchie populaire" 
france.999.t:0 "Bataille de Stonne"
france.999.d:0 "Ce matin, le village de Stonne est tombé aux mains des Allemands après avoir changer de mains pas moins de 17 fois. Ce village stratégique pour le ravitaillement des Français à fais l'objet d'une défense exeptionelle des ces derniers, nottament avec le général Pierre Billote qui, avec son char B1 bis "Eure" à détruit 13 panzer et repris le village à lui seul ! Plusieurs soldats et généraux Allemands comparent cette bataille avec celle de Verdun en 1916."
france.999.a:0 "Nos B1 sont indestructibles!"
FRA_alpine_maginot_desc:0 "L'Italie est devenue de plus en plus menaçante ces dernières années. Même si les Alpes et les fortifications déjà présentes constituent un obstacle considérable, il serait judicieux de les renforcer pour ne plus à avoir à nous soucier de l'Italie et les décourager de nous attaquer."
FRA_swiss_forts_desc:0 "La Suisse ne considère pas un réel danger en soi, mais d'autres puissances comme l'Italie ou l'Allemagne pourraient bien tenter de passer par la Suisse pour nous atteindre, nous ne devons pas prendre ce risque."
FRA_saarland_forts_desc:0 "Inonder la trouée de la Sarre avec le système ingénieux de digues que nous avons réalisé empêchera à coup sûr nos ennemis de franchir cette portion de la Ligne Maginot."
FRA_extand_maginot_desc:0 "La Belgique s'étant retirée de nos accords de défense, il est maintenant temps pour nous de prolonger la Ligne Maginot. Les Belges seront mécontents, mais c'est le prix de leur neutralité !"
FRA_saarland_forts:0 "Inonder la trouée de la Sarre."
FRA_sedan_forts_desc:0 "La défaite de 1870 à Sedan est dans tous les esprits, et cette région est très vulnérable même si très proche des Ardennes qui est en soi une défense naturelle. Nous devrions revoir les fortifications pour ne pas revivre la guerre franco-prussienne."
FRA_chavineau_desc:0 "Créer une ligne de Défense en amont de Paris pourrait bien faire la différence entre la victoire et la défaite, et qui sait peut-être se solder par une 2e victoire de la Marne!"
FRA_alpine_trade_modifier:0 "Commerce Alpin"
FPM_ai_behavior:0 "France Expanded : Comportement de la France"
FRA_secure_andore_om:0 "Protecteur des petites nations"
FRA_apx_organization:0 "FCM"
FRA_citroen:0 "Citroën"
FRA_citroene_organization: "$FRA_citroen$"
FRA_fcm_tank_organization:0 "$FRA_fcm_organization$"
FPM_ai_behavior:0 "France Expanded: France Behavior"
VIN_agrian_colony:0 "Société Agraire"
FRA_secret_army:0 "Armée Secrète"
FRA_saar_protectorate:0 "Protectorat de la Sarre"
inflation_1_tt:0 "Chaque Tick d'§YInflation§!: \n$FPM_fe_n1$"
inflation_2_tt:0 "Chaque Tick d'§YInflation§!: \n$FPM_fe_n2$"
inflation_3_tt:0 "Chaque Tick d'§YInflation§!: \n$FPM_fe_n3$"
inflation_4_tt:0 "Chaque Tick d'§YInflation§!: \n$FPM_fe_n4$"
inflation_5_tt:0 "Chaque Tick d'§YInflation§!: \n$FPM_fe_n5$"
FRA_devalue_the_franc:0 "Accord Monétaire Tripartite"
FRA_devalue_the_franc_desc:0 "Les Britanniques et les Américains ont déjà dévalué leur monnaie. Nous devrions aligner nos monnaies sur le dollar américain et la livre sterling. Cela devrait nous permettre d'exporter plus facilement nos marchandises et nous aider à nous remettre plus rapidement de la Grande Dépression."
FRA_secure_andorre:0 "Protéger l'Andorre"
FRA_secure_andorre_desc:0 "Nous devons garantir l'indépendance de l'Andorre en envoyant des troupes pour protéger l'État de la guerre civile en Espagne."
FRA_infantry_tanks:0 "Investir dans Hotchkiss"
FRA_infantry_tanks_desc:0 "Même si Renault a remporté la compétition pour équiper l'infanterie avec des chars R35, le H35 proposé par Hotchkiss a séduit la cavalerie, qui a du mal à produire suffisamment de chars S35."
france.336.t:0 "Retirada"
france.336.d:0 "Les Républicains ayant perdu la guerre d'Espagne, des milliers d'entre eux affluent à nos frontières. Bientôt, ils sont des centaines de milliers, avec leur armée en déroute, et tentent d'échapper au sort horrible que leur réservent les vainqueurs dans leur propre pays..."
france.336.a:0 "Désarmons-les et mettons-les dans des camps provisoires"
france.336.b:0 "Accueillons-les sur notre sol"
GER_fall_gelb_easy:0 "Fall Gelb"
GER_fall_gelb_hard:0 "Fall Gelb"
GER_fall_gelb_blitz:0 "Fall Gelb"
appeal_of_18th_of_june:0 "L'Appel du 18 Juin"
son_of_the_people:0 "Fils du Peuple"
RULE_OPTION_DEMOCRATIC_RIGHT:0 "Bloc national"
RULE_OPTION_NATIONAL_BLOC_FRA_AI_DESC:0 "L'IA tentera de faire revivre le Bloc National"
FRA_bigot:0 "Jules Le Bigot"
VIC_resistance_desc:0 "Les boches ne respectent plus la convention d'armistice, il est donc de notre devoir de financer la résistance dans les régions occupées, pour qu'un jour nous puissions reprendre notre territoire national !"
VIC_resistance:0 "Financer la Résistance"
VIC_resistance2:0 "Financer la Résistance"
VIC_police_nationale_desc:0 "Chaque ville de plus de 10 000 habitants doit avoir une nouvelle police, différente de la gendarmerie ou de la police municipale, pour agir efficacement."
VIC_police_nationale:0 "Police Nationale"
VIC_SMIC:0 "Salaire minimum"
VIC_SMIC_desc:0 "Un salaire minimum doit être mis en place pour aider nos concitoyens dans le besoin après la défaite."
FRA_revenge_on_germany:0 "Revanche sur l'Allemagne"
FRA_revenge_on_germany_desc:0 "Le temps est venu de montrer au monde pourquoi l'armistice était nécessaire. Maintenant réarmés, nous pouvons poignarder l'Allemagne dans le dos et oublier nos récentes défaites !"
defeatist2:0 "Défaitiste"
FRA_franco_british_union:0 "Union Franco-Britanique"
france.33.title:0 "Dissoudre l'union ?"
france.33.desc:0 "Maintenant que la guerre est finie, nous devons décider avec les Britanniques de dissoudre ou non notre union."
france.33.a:0 "Oui, bien sûr !"
france.33.b:0 "L'Union est toujours nécessaire en cas d'agression" 
FRA_radio_londre:0 "Radio Londres"
FRA_radio_londre_desc:0 "Radio Londres est la voix de la France libre, utilisée pour la propagande et pour rassurer les Français en territoire occupé, ainsi que pour les messages codés. Sa célèbre phrase d'ouverture est "Les Français parlent aux Français" 
FRA_victors_of_wwi_2:0 "Armée de Terre"
FRA_victors_of_wwi_2_desc:0 "Notre armée a fait l'objet d'une réforme complète afin d'être en mesure de répondre aux conflits modernes."
FRA_petain_speech:0 "Discours De Pétain"
FRA_petain_speech_desc:0 "Le discours du maréchal Pétain comporte une phrase malheureuse, "C'est le cœur serré que je vous dis aujourd'hui qu'il faut cesser le combat.." Beaucoup dans notre armée l'ont interprétée comme la fin des combats, alors qu'il n'en est rien ! Une rectification du texte imposé par Weygand a été faite, mais l'impact moral et les mauvaises interprétations ont eu raison de ce qui restait de l'armée. Néanmoins, de nombreuses unités continuent à se battre pour l'honneur dans tout le pays !"
FRA_Schweisguth:0 "Victor Henri Schweisguth"
FRA_kieffer:0 "Commando Kieffer"
FRA_kieffer_desc:0 "Créé à l'initiative du capitaine de corvette Philippe Kieffer, ce commando spécial a été créé pour reconquérir notre territoire national avec l'aide de nos alliés !"
Fra_kieffer_idea:0 "Commando Kieffer"
FRA_extand_maginot:0 "Etendre la Ligne Maginot"
FRA_construction_battalions:0 "Exercices de tranchées"
FRA_construction_battalions_desc:0 "Pendant la dernière guerre, nous avons utilisé les innovations technologiques pour creuser de plus en plus de tranchées plus rapidement. Il est temps de refaire la même chose, car la guerre arrive..."
FRA_maginot_propaganda_desc:0 "Nous devrions promouvoir notre fabuleuse ligne Maginot, et les Français se sentiraient en sécurité et n'auraient plus peur de revivre les horreurs de 1914-1918."
FRA_alpine_maginot:0 "Nouvelles Fortifications Alpines"
FRA_maginot_category:0 "Ligne Maginot"
FRA_maginot_category_desc:0 "Sortie traumatisée de la dernière guerre mondiale, la France a cherché à ne pas répéter les erreurs traumatisantes du passé avec la ligne Maginot. Réputée infranchissable, cette ligne fortifiée ultra-moderne fait l'objet d'un véritable culte. Certains généraux s'y opposent, arguant qu'il s'agit d'une stratégie défensive obsolète, mais la ligne est le seul endroit où les politiques sont prêts à allouer des fonds à l'armée..."
FRA_swiss_forts:0 "Fortifier la frontière suisse"
FRA_maginot_propaganda:0 "La ligne Magninot est imprenable"
FRA_sedan_forts:0 "Fortifier la région de Sedan"
FRA_chavineau:0 "Créer la ligne Chavineau"
FRA_norway_expedition:0 "Brigade de Haute Montagne"
FRA_secure_norway:0 "Brigade de Haute Montagne"
FRA_secure_norway_desc:0 "La Scandinavie, avec ses ressources, notamment en fer, devient chaque jour plus stratégique. Nous devons nous préparer à intervenir là-bas à court ou moyen terme. À cette fin, formons la Brigade de Haute Montagne sous le commandement du général Béthouart."
FRA_establish_a_gaullist_resistance:0 "Etablire un Résistance Gaulliste"
FRA_establish_a_gaullist_resistance_desc:0 "Depuis son célèbre discours, Charles De Gaulle a toujours appelé à la résistance nationale, il est de notre devoir de l'écouter !"
FRA_united_resistance_movements:0 "Mouvements Unis de la Résistance"
FRA_united_resistance_movements_desc:0 "Cette organisation regroupe les plus grands mouvements de résistance de la zone Sud !"
FRA_underground_newspaper:0 "Journaux clandestins"
FRA_underground_newspaper_desc:0 "De nombreux journaux clandestins diffusaient souvent de grandes quantités de contenus anti-occupation."
FRA_passive_resistance:0 "Résistance passive"
FRA_passive_resistance_desc:0 "De nombreux citoyens aident les résistants autrement qu'en combattant, en fleurissant les monuments aux morts, en saccageant les tracts de propagande allemande, en chantant la Marseillaise, etc. Cela affecte grandement le moral des Français !"
FRA_british_equipement:0 "Rééquiper nos troupes"
FRA_british_equipement_desc:0 "Notre équipement a été en grande partie capturé par l'ennemi lors de notre défaite, et nous devons le remplacer dès que possible, grâce à nos alliés !"
FRA_maquis2:0 "Maquis"
FRA_drop_weapons:0 "Parachuter Des Armes"
FRA_resistance_capital:0 "La Capitale de la Résistance"
FRA_resistance_capital_desc:0 "Lyon, avec ses traboules et étant la ville où de nombreux mouvements de résistance se sont formés, est fièrement désignée comme la capitale de la résistance !"
FRA_jean_mesmay:0 "Jean De Mesmay"
FRA_paul_beynet:0 "Paul Beynet"
FRA_alfred_montagne:0 "Alfred Montagne"
FRA_drop_weapons_desc:0 "Pour que les résistants à l'intérieur aient de quoi se battre, nous devons régulièrement parachuter des armes."
FRA_bir_hakeim:0 "Bir Hakeim" 
FRA_FAFL:0 " Les FAFL"
FRA_FAFL_desc:0 "Tout ce dont les forces aériennes de la France Libre ont besoin, c'est de nouveaux avions pour combattre l'ennemi !"
FRA_send_moulin:0 "Envoyer Jean Moulin"
FRA_send_moulin_desc:0 "Notre agent Jean Moulin est prêt à être envoyé en action pour rassembler les différents mouvements de la résistance intérieure."
FRA_bir_hakeim_desc:0 "Les soldats de Bir Hakeim ont fait preuve d'une telle résistance qu'ils inspirent nos soldats et nos Alliés et montrent notre détermination."
FRA_bir_hakeim_legacy:0 "Héritage de Bir Hakeim"
FRA_expand_intelligence_idea:0 "Espionner nos ennemis"
saar_offensive:0 "Offensive de la Sarre"
FRA_hidden_weapons:0 "Armes Cachées"
FRA_hidden_weapons_desc:0 "Avant l'armistice, de nombreux généraux ont ordonné de cacher des armes en vue de la reprise des combats, il est donc l'heure d'aller les récupérer !"
FRA_henry_tanguy:0 "Henri Rol-Tanguy"
FRA_continue_the_fight2:0 "Sous le Bon Drapeau"
FRA_continue_the_fight2_desc:0 "Qu'ils viennent de Vichy, des prisons allemandes ou des fins fonds de nos colonies, qui que ce soit est le bienvenu sous nos drapeaux !"
FRA_bertrand_fagalde:0 "Bertrand Fagalde"
saar_offensive_desc:0 "Nous devons nous préparer à attaquer l'Allemagne pour soulager notre allié polonais. Compte tenu de la lenteur de notre mobilisation, nous commencerons par attaquer la région de la Sarre, dans un premier temps avec des moyens limités !"
FRA_charles_nogues:0 "Charles Noguès"
FRA_paul_vauthier:0 "Paul Vauthier"
FRA_add_new_generals:0 "Appeler des généraux de confiance"
FRA_add_new_generals_desc:0 "Maintenant que Weygand est aux commandes, il estime nécessaire de rappeler les généraux sur lesquels il sait pouvoir compter pour remplacer ceux nommés par son prédécesseur Gamelin."
FRA_weygand_general:0 "Donner a Weygand le poste de Généralissime"
FRA_weygand_general_desc:0 "Le général Gamelin n'est pas à la hauteur de commander les armées françaises pendant un conflit d'envergure. Nous devons réfléchir à le remplacer dès à présent, heureusement pour nous le célèbre général Weygand accepte de prendre sa place, une aubaine pour nos forces armées !"
war_heritors_ww1:0 "Héritiers de la Grande Guerre"
FRA_last_defense:0 "Défense Locale"
FRA_last_defense_desc:0 "Notre armée est désordonnée suite à la perte de notre capitale et aux nombreuses brèches de notre dispositif. Pourtant rien n'est perdu, sous l'ordre de généraux énergiques, de nombreux soldats barricadent les routes et organisent une véritable défense locale à l'aide de civils et gendarmes."
FRA_weygand_category:0 "Bataille de France"
FRA_local_strikes:0 "Grèves locales"
FRA_utilize_the_leagues_target_tt:0 "Sélectionnez l'endroit où déployer les ligues."
FRA_integrate_the_balkan_entente:0 "Intégrer l'Entente des Balkans"
FRA_integrate_the_balkan_entente_desc:0 "Nous devrions étendre notre influence dans les Balkans en invitant les Grecs et les Turcs dans notre alliance. Cela devrait nous permettre de mieux contrôler le Bosphore, de projeter notre puissance dans la mer Noire et de nous doter d'alliés vitaux en Méditerranée orientale."
france.555.t:0 "Les généraux choisissent Vichy"
france.555.d:0 "Les Généraux Français de Hauts rangs ont tous choisi de rester fidèles au gouvernement métropolitain. Aucun d'entre eux n'a voulu tenter l'aventure de la France libre. Cela impacte bien sûr fortement notre soutien à l'international, et notre nouvelle armée ne comptera plus que sur des officiers de bas rangs exilés..."
france.555.a:0 "Fini le défaitisme !"
france.337.t:0 "Des roses sur la ligne Maginot"
france.337.d:0 "Dans la Ligne Maginot, les soldats, perdus en pleine nature, voient peu de belles choses. Les divertissements, comme les théâtres ou bistrots, sont loin et le moral est au plus bas à force de voir du béton à longueur de journée. Une parade a cependant été trouvée, bravant les budgets militaires trop limités, il est décidé de créer une souscription pour fleurir les ouvrages Maginots de roses. Rapidement la France entière se prend au jeu, et la Rose Maginot devient l'emblème des Horticulteurs, et un symbole fort du respect du peuple envers son armée."
france.337.a:0 "Qui s'y frotte s'y pique !"
lar_france_political_violence.5.a:0 "Une Bonne Nouvelle!"
FRA_commit_to_appeasement:0 "S'engager pour l'apaisement"
FRA_commit_to_appeasement_desc:0 "Nous ne pouvons pas nous permettre une guerre de sitôt. Nous devons apaiser nos ennemis jusqu'à ce que notre armée et notre industrie soient prêtes. Bien qu'il soit regrettable que d'autres doivent se sacrifier pour cela, une fois que nous serons prêts, leur libération sera bientôt à portée de main."
FRA_general_work_council:0 "Former la CGT"
FRA_fight_vichy:0 "Mort aux traîtres"
FRA_fight_vichy_desc:0 "Cette fois c'en est trop, la collaboration du régime de Vichy doit cesser, quitte à tuer nos frères !"
FRA_koening:0 "Pierre Koenig"
FRA_argenlieu:0 "Georges Thierry d'Argenlieu"
FRA_la_resistance1:0 "La Résistance"
FRA_la_resistance2:0 "La Résistance"
FRA_la_resistance3:0 "La Résistance"
FRA_la_resistance4:0 "La Résistance"
FRA_la_resistance5:0 "La Résistance"
FRA_la_resistance6:0 "La Résistance"
FRA_resistance1_desc:0 "Créés par le PCF, les militants communistes français n'attendent qu'un signal pour faire saigner l'occupant."
FRA_resistance2_desc:0 "Regroupement des organisations militaires des principaux mouvements de la zone sud (Combat, Libération-Sud et Franc-Tireur). Cette organisation était très présente dans la région Rhône-Alpes (Vercors, Lyon) et dans le Massif central."
FRA_resistance3_desc:0 "Mouvements unis de la Résistance (MUR). Regroupement des principaux mouvements de la zone sud (Combat, Libération-Sud et Franc-Tireur)."
FRA_resistance4_desc:0 "Mouvement de Libération Nationale (MLN). Né du regroupement des Mouvements Unis de Résistance et de plusieurs mouvements de la zone nord."
FRA_resistance5_desc:0 "Les Forces françaises de l'intérieur (FFI), regroupement complet des membres des mouvements, des réseaux de résistance intérieure et des unités de l'Armée secrète, des FTP, de l'Organisation de résistance de l'Armée (ORA), etc. au sein d'une seule organisation, ont été créées sur décision du général de Gaulle !"
FRA_resistance1:0 "Les F.T.P."
FRA_resistance2:0 "Armée Secrète"
FRA_resistance3:0 "Mouvements Unis de La Résistance"
FRA_resistance4:0 "Mouvement De la Libération Nationale"
FRA_resistance5:0 "F.F.I." 
FRA_resistance6:0 "Unifier la Résistance" 
FRA_resistance6_desc:0 "Notre agent Jean Moulin a pour mission d'unifier les différents groupes de résistance du pays. La tâche est complexe car en plus de combattre l'occupant, ils se battent souvent entre eux. Mais le sort de la France en dépend..."
FRA_resistance_desc:0 "Dans toutes les régions de France, des mouvements se sont formés pour affaiblir l'occupant, et avec le temps, ils sont devenus de plus en plus étendus et organisés. C'est la Résistance !"
FRA_la_resistance:0 "La Résistance"
FRA_army_of_liberation_desc:0 "Nous devons reconstruire une armée française forte afin de reprendre la France métropolitaine aux envahisseurs !"
FRA_preparation_in_the_alps:0 "Préparatifs dans les Alpes"
FRA_they_shall_not_pass2:0 "Ils ne Passeront Pas"
FRA_they_shall_not_pass2_desc:0 "Notre armée est loin d'être prête à mener une guerre à grande échelle. Évitons les erreurs du passé, confions le commandement à des personnes compétentes et ravivons la flamme patriotique des anciens poilus du pays !"
MOR_less_divisions:0 "Réticents à se battre pour la France"
FRA_political_crisis_idea:0 "Nouvelle Crise Politique"
FRA_political_crisis_idea_desc:0 "La IIIe République est victime d'une nouvelle crise politique depuis le pact Hoare-Laval. Chaque Français se rapelle de la Crise du 6 février 1934 qui aurait pu faire tomber la république, en ces temps troubles on s'inquietes qu'elle se reproduise avec nottament la montée des extremes...\n\n§RUne nouvelle Crise politique touche le pays, comme souvent sous la IIIe République celle-ci doit être réglée avant de pouvoir avancer sur certaines décisions importantes requérant une majorité parlementaire.§!"
france.350.t:0 "Blum attaqué"
france.350.d:0 "Le leader de la SFIO, Léon Blum, a été agressé en sortant de l'Assemblée nationale par des Camelots du Roi qui se trouvaient aux obsèques de Jacques Bainville. En effet, on a retrouvé son célèbre et large chapeau dans les locaux du journal L'Action Française, ce qui semble désigner les agresseurs ! Blum réussit finalement à s'en sortir de justesse et décide même de ne pas porter plainte contre ses agresseurs ! Cependant, le mal est fait, et la gauche s'indigne à quelques semaines des élections, les violences politiques sont devenues récurrentes en France ces dernières années..."
france.350.a:0 "Les violences politiques doivent cesser !"
FRA_refugees:0 "Exode massif"
FRA_refugees_desc:0 "Pendant que l'ennemi avance dans nos lignes, les civils français et du Benelux, se souvenant de l'occupation des territoires du Nord pendant la Grande Guerre, s'enfuient vers le Sud, entraînant bientôt un exode massif de 8 millions de personnes, paralysant les routes du pays et donc l'armée..."
vichy.333.t:0 "Discours de Philippe Pétain"
vichy.333.d:0 "Aujourd'hui Pétain s'adresse au peuple français en assurant qu'il fera tout ce qui est en son pouvoir pour rétablir une France forte malgré les horribles événements que le pays a rencontrés"
vichy.333.a:0 "Vive la Révolution Nationale !"
germany.333.t:0 "Blitzkrieg"
germany.333.d:0 "La seule chose qui nous a séparés de la victoire en 1914 était notre rapidité, cette fois nous devons redoubler d'efforts avec des tactiques innovantes pour démolir la France une fois pour toutes. Mais il faut d'abord ouvrir la voie..."
germany.333.a:0 "Cette fois-ci à Paris !"
FRA_help_china:0 "Aide française"
FRA_hanoi_road_desc:0 "La Chine lutte courageusement contre l'impérialisme du Japon, notre devoir est de l'aider !"
FRA_hanoi_road:0 "La route de Hanoï"
FRA_legentilhomme:0 "Paul Legentilhomme"
FRA_bilotte:0 "Pierre Billotte"
VIN_yen_bai:0 "Affaire Yên Bái"
VIN_china2:0 "Poumon chinois vers l'Occident"
VIN_china2_desc:0 "En cas de guerre en chine, l'Indochine pourrait devenir le poumon chinois de l'Occident"
france.10.a:0 "Demander une Armistice..."
FRA_delestain:0 "Charles Delestraint" 
VICTORY_POINTS_11593:0 "Saint-Étienne"
VICTORY_POINTS_11713:0 "Avignon"
VICTORY_POINTS_11576:0 "Clermond-Ferrand"
VICTORY_POINTS_6917:0 "Carcassonne"
VICTORY_POINTS_3447:0 "Maubeuge"
VICTORY_POINTS_11535:0 "Caen"
VICTORY_POINTS_503:0 "Angers"
VICTORY_POINTS_11463:0 "Le Mans"
VICTORY_POINTS_629:0 "Poitiers"
FRA_democratic:0 "République Française"
FRA_polish_fighters:0 "Recruter des soldats Polonais en exil"
FRA_polish_fighters_desc:0 "L'Allemagne a peut-être vaincu notre allié, mais la fière Pologne n'a pas encore abandonné ! Nous avons trouvé un accord avec le gouvernement polonais pour incorporer les troupes polonaises exilées dans notre armée."
FRA_offense:0 "Une armée offensive"
FRA_offense_desc:0 "La ligne Maginot ne doit être utile que pour gagner du temps, pour mobiliser et protéger les civils. Nous ne pouvons pas compter sur une doctrine défensive et encore moins compter sur la ligne Maginot uniquement pour notre défense !"
FRA_france_on_the_offense:0 "Écouter les thèses de Weygand"
FRA_france_on_the_offense_desc:0 "Maxime Weygand met en garde, avec d'autres comme le Maréchal Pétain, contre le manque de mécanisation et de la stratégie défensive qui se développe au sein de l'armée. Nous devons régler des problèmes au plus vite pour être prêts !"
FRA_chasseurs_alpins:0 "Armée des Alpes"
FRA_chasseurs_alpins_desc:0 "Face à la menace croissante que représente l'Italie, le front alpin doit être bien équipé de forts et d'artillerie, et renforcé en cas de conflit avec notre voisin. Cela nous conférera un avantage certain sur ce terrain difficile."
FRA_mas_38:0 "Le Mas-38"
FRA_mas_38_desc:0 "Notre armée doit adopter une mitraillette, même si certains vieux généraux y sont hostiles cela améliorerait grandement la puissance de feu de nos unités de combat."
FRA_french_army:0 "L'armée française".
FRA_french_army2:0 "L'armée française".
FRA_french_army_desc:0 "Meilleure armée du monde après la Grande Guerre, l'armée française a toujours joué un rôle important dans l'équilibre des forces en Europe."
FRA_french_army2_desc:0 "Meilleure armée du monde après la Grande Guerre, l'armée française a toujours joué un rôle important dans l'équilibre des forces en Europe".
war_herrison_defense:0 "Défense en Hérisson"
war_herrison_defense_desc:0 "Cette tactique consiste à laisser les chars ennemis passer nos lignes d'infanterie pour ensuite les encercler et les détruire. Une très bonne tactique, surtout quand les forces blindées amies sont limitées..."
war_fallback:0 "Retraite coordonnée"
war_fallback_desc:0 "Plusieurs de nos forces sont repoussées, pour éviter qu'elles ne soient débordées, une tactique coordonnée est préférable pour rétablir une bonne ligne de défense."
war_somme_aisne:0 "Ligne Weygand"
war_somme_aisne_desc:0 "Le général Weygand a appelé à établir une ligne défensive de dernier espoir, la ligne Weygand, avec les restes de l'armée. Si la ligne s'effondre, la bataille sera sûrement perdue..."
war_manoevre:0 "Tactique de manœuvre"
war_manoevre_desc:0 "Les anciens cavaliers, Maxime Weygand en particulier, aiment la manoeuvre en guerre, quelque chose que la cavalerie ne pouvait pas faire proprement dans la Grande Guerre. Aujourd'hui, beaucoup de chevaux sont remplacés par des machines mais le principe est le même."
histindochina.1.t:0 "Jules Brévié arrive en Indochine"
histindochina.1.d:0 "Avec l'élection du gouvernement du Front populaire en France, la métropole a jugé nécessaire de nommer un gouverneur à l'esprit plus libéral pour diriger l'Indochine. Le nouveau gouverneur, Jules Brévié, a annoncé des plans pour aider à désamorcer la situation tendue dans la colonie, en faisant des concessions comme l'octroi d'amnisties aux prisonniers politiques, une plus grande liberté de la presse, et en permettant plus d'actions politiques par la population indigène."
histindochina.1.a:0 "Espérons qu'il apporte la prospérité ici !"
histindochina.2.t:0 "Georges Catroux est nommé gouverneur"
histindochina.2.d:0 "Le gouvernement français, conscient de l'accroissement des tensions politiques dans le monde ces derniers temps, a décidé de nommer un nouveau gouverneur, Georges Catroux. Catroux, un militaire, devrait contribuer à renforcer la sécurité de la colonie, en envoyant un message fort à toute force antagoniste en Extrême-Orient."
histindochina.2.a:0 "Espérons que la guerre ne vienne pas en Indochine."
histindochina.3:0 "Jean Decoux devient gouverneur"
histindochina.3.d:0 "Avec la chute de la France aux mains des Allemands, le nouveau gouvernement de Vichy a jugé bon de nommer un nouveau gouverneur de l'Indochine. Jean Decoux, ancien commandant en chef des forces navales françaises en Extrême-Orient, a, malgré la sombre réalité à laquelle la France est confrontée, accepté le poste. Avec le continent occupé, et les puissances expansionnistes d'Extrême-Orient qui tournent leurs regards vers l'Indochine, il semble que la guerre soit inévitable."
histindochina.3.a:0 "Espérons que la France survive à cette épreuve."
SYR_democratic_party_colony:0 "Forces coloniales"
SYR_democratic_party_colony_long:0 "Forces Coloniales"
SYR_neutrality_party_colony:0 "Forces Coloniales"
SYR_neutrality_party_colony_long:0 "Forces Coloniales"
VIN_neutrality_party_colony_long:0 "Forces Coloniales"
VIN_neutrality_party_colony:0 "Forces Coloniales"
VIN_democratic_party_colony:0 "Forces Coloniales"
VIN_democratic_party_colony_long:0 "Forces Coloniales"
SYR_weygand:0 "L'héritage du bon sultan"
SYR_weygand_desc:0 "Lorsque Maxime Weygand fut promu administrateur de cette région, il devint rapidement célèbre pour ses bonnes réformes et sa bonne gouvernance du mandat contrairement à ses prédécesseurs. Le peuple l'appréciait et rapidement, il fut surnommé le bon Sultan !"
TUN_neutrality_party_dynasty:0 "Dynastie des Husainides"
TUN_neutrality_party_dynasty_long:0 "Dynastie des Husainides"
MOR_neutrality_party_dynasty_long:0 "Dynastie Alaouite"
MOR_neutrality_party_dynasty:0 "Dynastie Alaouite"
MDN_revolts:0 "Souvenirs de la révolte syrienne"
MDN_sdn:0 "Mandat de la Société des Nations."
FRA_developpement:0 "Investissements français."
FRA_developpement_desc:0 "La France investit massivement dans notre pays pour construire des infrastructures, qu'il s'agisse de chemins de fer, de routes, d'écoles, d'hôpitaux, et plus encore."
VIN_pearl:0 "Perle de l'Empire Français"
VIN_pearl_desc:0 "L'Indochine est la plus riche des nombreuses colonies de la France, la métropole l'utilise principalement pour l'extraction de son sol riche en ressources."
VIN_communist:0 "Opposition communiste."
VIN_soldier:0 "Armée coloniale."
MOR_rif:0 "Souvenirs de la guerre du Rif."
FRA_weygand_is_here:0 "Le plan Weygand"
FRA_victors_of_wwi_1:0 "Armée de Terre"
FRA_victors_of_wwi_1_desc:0 "Sortie victorieuse de la Grande Guerre, l'armée a développé une attitude dangereusement complaisante qui fait que les développements stratégiques arrivent lentement et avec une certaine réticence."
MOR_Desert:0 "Armée coloniale."
FRA_weygand_is_here_desc:0 "Avec Gamelin limogé et avec la promotion de Maxime Weygand, nous pouvons être sûrs que l'armée française est désormais entre de meilleures mains. La France ne tombera pas !"
FRA_army_tensions:0 "Tensions Armée-Gouvernement"
FRA_army_tensions_desc:0 "Depuis la crise Boulanger de 1886-1887, les politiques craignent les généraux, réduisant constamment leurs pouvoirs et leurs capacités. De nombreuses coupes budgétaires ont été faites dans l'armée et le gouvernement est prêt à démanteler l'armée, ne comptant plus que sur la ligne Maginot. On a dit à la population que l'armée française était renforcée, mais la réalité dit le contraire. D'autre part, certains généraux se retrouvent attirés par l'extrême droite et les convictions anti-gouvernementales. Malgré cela, la plupart sont fidèles au gouvernement et considèrent qu'à l'approche de la guerre en Europe, l'armée française doit se réarmée..."
france.334.t:0 "Weygand promu"
france.334.d:0 "Maxime Weygand, célèbre pour ses actions pendant la Première Guerre mondiale, la guerre soviéto-polonaise et en Syrie, a été nommé commandant en chef de l'armée française ! Nous pouvons être sûrs qu'avec le limogeage de Gamelin et la promotion de Maxime Weygand, l'armée française est désormais entre de meilleures mains."
france.334.a:0 "Vive l'héritier de Foch !"
artillerie:0 "Officier d'artillerie"
artillery_desc:0 "§LEntrainer comme officier d'artillerie.§ !"
FRA_blitzkrieg:0 "Percée Inattendue" 
FRA_blitzkrieg_desc:0 "L'ennemi a inopinément percé nos lignes en de nombreux endroits. Cela a entraîné le chaos au sein de l'état-major. Bien que nous puissions être certains que ce problème sera résolu en temps voulu, nous devons survivre jusque-là."
france.335.t:0 "La drôle de guerre"
france.335.d:0 "Sur le front occidental, rien ne bouge. Quelques éléments français de reconnaissance des Groupes Francs ont pris des villages allemands en Sarre, mais rien de plus. Les soldats français et britanniques, pleins d'espoirs, ont vu aujourd'hui l'effet des doctrines défensives de l'État-Major sur leur moral alors qu'ils attendent patiemment l'ennemi sur la frontière..."
france.335.a:0 "Une drôle de guerre, c'est sûr !"
newsfml.113.t:0 "La drôle de guerre"
newsfml.113.d:0 "Alors que la Pologne est tombée, la France décide de poursuivre le combat dans une stratégie défensive. Peu ou pas de combats ont été signalés, à l'exception de quelques troupes françaises des Groupes Francs qui ont saisi certains villages allemands à la frontière. Les Polonais ne se sont pas montrés indifférents du manque d'action de leurs Alliés, et les ont avivements critiqués. Sur le front, la plupart des soldats français et anglais, qui étaient prêts à combattre, commencent à se lasser de cette inaction constante. Beaucoup en France commencent à dire que cette guerre est nouvelle, et que l'on ne se battra que peu ou plus, il est pourtant difficile d'en être certain..."
newsfml.113.a:0 "À l'Ouest, rien de nouveau..."
FRA_french_army:0 "L'armée française"
FRA_french_army2:0 "L'armée française"
FRA_french_army_desc:0 "Meilleure armée du monde après la Grande Guerre, l'armée française a toujours été importante dans l'équilibre des forces en Europe."
FRA_french_army2_desc:0 "La meilleure armée du monde après la Grande Guerre, l'armée française a toujours été importante dans l'équilibre des forces en Europe."
FRA_phoney_war:0 "La drôle de guerre"
FRA_french_army:0 "L'armée française"
FRA_french_army2:0 "L'armée française"
FRA_production:0 "Production de masse"
FRA_production2:0 "Production de masse"
FRA_production3:0 "Production de masse"
FRA_ww1:0 "Relancer notre production de chars".
FRA_ww1_desc:0 "A la fin de la Grande Guerre, la France disposait du plus grand parc blindé au monde, mais les différents gouvernements pacifistes ont contribué à nous désarmer. Maintenant que la guerre approche, il est temps de relancer notre production de chars de combat"
FRA_call_the_ALVF:0 "Déployer l'ALVF"
FRA_call_the_ALVF_desc:0 "L'ALVF ou Artillerie Lourde sur Voie Ferrée a été créé afin d'utiliser des canons de très gros calibre sur rails."
FRA_army_coordination:0 "Une armée coordonnée"
FRA_army_coordination_desc:0 "Les réticences de l'état-major au sujet des radios sont maintenant passées, notre armée en est maintenant entièrement équipée. Nous pouvons maintenant continuer notre modernisation."
FRA_they_shall_not_pass:0 "Ils ne passerons pas !"
FRA_they_shall_not_pass_desc:0 "L'héroisme et la ténacité des Français, notablement a Verdun marque encore les esprits.Cette guerre ne sera pas différente des précedente et nous repousserons nos enemis une fois encore !"
FRA_defense:0 "Défense Passive"
FRA_defense_desc:0 "Protéger notre population avec des masques à gaz et des exercices est nécessaire pour ne pas subir d'importantes pertes civiles."
FRA_firepower:0 "La puissance de feu tue !"
FRA_lighttank:0 "Production de chars légers"
FRA_infantry_focus:0 "Levée en Masse"
FRA_motorized_focus:0 "Une armée méchanisée et motorisée"
FRA_D2:0 "Étudier les Panzerdivisionen"
FRA_D2_desc:0 "Le futur de la guerre est la mobilité, avec des chars progressant en même temps que l'infanterie en véhicule derrière.Le char D2 plus rapide, agile et moins complexe à produire que le B1 bis doit être étudié afin d'en tirer des conclusions."
FRA_de_gaulle:0 "Négociations d'Armistice"
FRA_napoleon4:0 "L'esprit de Napoléon"
FRA_napoleon3:0 "L'esprit de Napoléon"
FRA_napoleon2:0 "L'esprit de Napoléon"
FRA_napoleon:0 "L'esprit de Napoléon"
FRA_foreign:0 "La légion étrangère"
FRA_foreign_desc:0 "La Légion étrangère est composée d'hommes venant des quatre coins du globe, ces soldats aguerris peuvent combattre dans les pires conditions !"
FRA_napoleon_desc:0 "Napoléon est mort il y a longtemps, mais ses incroyables victoires sont toujours très présentes dans l'inconscient collectif des Français"
FRA_napoleon2_desc:0 "Napoléon est mort il y a longtemps, mais ses incroyables victoires sont toujours très présentes dans l'inconscient collectif des Français"
FRA_napoleon3_desc:0 "Napoléon est mort il y a longtemps, mais ses incroyables victoires sont toujours très présentes dans l'inconscient collectif des Français"
FRA_napoleon4_desc:0 "Napoléon est mort il y a longtemps, mais ses incroyables victoires ont influencé la réforme de notre armée, VIVE LA GRANDE ARMEE !"
FRA_colonies_desc:0 "Notre Empire est plus qu'utile en cas de guerre, les troupes coloniales ayant toujours joué un rôle majeur au sein de notre armée."
FRA_colonies:0 "Recrutement Colonial"
FRA_bad_production:0 "Production désorganisée"
FRA_bad_production_desc:0 "Le gouvernement et les généraux en charge de la répartition de la production d'armements rencontrent plusieurs problèmes.La dernière guerre a prouvé aux patrons d'usines d'armements que l'État était un mauvais payeur. De plus, l'arsenal de la France est immense et les généraux en charge du réarmement n'arrivent pas à se décider sur quel type d'armement produire. La question du réarmement de la France est compliquée et pose clairement un danger au pays si celui-ci venait à se retrouver en guerre..."

