fpmdiploevents.56.t:0 "Le gouvernement [FRA.GetAdjective] exige la Flandre"
fpmdiploevents.56.d:0 "Le gouvernement [FRA.GetAdjective], Invoquant leurs liens historiques avec la province, ils ont exigé que nous leur cédions la région historique de la Flandre française. De plus, s'il nous arrivait de refuser, ils se sont arrogé le droit de recourir à la force militaire pour faire valoir leur revendication. Nous devons décider ce qui est le mieux pour notre pays."
fpmdiploevents.56.a:0 "Quelle absurdité !"
fpmdiploevents.56.b:0 "Ils peuvent l'avoir"
fpmdiploevents.57.t:0 "[FROM.GetName] cède la Flandre française"
fpmdiploevents.57.d:0 "Le gouvernement [FROM.GetAdjective] a sagement décidé de nous céder la région historique de la Flandre française. Nos fonctionnaires ont déjà commencé à travailler à l'intégration de cette région."
fpmdiploevents.57.a:0 "Merveilleux"
fpmdiploevents.58.t:0 "[FROM.GetName] refuse de céder la Flandre française"
fpmdiploevents.58.d:0 "Par pure imprudence, le gouvernement [FROM.GetAdjective] a refusé de nous céder la région historique de la Flandre française ! Il ne nous reste plus désormais que la guerre pour la récupérer."
fpmdiploevents.58.a:0 "C'est la guerre, alors"

ww_BEL_event_misc.2.t: "L'Île noire"
ww_BEL_event_misc.2.desc: "À peine sorti, le dernier numéro de la bande dessinée d'Hergé rencontre d'ores et déjà un immense succès commercial. Dans ce nouvel opus, l'aventurier énigmatique Tintin est pourchassé jusqu'en Écosse pour un crime qu'il n'a pas commis. L'auteur belge travaillerait dès à présent à l'écriture des prochaines aventures de son héros."
ww_BEL_event_misc.2.a: "Où se passeront les prochaines aventures de Tintin?"







 