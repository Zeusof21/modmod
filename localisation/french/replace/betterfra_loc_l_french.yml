FRA_military_dynamic_modifier:0 "Armée De Terre"
FRA_military_dynamic_modifier_desc:0 "Victorieuse de la Grande Guerre, l’Armée de terre française s’engage, dans l’entre-deux-guerres, dans une vaste phase de modernisation. Pourtant, elle incarne un profond paradoxe, oscillant en permanence entre modernité et obsolescence, aussi bien sur le plan technologique que doctrinal.D’un côté, la France investit massivement dans des équipements modernes : artillerie performante, chars parmi les plus puissants de leur temps, motorisation progressive et fortifications colossales comme la ligne Maginot. De l’autre, la doctrine reste largement marquée par l’expérience de 1914-1918, privilégiant la défense, la puissance de feu et la bataille méthodique au détriment de la mobilité et de la coordination interarmes.\n\nCe contraste se reflète dans le haut commandement, partagé entre chefs prudents, attachés aux certitudes de la guerre passée, et officiers plus audacieux, conscients de la nécessité d’une manœuvre rapide et d’une meilleure intégration des chars, de l’aviation et de l’infanterie. \n\nL’Armée de terre se trouve à un tournant : elle doit achever sa modernisation, sans quoi le prochain conflit pourrait s’avérer particulièrement dangereux pour la nation..."
FRA_navy_dynamic_modifier:0 "La Royale"
FRA_navy_dynamic_modifier_desc:0 "Après la Grande Guerre, un effort considérable est entrepris pour reconstruire et moderniser la Marine française. Beaucoup affirment alors que la France dispose de la meilleure marine de toute son histoire. \n\nPourtant, derrière cette apparente puissance, de sérieuses contraintes demeurent. Le tonnage imposé par le traité de Londres limite fortement la flotte, plaçant la France en position délicate face à des voisins de plus en plus menaçants. Solide et globalement cohérente sur le plan doctrinal, la Marine n’est cependant pas conçue comme une véritable force de projection. Sa mission principale reste la protection des approches maritimes et des colonies. Elle accuse également un retard dans certaines technologies essentielles, comme le radar, un manque qui ne semble pas réellement préoccuper les chefs de la Royale.\n\nSolide et globalement prête, la Marine française aborde l’avenir et les prochaines guerres avec prudence..."
FRA_air_dynamic_modifier:0 "Armée De l'Air"
FRA_air_dynamic_modifier_desc:0 "Première aviation militaire du monde à la fin de la Grande Guerre, l’Armée de l’air française se perd pourtant dans un foisonnement de prototypes au détriment des avions réellement opérationnels. \n\nLa création tardive d’une Armée de l’air indépendante en 1934 ne suffit pas à clarifier une doctrine encore floue : pour beaucoup, la guerre dans les airs reste distincte de celle menée au sol, et les deux ne se soutiennent que très imparfaitement.\n\nSans une modernisation doctrinale et technique rapide, le prochain conflit risque de révéler cruellement ses faiblesses."

