FRA_air_focus:0 "Revoir nos doctrines"
FRA_air_focus_desc:0 "Beaucoup à l'état-major de l'armée de terre ne voient les avions seulement bons pour la reconnaissance, le bombardement stratégique et la supériorité aérienne. Ils sont totalement incapables de concevoir un plan d'attaque terrestre coordonné avec un soutien rapproché de l'aviation. Il est temps de faire changer les mentalités !"
FRA_modernize_the_air_army:0 "Une force aérienne indépendante"
FRA_modernize_the_air_army_desc:0 "Bien que la force aérienne ait été séparée de l'armée de terre en 1933, elle est restée en réalité soumise aux exigences et aux souhaits de cette dernière. Nous devons garantir une plus grande indépendance à l'ensemble de la force aérienne."



FRA_vigerie:0 "François d'Astier de La Vigerie"
FRA_cancels_hoare_laval_pact:0 "Annule la priorité nationale actuelle §YMédiation pour la paix en Éthiopie§!"
FRA_mediate_peace_in_ethiopia_acceptance_tt:0 "[ITA.GetFlag]§Y[ITA.GetName]§! et [ETH.GetFlag]§Y[ETH.GetName]§! sont peu susceptibles d'accepter à moins que leur opinion à notre sujet ne soit plus que §G50§!."
FRA_stabilize_the_state:0 "Stabiliser l'État"
FRA_stabilize_the_state_desc:0 "Nous devons mettre fin à cette instabilité actuelle avant qu'elle ne déchire le pays. Il est temps de sévir contre l'extrémisme."
lar_low_stabiltiy_civil_war_tt:0 "We must raise our stability to prevent a civil war from occuring."
FPM_political_violence_tt:0 "[GetPoliticalViolence]"
FPM_political_violence_enabled_tt:0 "\nCertains groupes peuvent provoquer des §YViolence politique§! si rien n'est fait. Ces groupes peuvent lancer une §Rguerre civile§! si la stabilité de la France tombe en dessous de 30 % alors que nous sommes en paix ou impliqués dans la guerre civile espagnole."
FPM_political_violence_weakened_tt:0 "\nCertains groupes peuvent provoquer des §YViolence politique§! si rien n'est fait. Ces groupes peuvent lancer une §Rguerre civile§! si la stabilité de la France tombe en dessous de 20 % alors que nous sommes en paix ou impliqués dans la guerre civile espagnole."

FPM_political_violence_disabled_tt:0 "\nLes §YViolence politique§! sont actuellement désactivés."
FRA_political_concessions:0 "Concessions politiques"
FRA_political_concessions_desc:0 "Nous pouvons retarder le début des hostilités en accordant des concessions politiques à nos ennemis. Cela deviendra toutefois plus difficile avec le temps."
FRA_uncompetitive_exports:0 "Exportations non compétitives"
FRA_every_other_country_tt:0 "Tous les autres pays :"
set_leader_ideology_socialism_tt:0 "§Y[FRA.GetLeader]§! changement d'idéologie vers §Y$socialism$§!"
FRA_french_social_party_popularity:0 "Le Mouvement du Colonel" 
FRA_french_social_party_popularity_desc:0 "Le Parti social français, dirigé par le colonel de la Rocque, connaît une nouvelle popularité et devient une force notable à droite. En effet, son mouvement est le premier parti de masse de droite dans l'histoire de la France."
FPM_end_the_pause_tt:0 "Remplace la mission §YLe gouvernement Chautemps§! par la mission §YLe Front populaire§!."
FPM_the_popular_front_mission_3:0 "Le gouvernement Chautemps"
FPM_the_popular_front_mission_3_desc:0 "Si le gouvernement Chautemps rend nominalement hommage à l'héritage du Front populaire et bénéficie du soutien de la gauche, il s'agit en réalité d'un gouvernement centriste, destiné à rétablir la stabilité dans le pays après la période radicale de gouvernance socialiste. À l'instar d'autres gouvernements centristes de l'histoire récente, il ne devrait pas durer."
france.347.t:0 "Chautemps forme un nouveau gouvernement"
france.347.d:0 "Le Parti radical, qui gouverne le pays depuis la démission de Blum, s'est progressivement désolidarisé du Front populaire, et après que les antagonismes récents avec les communistes ont atteint leur paroxysme, il a décidé de former un gouvernement sans ministres socialistes ni communistes. Si le Front populaire existe toujours de nom, il est désormais clair que ses jours sont comptés."
france.347.a:0 "Ridicule"
FRA_spanish_nonintervention_category:0 "Comité de non intervention"
FRA_ffiraids_tooltip:0 "§YDéverrouille les raids§! pour attaquer les dépots d'armes allemands"
raid_type_FFI_weapons_depot_raid:0 "Raid des F.F.I"
FRA_power_grid_tt:0 "Il est possible de construire un bâtiment pour le réseau électrique dans cet état"
francepm.37.t:0 "Un cabinet en temps de guerre"
francepm.37.d:0 "Alors que tout le monde s'attendait à ce que la guerre éclate tôt ou tard, il semble que l'ère des grandes réformes menées par le Front populaire remonte à hier. Pourtant, avec le déclenchement des hostilités, de nombreux acteurs de la sphère politique française ont commencé à réclamer un gouvernement de guerre composé de tous les partis, affirmant que la coalition du Front populaire était trop radicale pour diriger le gouvernement pendant le conflit. Si le nouveau gouvernement devait maintenir les politiques du Front populaire, il serait principalement dirigé par des centristes. Le candidat naturel à la tête de ce gouvernement serait Daladier. Devrions-nous lui confier la direction de la nation ?"
francepm.37.a:0 "Continuons les années rouges !"
francepm.37.b:0 "Nous avons besoin d'un leadership modéré en ces temps difficiles."
france.348.t:0 "Une période sportive"
france.348.d:0 "Avec l'élection du Front populaire et l'adoption des deux semaines de congés payés, la France connaît un nouvel élan en matière de loisirs, sans précédent jusqu'alors. Alors qu'auparavant, de nombreuses activités récréatives étaient réservées aux classes moyennes et supérieures, de nombreux Français issus de la classe ouvrière peuvent désormais profiter du théâtre, de la musique, du tourisme et, pendant les mois chauds, même aller à la plage ! Un développement culturel particulièrement notable a été l'engouement des masses pour le sport, organisé par Léo Lagrange du Front populaire, qui a promu le sport non seulement pour le plaisir des masses, mais aussi comme un outil pour aider la France à se préparer à une éventuelle guerre."
france.348.a:0 "Allons jouer au football !"
FRA_sports_promoted:0 "Sports promus"




start_inefficient_economy_tt:0 "Le nouveau gouvernement aura pour mission de relancer l'économie française après la Grande Dépression, en réduisant les effets de l'« économie inefficace » grâce à des mesures ciblées, à la construction d'usines ou à diverses décisions économiques. Certaines décisions économiques peuvent contribuer à réduire les effets de l'§YÉconomie inefficace§!, mais aussi augmenter l'§YInflation§!, qui, si rien n'est fait, entraîneront une détérioration progressive de notre économie. Nous devons trouver un équilibre entre ces deux facteurs."

FRA_three_billion_plan:0 "Plan des trois milliards"
FRA_three_billion_plan_desc:0 "La France dispose d'un riche potentiel hydroélectrique dans le sud, mais notre réseau électrique n'est pas encore capable de transporter cette énergie là où elle est nécessaire. Pour exploiter ce « charbon blanc », comme on l'appelle, nous devons entreprendre une expansion à grande échelle de notre réseau électrique."
FRA_expanded_grid:0 "Réseau électrique étendu"
FRA_expanding_power_grid:0 "Réseau électrique en cours d'extension"
FRA_three_billion_plan_tt:0 "Débloque des décisions : §Y$FRA_three_billion_plan$§!, permettant l'extension du réseau électrique dans les États centraux voisins disposant déjà d'un réseau électrique étendu."
FRA_expand_power_grid:0 "Développer le réseau électrique en [FROM.GetName]"
FRA_strengthen_power_grid:0 "Renforcer le réseau électrique dans [FROM.GetName]"

FRA_form_neapolitan_kingdom:0 "Former un royaume napolitain"
SCAN_accepted_embargo:0 "A accepté nos demandes d'embargo"
FRA_restore_the_mexican_empire:0 "Restaurer l'Empire mexicain"
FRA_illyrian_provinces:0 "Les provinces illyriennes"
FRA_alpine_aluminum:0 "Investir dans l'AFC"
FRA_alpine_aluminum_desc:0 "De grandes quantités de bauxite sont extraites dans les régions du Var et des Bouches-du-Rhône, puis transformées en Savoie, le tout par l'AFC, ou « Compagnie de Produits chimiques d'Alès, Froges et Camargue ». Nous devrions investir dans cette entreprise et développer ses activités." 
FRA_extract_the_saar:0 "Extraire dans la Sarre"
FRA_extract_the_saar_desc:0 "Au lendemain de la Première Guerre mondiale, nous avons créé le territoire du bassin de la Sarre en Sarre, ce qui nous a permis d'accéder à ses riches gisements de charbon et de fer. Bien qu'il ait malheureusement rejoint l'Allemagne en 1935, maintenant que nous en avons repris le contrôle, nous pouvons poursuivre l'extraction des ressources de la région."
FRA_puy_les_vignes_mine:0 "Mine de Puy-les-Vignes"
FRA_puy_les_vignes_mine_desc:0 "Des gisements de tungstène ont été découverts dans la région de Puy-les-Vignes, dans le Limousin. Nous devrions les exploiter."
FRA_battle_for_coal:0 "Bataille du Charbon"
FRA_battle_for_coal_desc:0 "Notre industrie exige un approvisionnement énergétique toujours plus important. Nous devons développer notre extraction de charbon dans le Nord-Pas-de-Calais pour suivre le rythme !"
FRA_expand_refineries:0 "Développer les raffineries CFR"
FRA_expand_refineries_desc:0 "Sous la houlette de la Compagnie Française de Raffinage et de la Compagnie Française des Pétroles, nous avons amélioré l'accès de la France au pétrole ces dernières années, en acquérant une participation importante dans la Iraq Petroleum Company. Le pétrole brut est importé d'Irak, puis acheminé vers la Normandie et la Provence, où il est raffiné. Il est temps d'étendre nos capacités de raffinage afin d'assurer la sécurité énergétique de la France."
FRA_economy_dynamic_modifier_tt:0 "Facteur Usines de biens de consommation: §Y[?FPM_eco_consumer_goods_factory_display].0%§! sur §Y[?FPM_eco_consumer_goods_factory_display_max].0%§!\nProduction des usines: §R[?FPM_eco_industrial_capacity_factory_display].00%§! sur §R[?FPM_eco_industrial_capacity_factory_display_max].00%§!\nProduction des chantier naval: §R[?FPM_eco_industrial_capacity_dockyard_display].00%§! sur §R[?FPM_eco_industrial_capacity_dockyard_display_max].00%§!"
FPM_econ_cap_increase_tt:0 "Réduit §YLimite économique inefficace§! du même montant."

FRA_develop_alsace_pig_iron:0 "Relancer la production de fer en Lorraine"
FRA_develop_alsace_pig_iron_desc:0 "La production française de fer et d'acier a connu une forte baisse au début de la Grande Dépression. Nous allons développer davantage nos mines dans cette région afin de ramener la production aux niveaux d'avant 1929." 
FRA_orient_expedition:0 "Armée d'Orient"
FRA_armee_dorient:0 "Armée d'Orient"
FRA_armee_dorient_desc:0 "Pendant la Grande Guerre, notre armée d'Orient a réussi à mettre les puissances centrales à genoux et à jouer un rôle majeur dans la victoire finale. Depuis le début de la guerre, le général Weygand tente de constituer une force similaire capable d'ouvrir un deuxième front dans un secteur moins défendu par l'ennemi !"

FRA_austerity_measures:0 "Mesures d'austérité"
FRA_austerity_measures_desc:0 "Nous devons réduire les dépenses publiques, en particulier les salaires des fonctionnaires, en cette période de déflation. Ce sera le meilleur moyen d'assurer la stabilité de notre économie dans le contexte actuel."
FRA_austerity_meassures_tt:0 "Peut être répété tous les §Y180§! jours."
FPM_president_of_the_republic:0 "Président de la République"
FRA_bonapartist_party_fascist:0 "PRNS"
FRA_franco_belgian_accords_breda_tt:0 "\nSi nous avons sélectionné le plan §YDyle-Breda§! dans le focus §YPlan Dyle§!, [HOL.GetFlag]§![HOL.GetNameDef]§! peuvent être invités à rejoindre notre faction, à condition que nous soyons en paix avec eux et qu'ils ne fassent pas déjà partie d'une autre faction."
FRA_fascism_plebiscite:0 "Référendum pour un gouvernement fasciste"
FRA_ongoing_plebiscite:0 "Référendum récent"

FPM_republican_concentration:0 "Concentration républicaine"
FPM_republican_concentration_desc:0 "Comme d'habitude en France, la gouvernance incombe une fois de plus aux partis républicains du centre. Comblant le fossé entre les socialistes modérés de gauche et les libéraux et démocrates-chrétiens de droite, notre coalition est modérée mais peu ambitieuse."
mechelin_incident_tt:0 "Si le [GER.GetFlag]§Y[GER.GetName]§! envahit la [BEL.GetFlag]§Y[BEL.GetName]§!, en fonction de leur choix entre les deux options suivantes: §YPlan Manstein§! ou §YNouveau Plan Schlieffen§!, et notre choix entre le §YPlan Dyle§! et le §YPlan Escaut§!, qui peut être sélectionné dans la prioritée nationale '§Y$FRA_dyle_plan$§!'. Si nous ne nous faisons pas cette prioritée nationale, le [GER.GetFlag]§Y[GER.GetName]§! prendra automatiquement l'avantage."
FRA_escaut_plan:0 "Plan Escaut"
france.445.t:0 "Plans de guerre"
france.445.d:0 "L'invasion allemande des Pays-Bas a mis fin à la drôle de guerre. Au cours des derniers mois, les hauts commandements français et allemand ont élaboré des plans en vue de la bataille inévitable. Le sort de l'Europe va enfin être scellé."
france.445.a:0 "Les dés sont jetés..."
FPM_integrate_cochinchina:0 "Intégrer la Cochinchine"
FPM_integrate_cochinchina_desc:0 "Les Français ont toujours tenu l'administration de la Cochinchine à l'écart de nous, la gouvernant directement plutôt que par le biais d'un protectorat. Maintenant que nous sommes indépendants, nous pouvons l'intégrer à notre État." 


FRA_escaut_plan:0 "Plan Escaut"


GER_old_plan:0 "Un nouveau Schlieffen"
GER_new_plan:0 "Plan Manstein"

france.345.t:0 "Incident de Mechelen"
france.345.d:0 "Ce matin, un avion allemand s'est crashé près de Mechelen en Belgique. Un officier allemand qui avait sur lui des documents confidentiels a tenté de les brûler en vain, une partie a pu être déchiffrée par les autorités belges qui nous ont prévenues. Le plan parle d'une invasion par le centre de la Belgique, presque une répétition de 1914 ! Les Allemands semblent à tout point tombés dans notre piège, leur troupes se retrouverons stoppées en Belgique. Pourtant à l'Etat major certains s'inquiètes que les Allemands pourraient bien décider de changer de plan maintenant que celui-ci est entre nos mains..."
france.345.a:0 "Notre plan est supérieur !"
france.345.b:0 "Prenons cet incident au sérieux"


france.344.t:0 "Incident de Mechelen"
france.344.d:0 "Ce matin, un de nos avions contenant des documents secrets sur la future invasion de la France s'est écrasé en Belgique. C'est sans aucun doute que les documents ont dû fuir vers les Alliés et notre plan entier est peut-être en péril. Pour remédier à cela, un jeune officier du nom de Erich von Manstein a présenté un nouveau plan au Furher. Celui-ci a directement adoré sa vision pleine d'audace, un peu trop peut-etre car son plan est un véritable coup de poker, l'armée allemande pourrait etre couverte de gloire ou détruite en 10 jours..."
france.344.a:0 "Le Plan Manstein"
france.344.b:0 "Un nouveau Schlieffen"
FRA_great_offensive:0 "Grande offensive"
FRA_great_offensive_desc:0 "Après une planification minutieuse, il est temps de lancer notre grande offensive. Notre doctrine défensive nous a permis de préparer chaque détail de cette attaque et l'ennemi affaibli par des mois de guerre sera maintenant totalement anéanti par nos forces supérieures !"
FRA_promote_initiative:0 "Promouvoir l'initiative personnelle"
FRA_promote_initiative_desc:0 "Il est temps d'arrêter cette rigidité avec les doctrines militaires, tout ne s'apprend pas à l'école ! Les officiers doivent pouvoir prendre des initiatives sur le terrain comme bon leur semble, sans toujours avoir à tout faire remonter à la haute hiérarchie souvent déconnectée et loin derrière le front..."
FRA_docrinal_development:0 "Purger la vieille garde"
FRA_docrinal_development_desc:0 "Nous ne pourrons pas réformer en profondeur nos forces armées tant que tant de voix conservatrices nous freineront. Une fois écartées, la modernisation de nos doctrines sera bien plus aisée."
FRA_VICTORY_POINTS_587:0 "Cologne"
FRA_VICTORY_POINTS_11531:0 "Sarrebruck"
FRA_VICTORY_POINTS_9575:0 "Trèves"
FRA_VICTORY_POINTS_11435:0 "Bitbourg"


FPM_republican_concentration:0 "Concentration républicaine"
FPM_republican_concentration_desc:0 "Comme d'habitude en France, la gouvernance incombe une fois de plus aux partis républicains du centre. Comblant le fossé entre les socialistes modérés de gauche et les libéraux et démocrates-chrétiens de droite, notre coalition est modérée mais peu ambitieuse."

FRA_exile_motorized:0 "Demander des camions alliés"
FRA_exile_motorized_desc:0 "Nos forces veulent se battre, mais avec le peu d'équipement qui nous reste, la tâche risque d'être difficile. Heureusement, nos alliés pourraient nous aider un peu."
FRA_exile_guns:0 "Demander des fusils alliés"
FRA_exile_guns_desc:0 "Nos forces veulent se battre, mais avec le peu d'équipement qui nous reste, la tâche risque d'être difficile. Heureusement, nos alliés pourraient nous aider un peu."
FRA_exile_suport:0 "Demander des équipements de soutien alliés"
FRA_exile_suport_desc:0 "Nos forces veulent se battre, mais avec le peu d'équipement qui nous reste, la tâche risque d'être difficile. Heureusement, nos alliés pourraient nous aider un peu."
FRA_exile_arillery:0 "Demander de l'artillerie alliée"
FRA_exile_arillery_desc:0 "Nos forces veulent se battre, mais avec le peu d'équipement qui nous reste, la tâche risque d'être difficile. Heureusement, nos alliés pourraient nous aider un peu."

FRA_economy_dynamic_modifier:0 "Économie inefficace"
FRA_economy_dynamic_modifier_desc:0 "Bien qu'elle reste un grand pays industrialisé, la France a pris du retard en termes de concentration des capacités de production. Des réformes majeures sont nécessaires pour rendre notre économie plus compétitive à l'échelle mondiale. \n\n§GCet esprit national disparaîtra si le modificateur des usines de biens de consommation atteint zéro.\n\n§RL'inflation connaîtra un arrêt temporaire si le pays se trouve en état de guerre..§!"




FRA_reaffirm_polish_independence:0 "Réaffirmer l'indépendance de la Pologne"
FRA_reaffirm_polish_independence_desc:0 "Les Polonais constituent un rempart contre les Allemands et les Russes, formant ainsi un élément essentiel de la défense européenne. De plus, ils ont toujours entretenu des liens étroits avec les Bonaparte, et nombreux sont ceux qui, en Pologne, louent encore aujourd'hui Napoléon pour les avoir libérés. Nous devons réaffirmer notre engagement à les défendre."
FRA_the_blum_viollette_proposal:0 "[GetBlumViolette]"
FRA_the_blum_viollette_proposal_desc:0 "[GetBlumVioletteDesc]"
FPMSettleAlgerie:0 "S'installer en Algérie"
FPMSettleAlgerieDesc:0 "L'Algérie fait partie de la France métropolitaine. Il est temps que sa population reflète mieux cette réalité. Nous y parviendrons en invitant davantage de colons français à s'y installer, afin d'en faire une région véritablement française."
FPMBlumViolette:0 "La proposition Blum-Viollette"
FPMBlumVioletteDesc:0 "La citoyenneté de la République française devrait être ouverte à toute personne qui remplit les conditions requises. Bon nombre de nos fidèles sujets en Algérie souhaiteraient devenir citoyens à part entière, mais n'y sont pas encore autorisés. En leur accordant la pleine citoyenneté, nous rapprocherions beaucoup plus l'Algérie de la France."
FRA_algerian_industry:0 "Inviter des investisseurs en Algérie"
 FRA_algerian_industry_desc:0 "Nous consoliderons notre domination sur l'Algérie en invitant des hommes d'affaires et des investisseurs de toute la France à venir s'installer dans la région, afin d'assurer son intégration dans l'économie métropolitaine."
FRA_protect_romania:0 "Protéger la Roumanie"
 FRA_protect_romania_desc:0 "La Roumanie s'est éloignée de notre influence ces dernières années. Nous allons tendre la main à ce pays et le ramener dans notre sphère d'influence continentale, en garantissant ses frontières actuelles."
 FRA_alliance_with_belgrade:0 "Alliance avec Belgrade"
 FRA_alliance_with_belgrade_desc:0 "Les Serbes sont les alliés des Français depuis la Grande Guerre, et nous avons fortement soutenu la création de l'État yougoslave. Nous devons poursuivre cette alliance."
fpmdiploevents.34.t:0 "La France se prépare à occuper le Luxembourg"
 fpmdiploevents.34.d:0 "Invoquant des menaces pour la sécurité dans toute la région du Rhin, le gouvernement français, dirigé par [FRA.GetLeader], a fait une proposition à notre gouvernement, offrant de « protéger » nos libertés en nous intégrant à l'État français, affirmant que les récentes actions agressives d'autres États de la région ont compromis la sécurité de nos deux États. Il s'agit bien sûr d'une demande d'annexion déguisée. Avec un État aussi petit que le nôtre, il est peu probable que nous puissions résister."
 fpmdiploevents.34.a:0 "Nous n'avons d'autre choix que d'accepter."
 fpmdiploevents.34.b:0 "Nous ne renoncerons pas à notre liberté."
 fpmdiploevents.35.t:0 "Le Luxembourg rejoint la France"
 fpmdiploevents.35.d:0 "Conscient de la menace évidente que représentent pour son pays les dangers qui pèsent de l'autre côté du Rhin, le gouvernement luxembourgeois a sagement décidé de se joindre à nous. Nous commencerons immédiatement à intégrer leur État."
 fpmdiploevents.35.a:0 "Bien"
 fpmdiploevents.36.t:0 "Le Luxmebourg résiste"
 fpmdiploevents.36.d:0 "De manière insensée, le gouvernement luxembourgeois a décidé de s'opposer à nos efforts visant à les intégrer. Il ne nous reste désormais qu'une seule option : la force."
 fpmdiploevents.36.a:0 "Imbéciles !"
 fpmdiploevents.37.t:0 "L'Empire français propose l'unification"
 fpmdiploevents.37.d:0 "Les Français nous ont fait une proposition intéressante. Affirmant que la situation en Europe s'est trop détériorée pour garantir la neutralité belge, ils ont proposé que nous unissions notre État au leur, la Belgique étant alors organisée en plusieurs nouveaux départements français. Cela mettrait bien sûr fin à notre indépendance, mais on nous a offert une autonomie significative au sein de l'Empire français. En échange, les Français se sont engagés à défendre notre frontière orientale. Devrions-nous accepter ?"
 fpmdiploevents.37.a:0 "Ensemble, nous serons plus forts !"
 fpmdiploevents.37.b:0 "Nous sommes mieux seuls"
 fpmdiploevents.38.t:0 "La Belgique s'intègre à la France"
 fpmdiploevents.38.d:0 "Le gouvernement belge a accepté notre proposition d'unification. En échange de leur intégration, ils bénéficieront d'une autonomie et d'une promesse de défense au sein de l'Empire."
 fpmdiploevents.38.a:0 "Nous avons fait un pas de plus"
 fpmdiploevents.39.t:0 "La Belgique rejette le plan d'intégration"
 fpmdiploevents.39.d:0 "Le gouvernement belge a bêtement rejeté notre projet d'intégration dans notre État pour assurer une défense commune. Compte tenu de leur récente position en faveur de la neutralité, ils constituent alors une menace claire et immédiate pour la sécurité française, car toute armée ennemie pourrait envahir leur territoire sans que notre armée soit prête à les affronter. Nous devons prendre l'initiative et frapper les premiers."
 fpmdiploevents.39.a:0 "Malheureux"
FRA_unify_belgium_tt:0 "[BEL.GetFlag]§Y[BEL.GetName]§! seront plus enclins à accepter s'ils ont une bonne opinion de nous et/ou s'ils partagent la même idéologie."
FRA_our_natural_borders_desc:0 "Les frontières naturelles de la France sont les Alpes, la Méditerranée, les Pyrénées, l'Atlantique et enfin le Rhin. Notre sécurité sera toujours menacée tant que nous ne les aurons pas."
FRA_liberate_spain:0 "Libérer l'Espagne"
 FRA_liberate_spain_desc:0 "Les forces réactionnaires ont malheureusement réussi à prendre le contrôle de l'Espagne, malgré tous nos efforts. Nous devons ramener la liberté dans la péninsule ibérique."
FRA_liberate_spain_tt:0 "Obtiens §YVassal (Focus)§! objectif de guerre contre tout gouvernement espagnol fasciste ou non aligné." 
FRA_class_against_class:0 "Classe contre classe"
FRA_class_against_class_desc:0 "Maintenant que la menace du fascisme a été largement éliminée, nous pouvons revenir aux politiques de la Troisième Période et concentrer à nouveau nos efforts sur la destruction de la démocratie bourgeoise."
fpmdiploevents.14.b:0 "Invitons-les à rejoindre notre alliance !"
FRA_scandinavian_intervention_tt:0 "Les pays qui ont une bonne opinion de nous peuvent également être invités à rejoindre notre faction." 
FRA_iberian_alliance:0 "Alliance ibérique"
FRA_iberian_alliance_desc:0 "Les nations ibériques sont des alliés naturels de la France. Latines comme nous, elles sont historiquement francophiles. Nous les attirerons dans notre bloc."
FRA_strengthen_the_entente:0 "Renforcer l'Entente"
FRA_strengthen_the_entente_desc:0 "L'Entente cordiale, signée en 1904, s'avère être notre meilleure alliance à ce jour. Nous devons nous éloigner des croyances anglophobes que beaucoup dans notre gouvernement professent."
FRA_romanian_maurrasisme:0 "Maurrasisme roumain"
FRA_romanian_maurrasisme_desc:0 "La Roumanie est un pays frère latin, et les idées de Maurras sont devenues très populaires parmi les conservateurs roumains. Nous ferions bien de les intégrer dans notre sphère d'influence."
fpmdiploevents.40.t:0 "[FROM.GetName] nous presse pour obtenir un accès militaire"
 fpmdiploevents.40.d:0 "Invoquant la nécessité de transporter leurs troupes en toute sécurité en Roumanie afin de protéger les champs pétrolifères qui s'y trouvent, le gouvernement français nous a demandé d'autoriser le passage de leurs troupes. En échange, ils s'engagent à garantir et à protéger notre neutralité. Si nous refusons, nous risquons toutefois de menacer leurs intérêts diplomatiques dans la région."
 fpmdiploevents.40.a:0 "Nous leur accorderons l'accès."
 fpmdiploevents.40.b:0 "Nous ne les laisserons pas entrer."
 fpmdiploevents.41.t:0 "La Bulgarie nous accorde un accès militaire"
 fpmdiploevents.41.d:0 "Après des négociations tendues, le gouvernement bulgare a décidé d'accorder à nos troupes un passage sûr vers la Roumanie. En échange, nous avons garanti leur neutralité dans le conflit européen actuel. Avec un peu de chance, cela pourrait marquer le début de bonnes relations avec la Bulgarie, et nous pourrions, à l'avenir, les attirer dans notre sphère d'influence, à mesure qu'ils continuent à nous faire des concessions."
 fpmdiploevents.41.a:0 "Très bien !"
 fpmdiploevents.42.t:0 "La Bulgarie nous refuse l'accès militaire"
 fpmdiploevents.42.d:0 "Nos diplomates sont revenus aujourd'hui après l'échec des négociations avec l'État bulgare concernant le passage de nos troupes sur leur territoire. Cela a affaibli notre capacité à accéder aux champs pétrolifères roumains, et nous devrons peut-être assurer notre passage par la force."
 fpmdiploevents.42.a:0 "Ils ne nous laissent pas d'autre choix."
FRA_revive_the_franco_polish_alliance_tt:0 "\nLa Pologne serait invitée à rejoindre notre faction si nous faisions partie d'une faction."
FRA_reorganize_the_dutch_desc:0 "Les Néerlandais aussi faisaient autrefois partie de l'Empire français. Maintenant que la taille de leur État a été réduite, il est temps de mettre fin à leur existence pitoyable et de les ramener à leur état naturel."
fpmdiploevents.43.t:0 "[FRA.GetNameDef] exige Brabant"
 fpmdiploevents.43.d:0 "Le gouvernement français, après avoir récemment réaffirmé ses revendications sur tous les territoires situés à l'ouest du Rhin, s'est adressé à nous pour exiger les provinces du Brabant, de Zélande et du Limbourg, invoquant des « raisons de sécurité ». Nous conserverions la ville de Rotterdam, mais tous les autres territoires situés au sud du Rhin seraient cédés à la France. Que devons-nous faire ?"
 fpmdiploevents.43.a:0 "Nous ne pouvons pas revivre un autre Rampjaar."
 fpmdiploevents.43.b:0 "C'est le territoire des [HOL.GetAdjective]"
 fpmdiploevents.44.t:0 "[FROM.GetName] cede les territoires du sud."
 fpmdiploevents.44.d:0 "Le gouvernement [HOL.GetAdjective], conscient de sa position défavorable, a décidé de nous céder tous les territoires situés au sud du Rhin, à l'exception de la ville de Rotterdam. Nous avons ainsi pris le contrôle des Pays-Bas."
 fpmdiploevents.44.a:0 "Bien"
 fpmdiploevents.45.t:0 "Le [HOL.GetAdjective] refuse les négociations"
 fpmdiploevents.45.d:0 "Le gouvernement [HOL.GetAdjective] a quitté précipitamment les négociations aujourd'hui après que nous ayons exigé qu'il cède des territoires dans le sud des Pays-Bas. Il semble que notre seul recours soit désormais la guerre."
 fpmdiploevents.45.a:0 "Ce sera la guerre."
FRA_demand_brabant:0 "Le plan Breda" 
 FRA_demand_brabant_desc:0 "Notre sécurité ne peut être totale qu'avec l'intégration de toute la rive sud du Rhin sous notre contrôle. Nous devons demander au gouvernement néerlandais de nous la céder, afin de nous permettre d'établir une ligne de défense sûre dans les Pays-Bas."
 FRA_demand_brabant_tt:0 "[HOL.GetFlag]§Y[HOL.GetName]§! Ils seront plus enclins à accepter si nous entretenons de bonnes relations avec eux et/ou si notre armée est considérablement plus importante que la leur."
FRA_reorganize_the_dutch_tt:0 "\nRéduit le coût de la prise des provinces néerlandaises de §G50%§!." 
fpmdiploevents.46.t:0 "Les Français exigent notre soumission"
 fpmdiploevents.46.d:0 "Le gouvernement français, déterminé à réécrire l'ordre européen, nous a demandé d'aligner notre gouvernement sur le sien et de céder certaines parties de la Suisse romande en échange de notre relative autonomie. Nous serions autorisés à conserver notre système politique actuel, mais nos relations étrangères seraient contrôlées par la France. Devrions-nous accepter ?"
 fpmdiploevents.46.a:0 "Ce n'est pas une mauvaise affaire."
 fpmdiploevents.46.b:0 "Jamais"
 fpmdiploevents.47.t:0 "La Suisse se réorganise en République helvétique"
 fpmdiploevents.47.d:0 "Le gouvernement suisse a sagement accepté nos demandes d'alignement sur nos objectifs internationaux et a rétabli la République helvétique."
 fpmdiploevents.47.a:0 "Bien"
 fpmdiploevents.48.t:0 "La Suisse rejette notre demande de création d'une République helvétique"
 fpmdiploevents.48.d:0 "Malheureusement, les Suisses ont rejeté notre demande de réorganisation en République helvétique. Nous devons désormais poursuivre notre programme par la force des armes."
 fpmdiploevents.48.a:0 "Si c'est ainsi que cela doit être"
FRA_reorganize_southern_europe:0 "Réorganiser l'Europe du Sud"
 FRA_reorganize_southern_europe_desc:0 "La Méditerranée, autrefois foyer de conflits, a été unifiée par nos soins. Nous la réorganiserons à notre image, pour la gloire de la France."
FRA_POL_LIT_union_desc:0 "La Pologne a toujours été un allié fiable de la France. Nous devons renforcer leur position à l'est, en rétablissant l'ancienne communauté, en vue de notre avancée vers la Russie."
fpmdiploevents.49.t:0 "[FRA.GetName] propose la restauration du Commonwealth"
 fpmdiploevents.49.d:0 "Le gouvernement [FRA.GetAdjective] a proposé un plan visant à rétablir la République des Deux Nations, affirmant qu'une Pologne forte est essentielle à la stabilité et à la défense de l'Europe contre l'agression [SOV.GetAdjective]. Si nous acceptons, nous enverrons la proposition au gouvernement lituanien."
 fpmdiploevents.49.a:0 "Ok"
 fpmdiploevents.49.b:0 "Non merci"
 fpmdiploevents.50.t:0 "Les gouvernements [POL.GetAdjective] et [FRA.GetAdjective] proposent de restaurer le Commonwealth"
 fpmdiploevents.50.d:0 "Les gouvernements [POL.GetAdjective] et [FRA.GetAdjective] nous ont fait une proposition visant à rétablir la République des Deux Nations. Cela signifierait bien sûr la fin de notre indépendance. Si nous refusons, une guerre serait probable. Devrions-nous accepter ?"
 fpmdiploevents.50.a:0 "Nous n'avons pas d'autre choix."
 fpmdiploevents.50.b:0 "Nous nous battrons !"
 fpmdiploevents.51.t:0 "[FROM.GetName] rejette le plan du Commonwealth"
 fpmdiploevents.51.d1:0 "Le gouvernement [POL.GetAdjective] a malheureusement décidé de rejeter les plans visant à restaurer le Commonwealth.  There is nothing we can do..."
 fpmdiploevents.51.d2:0 "Le gouvernement [LIT.GetAdjective]  a décidé de rejeter les projets de restauration du Commonwealth. Le gouvernement [POL.GetAdjective] pourrait désormais recourir à la force."
 fpmdiploevents.51.a:0 "Malheureux"
 fpmdiploevents.52.t:0 "[FROM.GetName] accepte le Commonwealth"
 fpmdiploevents.52.d:0 "Le gouvernement [FROM.GetName], Conscient de sa faiblesse et de sa vulnérabilité face à l'agression [SOV.GetAdjective], il a sagement décidé d'accepter notre proposition du Commonwealth."
 fpmdiploevents.5d.a:0 "Bien !"
fpmleagues.14.t:0 "La question romaine"
 fpmleagues.14.d:0 "La soumission de la péninsule italienne étant achevée, nous devons prendre en main la réorganisation des territoires. Une question particulière se pose aujourd'hui, celle des terres de l'Italie centrale. Trois options s'offrent à nous. Nous pouvons les rendre aux Italiens, nous pouvons les annexer comme l'a fait Napoléon Ier, ou nous pouvons suivre les traces de Napoléon III, en protégeant la souveraineté papale et en rétablissant leur indépendance. Que ferons-nous ?"
 fpmleagues.14.a:0 "Les Italiens l'auront."
 fpmleagues.14.b:0 "Rome sera française !"
 fpmleagues.14.c:0 "Donnez-le au pape."
FRA_united_states_of_europe:0 "États-Unis d'Europe"
 FRA_united_states_of_europe_desc:0 "En exil à Sainte-Hélène, Napoléon a un jour évoqué l'idée d'une Europe unie. Maintenant que nous avons unifié le continent, nous devons réaliser son rêve !"
FRA_proclaim_the_third_empire:0 "La présidence bonapartiste"
 FRA_proclaim_the_third_empire_desc:0 "Les bonapartistes sont peut-être étrangers à la tradition monarchique française, mais ils portent en eux le rêve d'une époque où toute l'Europe s'inclinait devant la France. Même dans ce cas, c'est ce qu'ils font plutôt que ce qu'ils sont qui leur donne du poids. Ils devront faire leurs preuves."
FRA_instigate_workers_revolution_general_desc:0 "Les travailleurs réclament leur libération. Nous la leur apporterons."
FRA_adopt_neosocialism:0 "Adopter le néosocialisme"
 FRA_adopt_neosocialism_desc:0 "Une grande partie de la gauche reste opposée à notre gouvernement, mais certains sont prêts à se rallier à la cause impériale. Nous les inviterons à rejoindre notre gouvernement."
 FRA_a_new_tilsit:0 "Un nouveau Tilsit"
 FRA_a_new_tilsit_desc:0 "Les Russes ont été nos alliés historiques, et bien que beaucoup les aient rejetés ces derniers temps en raison de leur nouveau gouvernement, dans l'esprit de Tilsit, nous nous réunirons une fois de plus."
 FRA_joint_war_planning:0 "Planification militaire conjointe"
 FRA_joint_war_planning_desc:0 "Tout comme pendant la Grande Guerre, nous devons coordonner nos forces avec celles de la Grande-Bretagne pour remporter une victoire commune."
 FRA_retake_saint_domingue:0 "Reprendre Saint-Domingue"
 FRA_retake_saint_domingue_desc:0 "La révolution haïtienne a mis fin à la domination française sur Saint-Domingue, affaiblissant considérablement notre pouvoir dans les Caraïbes. Nous allons maintenant revenir."
 FRA_joint_weapons_development:0 "Développement conjoint d'armes"
 FRA_joint_weapons_development_desc:0 "Nous approfondirons notre coopération avec les Britanniques en veillant à ce que nous disposions tous deux des meilleures armes au monde pour nous équiper, grâce au partage de nos recherches."
 FRA_third_invasion_of_mexico:0 "Troisième intervention au Mexique"
 FRA_third_invasion_of_mexico_desc:0 "Napoléon III a autrefois envahi le Mexique, mais malheureusement sans succès. Nous réussirons là où il a échoué, en nous assurant un allié dans les Amériques."
 FRA_a_trip_to_quebec:0 "Un voyage au Québec"
 FRA_a_trip_to_quebec_desc:0 "Depuis notre alliance avec les Britanniques, Napoléon songe à  se rendre au Québec pour rencontrer les francophones qui y vivent. Réalisons ce voyage !"
FRA_quebec_trip.1.t:0 "[FRA.GetLeader] Fait un discours en faveur de l'indépendance du Québec"
 FRA_quebec_trip.1.d:0 "[FRA.GetLeader], lors de son récent voyage au Québec, a prononcé de manière inattendue un discours en faveur de l'indépendance québécoise, et il semble désormais que la politique du gouvernement [FRA.GetAdjective] soit de soutenir l'indépendance du Québec. Même si une guerre semble peu probable, il est clair que les troubles au Québec semblent s'intensifier."
 FRA_quebec_trip.1.a:0 "Donnez-leur leur indépendance"
 FRA_quebec_trip.1.b:0 "C'est une violation de notre souveraineté !"
 FRA_quebec_trip.2.t:0 "Le Québec obtient son indépendance"
 FRA_quebec_trip.2.d:0 "Notre voyage au Québec semble avoir attiré l'attention, et après que [FRA.GetLeader] ait prononcé un discours en faveur de l'indépendance du Québec, les pressions en faveur de l'indépendance se sont intensifiées, ce qui a conduit le gouvernement canadien à décider à contrecœur de libérer le Québec, sous notre supervision, en tant qu'État indépendant."
 FRA_quebec_trip.2.a:0 "Vive le Québec libre !"
 FRA_quebec_trip.3.t:0 "Le Québec reste canadien"
 FRA_quebec_trip.3.d:0 "Malheureusement, les Québécois n'ont pas obtenu leur indépendance des Canadiens, malgré nos pressions en ce sens. Nous ne pouvons pas faire grand-chose d'autre qu'espérer qu'ils deviennent un jour libres."
 FRA_quebec_trip.3.a:0 "Malheureux"
FRA_force_de_frappe:0 "Force de Frappe"
 FRA_force_de_frappe_desc:0 "L'Empire a besoin d'une force nucléaire puissante en cette nouvelle ère, et c'est seulement grâce à elle que nous pourrons véritablement assurer notre domination éternelle. Quiconque menacera de nous détruire sera accueilli par un feu nucléaire."
FRA_red_prince:0 "Les néosocialistes ont fait défection vers la droite."
fpmleagues.15.t:0 "Les néosocialistes font défection vers la droite"
 fpmleagues.15.d:0 "Le mouvement néosocialiste, dirigé par Marcel Déat, s'est de plus en plus orienté, au cours des dernières années, vers des politiques autoritaires et collaborationnistes, s'éloignant ainsi de son héritage gauchiste. Avec la montée du fascisme en France, de nombreux néosocialistes ont adopté ses idéaux."
 fpmleagues.15.a:0 "Ils feraient bien de se joindre à nous."
 fpmleagues.15.b:0 "Nous n'avons pas besoin de leur aide."
FRA_leftist_opposition:0 "Opposition de gauche"
 FRA_leftist_opposition_desc:0 "En réponse à notre élection, les forces du Front populaire dans toute la France ont organisé une opposition politique importante à notre régime."
 FRA_leftist_opposition2:0 "$FRA_leftist_opposition$"
 FRA_leftist_opposition_desc:0 "En réponse à notre élection, les forces des partis socialiste et communiste ont organisé une opposition politique importante à notre régime."
 FRA_leftist_opposition3:0 "$FRA_leftist_opposition$"
 FRA_leftist_opposition_desc:0 "En réponse à notre élection, les forces du Parti socialiste ont organisé une opposition politique importante à notre régime."
 FRA_leftist_opposition4:0 "$FRA_leftist_opposition$"
 FRA_leftist_opposition_desc:0 "En réponse à notre élection, les forces des partis socialiste et radical ont organisé une opposition politique importante à notre régime."
FRA_the_liberal_empire:0 "Une monarchie républicaine"
 FRA_the_liberal_empire_desc:0 "Le bonapartisme n'a jamais vraiment concerné les rois ou les empereurs, il a toujours concerné la France ! La France dirigée par un seul dirigeant central fort, qui tire sa légitimité du peuple. Napoléon Ier a été consul et Napoléon III président. Abolissons les titres archaïques et gouvernons la France simplement en tant que République."





FRA_mat_organization:0 "MAT"
FRA_vineyards:0 "Vignobles"
FRA_communism_plebiscite:0 "Référendum pour un gouvernement communiste"
FRA_democratic_plebiscite:0 "Référendum pour un gouvernement démocratique"
FRA_monarchist_plebiscite:0 "Référendum pour un gouvernement monarchiste"
FRA_fascist_plebiscite:0 "Référendum pour un gouvernement fasciste"
FRA_le_prince_rouge_decision_tt:0 "Le total combiné du soutien aux non-alignés et au communisme dépasse 50 %."
FRA_the_liberal_empire_decision_tt:0 "Le total combiné des voix des partis non alignés et démocratiques dépasse les 50 %."
FRA_le_prince_rouge:0 "Le Prince Rouge"
 FRA_le_prince_rouge_desc:0 "Napoléon-Jérôme Bonaparte était surnommé « Le Prince Rouge » en raison de ses opinions politiques radicales, souvent favorables aux républicains ! Cela peut sembler étrange, mais nous devrions suivre ses traces et créer une nouvelle France rouge."
 FRA_the_liberal_empire:0 "L'Empire libéral"
 FRA_the_liberal_empire_desc:0 "Avant d'être renversé en 1870, Napoléon III avait pris des mesures pour libéraliser le Second Empire, et en effet, le bonapartisme a toujours tiré sa légitimité du peuple. Finissons-en avec la politique extrémiste et ramenons la démocratie en France."
 FRA_classical_bonapartism:0 "Bonapartisme classique"
 FRA_classical_bonapartism_desc:0 "Beaucoup lancent des idées radicales, à gauche comme à droite. Napoléon Ier a, à juste titre, synthétisé les idéaux de la révolution radicale avec les principes de la monarchie. Nous maintiendrons cette tradition."
 FRA_jeunesses_patriotes:0 "Jeunesses Patriotes"
 FRA_jeunesses_patriotes_desc:0 "Beaucoup de membres du mouvement bonapartiste moderne ont une affinité pour le fascisme à l'italienne. Il convient de noter en particulier l'un des plus grands mouvements bonapartistes français à l'heure actuelle, la ligue de droite des Jeunesses Patriotes. Nous devons leur donner les moyens d'agir."
 FRA_renovate_paris:0 "Rénover Paris"
 FRA_renovate_paris_desc:0 "Pendant le Second Empire, Napoléon III et Georges-Eugène Haussmann ont entamé un processus de rénovation de Paris, faisant de la ville ce qu'elle est aujourd'hui. Tout comme lui, nous devons investir dans la ville afin qu'elle reste la capitale culturelle du monde."
 FRA_corsican_favoritism:0 "Favoritisme corse"
 FRA_corsican_favoritism_desc:0 "En tant que Corse lui-même, Napoléon ressentait un lien profond avec les habitants de l'île, et en effet, nombreux sont ceux qui, encore aujourd'hui, sympathisent avec la politique bonapartiste. Nous récompenserons leur loyauté en investissant dans l'île, afin qu'elle atteigne le niveau du reste de la France."
 FRA_taittinger_champagne:0 "Champagne Taittinger"
 FRA_taittinger_champagne_desc:0 "Les Jeunesses Patriotes sont dirigées par un certain producteur de champagne, Pierre Taittinger, qui est lui-même bonapartiste. Nous allons investir dans son entreprise, afin de montrer au monde entier que les meilleures boissons au monde sont françaises."
 FRA_legitimize_our_dynasty:0 "Légitimer notre dynastie"
 FRA_legitimize_our_dynasty_desc:0 "La maison Bonaparte, bien qu'elle ait mené la France à la grandeur, est souvent considérée comme illégitime dans de nombreux cercles monarchistes. Nous prouverons au monde entier que nous sommes tout aussi dignes de diriger la France que n'importe quel autre roi ou président."
VICTORY_POINTS_9523:0 "Versailles"
upgrade_eiffel_tower_tt:0 "Améliore l'effet de §Y$landmark_eiffel_tower$§! de Stabilité: §G+5.00%§! à Stabilité: §G+10.00%§!"
FRA_bonapartist_central_committee:0 "Comité central bonapartiste"
 FRA_bonapartist_central_committee_desc:0 "Ce parti politique, fidèle aux Bonaparte, est populaire en Corse depuis un certain temps déjà ! Nous adopterons leurs objectifs à l'échelle nationale."
FPM_champagne_producer:0 "Producteur de champagne"
FRA_bonepartist_party_long:0 "Parti de l'Appel au peuple"
FRA_bonepartist_party:0 "L'Appel au peuple"
FRA_ally_mussolini:0 "S'Allier à [ITA.GetLeader]"
 FRA_ally_mussolini_desc:0 "L'Italie a reconstruit son pays sur des bases solides. En tendant la main à ce pays, nous pouvons sécuriser notre frontière sud-est."
 FRA_over_the_alps:0 "Au-dessus des Alpes"
 FRA_over_the_alps_desc:0 "L'État italien représente un danger pour nous, car il s'aligne trop étroitement avec d'autres puissances dangereuses en Europe. Tout comme Napoléon Ier, Charlemagne et Hannibal ont autrefois traversé les Alpes, nous le ferons aussi." 
FRA_imperial_ambitions:0 "Ambitions impériales"
 FRA_imperial_ambitions_desc:0 "Bien que nous soyons arrivés au pouvoir depuis peu, nous n'avons guère le temps de nous reposer. Alors que la situation dans le reste du monde devient de plus en plus instable, nous devons agir rapidement et affirmer clairement notre ambition d'assurer la domination française sur l'Europe."
FRA_empire_francais_desc:0 "Au lendemain de la Grande Guerre, la Russie était secouée par la révolution, l'Italie était en proie au chaos politique, les empires austro-hongrois et turc s'étaient effondrés, les puissances anglo-américaines s'étaient à nouveau repliées sur elles-mêmes et l'Allemagne était accablée par la défaite. Nous étions au sommet de l'Europe. Nous ne pouvons pas laisser cette occasion nous échapper."
FRA_maintain_the_entente:0 "Maintenir l'Entente" 
 FRA_maintain_the_entente_desc:0 "Malgré leur mépris persistant pour le bien-être des Français en ces temps difficiles, les Anglais se sont révélés être des alliés précieux pour la France. Nous devons réaffirmer l'Entente cordiale et obtenir leur engagement en faveur d'une défense mutuelle."

FRA_raymond_molinier:0 "Raymond Molinier"
fpmnewrev.6.d:0 "Avec la montée soudaine en popularité de la politique communiste après l'élection du Front populaire, on a assisté à l'essor de politiques alternatives de gauche, qui ne sont pas nécessairement en accord avec les opinions de la Troisième Internationale. Il convient de noter en particulier la montée en puissance de la politique trotskiste, dont le groupe le plus important est dirigé par Raymond Molinier. Exprimant leur opposition au PCF stalinien ainsi qu'à la gauche socialiste démocratique, ils sont certainement devenus un rival notable des organisations de gauche établies en France."
fpmnewrev.6.a:0 "Écoutons-les."
fpmnewrev.6.b:0 "Ils devraient être purgés."
fpmnewrev.2.t:0 "The Reign of Terror"
fpmnewrev.2.d1:0 "Depuis que la France a entamé sa révolution, certains cherchent à nous freiner à chaque étape. Certains ont suffisamment confiance en eux pour nous affronter dans la rue, mais il y a toujours eu un groupe qui a cherché à contrer la volonté du peuple de manière moins visible. Luttant contre chacune de nos initiatives, les dirigeants de l'opposition politique, lâches qu'ils sont, ont réussi à nous empêcher de mettre en œuvre la volonté du peuple en s'alliant avec des bureaucrates de bas niveau et en bloquant constamment nos programmes politiques au parlement. Nous ne supporterons plus leurs abus. \n\nMobilisant les plus dévoués à la Révolution, le peuple français s'est organisé en Groupes de défense antifascistes, des milices armées agissant comme une garde révolutionnaire afin de purger enfin notre société de sa pourriture. À minuit ce soir, ils s'apprêtent à mettre à exécution leur plan visant à purger la France de ses ennemis de classe et à faire entrer la France dans une nouvelle ère, plus égalitaire."
 fpmnewrev.2.d2:0 "Depuis que la France a entamé sa révolution, certains cherchent à nous freiner à chaque étape. Certains ont suffisamment confiance en eux pour nous affronter dans la rue, mais il y a toujours eu un groupe qui a cherché à contrer la volonté du peuple de manière moins visible. Luttant contre chacune de nos initiatives, les dirigeants de l'opposition politique, lâches qu'ils sont, ont réussi à nous empêcher de mettre en œuvre la volonté du peuple en s'alliant avec des bureaucrates de bas niveau et en bloquant constamment nos programmes politiques au parlement. Nous ne supporterons plus leurs abus. \n\nMobilisant les plus dévoués à la Révolution, le peuple français s'est organisé en Groupes de défense antifascistes, des milices armées agissant comme une garde révolutionnaire afin de purger enfin notre société de sa pourriture. À minuit ce soir, ils s'apprêtent à mettre à exécution leur plan visant à purger la France de ses ennemis de classe et à faire entrer la France dans une nouvelle ère plus égalitaire. \n\nLe projet semble prêt à être mis en œuvre, mais certains s'inquiètent de l'influence trop importante des trotskistes au sein de ces milices. Raymond Molinier, en particulier, milite pour que celles-ci soient transformées en une organisation paramilitaire communiste plus importante afin de protéger la nouvelle Révolution française contre ce qu'il considère comme un continent rempli de réactionnaires. Certains craignent que cela ne lui confère trop de pouvoir, mais il a assuré au parti qu'il n'y avait aucune raison de s'inquiéter."
fpmnewrev.2.a:0 "Il ne faut pas aller trop loin."
fpmnewrev.2.b:0 "Justice sera faite."
FRA_TROTSKYIST_COUP:0 "§RCela pourrait conduire à un coup d'État trotskiste...§!"
fpmnewrev.4.t:0 "Le complot trotskiste"
fpmnewrev.4.d:0 "Raymond Molinier a récemment gagné en influence avec la montée du trotskisme en France. Il semble qu'il ait désormais pris des mesures pour renforcer son emprise. Hier soir, alors que les gardes révolutionnaires arrêtaient des centaines de contre-révolutionnaires à travers le pays, il a profité de sa nouvelle influence sur eux pour saisir l'occasion de prendre le contrôle de la nation, déclarant qu'il existait au sein de l'État des éléments diviseurs et réactionnaires qui devaient être immédiatement éliminés. Il semble qu'avec la disparition de toute opposition, Molinier ait désormais le contrôle total de l'État."
fpmnewrev.4.a:0 "Vive la révolution!"
FRA_knowledge_hub:0 "Centre de connaissances"
FRA_knowledge_hub_desc:0 "Notre statut de bastion démocratique favorable à la classe ouvrière a attiré dans nos universités des intellectuels du monde entier. Les penseurs exilés des États anti-intellectuels sont libres ici de contribuer à notre cause."
FPM_poi_long:0 "Parti ouvrier internationaliste"
FPM_poi:0 "POI"
FRA_recently_intervened_tt:0 "Nous n'avons pas récemment intensifié notre intervention dans la guerre civile espagnole."
FRA_intervene_in_spain_tt:0 "Nous avons pleinement intensifié notre intervention dans la guerre civile espagnole."
fpmdiploevents.32.t:0 "La Société des Nations exige la non-intervention en Espagne"
fpmdiploevents.32.d:0 "Pendant que la [FRA.GetName] a récemment formé le Comité de non-intervention afin de garantir que la guerre civile en Espagne ne dégénère pas en une guerre européenne plus large, mais ce comité n'avait jusqu'alors pas beaucoup de poids. Cependant, grâce à son influence au sein de la Société des Nations, [FRA.GetName] a demandé à la Société des Nations d'appliquer la non-intervention, affirmant la nécessité d'un embargo sur tous les pays qui ne respectent pas les principes de non-intervention."
fpmdiploevents.32.a:0 "Nous appliquerons la résolution."
fpmdiploevents.32.b:0 "Nos marchés doivent rester libres et ouverts."
FRA_invite_spain:0 "L'Alliance espagnole"
FRA_invite_spain_desc:0 "Notre frontière sud avec l'Espagne est longue et en grande partie non surveillée. Nous devrions sécuriser notre flanc sud et les inviter à rejoindre notre alliance."
FRA_enforce_non_intervention:0 "Appliquer la non-intervention"
FRA_enforce_non_intervention_desc:0 "Même si nous avons formé le Comité de non-intervention, les pays continuent de prendre ouvertement parti dans la guerre, au risque de déclencher une guerre mondiale. Nous devons demander à la Société des Nations de mettre un terme à cette situation." 
FRA_non_intervention_committee:0 "Le Comité de non-intervention"
FRA_non_intervention_committee_desc:0 "Nous ne pouvons pas laisser une guerre mondiale éclater à cause de la crise en Espagne. Nous devons amener les grandes puissances de ce monde à accepter la non-intervention."
fpmhoarelaval.1.t:0 "La France tente de jouer le rôle de médiateur pour la paix"
fpmhoarelaval.1.d:0 "La France a proposé de servir de médiateur dans la guerre italo-éthiopienne en cours, sur la base des principes du pacte Hoare-Laval divulgué quelques mois auparavant. Si nous et l'Éthiopie acceptions, nous obtiendrions une partie du nord de l'Éthiopie et gagnerions une influence économique sur le reste du pays, ce qui nous permettrait de contrôler une grande partie de la région dans la pratique. Bien sûr, nous pourrions simplement refuser cette proposition et tout prendre pour nous, mais le coût d'une telle décision reste à déterminer."
fpmhoarelaval.1.a:0 "Concluons un accord."
fpmhoarelaval.1.b:0 "Nous devons sécuriser l'ensemble du territoire éthiopien."
fpmhoarelaval.2.t:0 "La France tente de jouer le rôle de médiateur pour la paix"
fpmhoarelaval.2.d:0 "La France a proposé de servir de médiateur dans la guerre italo-éthiopienne en cours, sur la base des principes du pacte Hoare-Laval divulgué quelques mois auparavant. Nous avons été informés que l'Italie avait déjà accepté ce pacte. Si nous l'acceptions également, nous devrions céder une partie du nord de l'Éthiopie et laisser les Italiens exercer une influence économique sur le reste de notre pays, ce qui leur permettrait en pratique de contrôler une grande partie de la région. C'est peut-être notre meilleure chance d'obtenir la paix..."
fpmhoarelaval.2.a:0 "Concluons un accord."
fpmhoarelaval.2.b:0 "Nous ne ferons aucun compromis sur notre souveraineté."
fpmhoarelaval.3.t:0 "[FROM.GetName] rejette l'accord de paix"
fpmhoarelaval.3.d:0 "Le gouvernement [FROM.GetName] a rejeté notre offre de médiation pour la paix, affirmant que le compromis proposé n'était pas dans l'intérêt national. Il semble donc que nous n'ayons plus aucune possibilité de négocier la paix dans la région."
fpmhoarelaval.3.a:0 "Malheureux"
fpmhoarelaval.4.t:0 "La paix dans la Corne de l'Afrique"
fpmhoarelaval.4.d:0 "Grâce à notre médiation, il semble que [ITA.GetName] et l' [ETH.GetName] ont réussi à signer un traité de paix, ramenant ainsi la paix dans la Corne de l'Afrique. Alors que beaucoup ont condamné notre paix comme étant conciliante envers [ITA.GetName] et en sapant les principes de la Société des Nations, avec un peu de chance, nous aurons obtenu l'aide de l'Italie pour contenir d'autres menaces mondiales."
fpmhoarelaval.4.a:0 "Merveilleux"
FRA_mediate_peace_in_ethiopia:0 "Médiation pour la paix en Éthiopie"
FRA_mediate_peace_in_ethiopia_desc:0 "Maintenant que notre gouvernement est stabilisé après les élections, nous pouvons poursuivre nos efforts de médiation pour rétablir la paix entre l'Italie et l'Éthiopie sur la base des termes du pacte Hoare-Laval."
FRA_concessions_to_italy_tt:0 "[ITA.GetFlag]§Y[ITA.GetName]§! est peu susceptible d'accepter de rejoindre le Front de Stresa à moins d'être dirigé par §YDino Grandi§!, que nous avons négocié avec succès les termes du §Y Pacte Hoare-Laval§!, ou [ITA.GetFlag]§Y[ITA.GetName]§! est §YDemocratique§! ou §!Communiste§!"

FRA_global_unity:0 "Unité mondiale"
FRA_global_unity_desc:0 "L'antifascisme exige une réponse mondiale ! Nous ne pouvons pas rester seuls en ces temps difficiles. Les gouvernements démocratiques et socialistes doivent s'unir !"
FRA_global_unity_tt:0 "Chaque pays §YDémocratique§! et §YCommuniste§! qui ne font pas encore partie d'une faction seront invités à rejoindre la nôtre."
newsfml.115.t:0 "Opération Overlord"
newsfml.115.d:0 "Après des mois de préparation et des années d'occupation, les forces de l'Armée expéditionnaire alliée, sous le commandement du général Dwight D. Eisenhower, ont débarqué en France. Cette opération représente la première tentative majeure des Alliés pour reprendre pied sur le continent, qui avait été perdu au profit des Allemands. Même si la bataille s'annonce difficile, les événements qui se déroulent en France pourraient bien marquer un tournant dans la guerre."
newsfml.115.a:0 "Soldiers, sailors, and airmen of the Allied Expeditionary Force..."
FRA_first_five_year_plan:0 "Le plan quinquennal"
FRA_first_five_year_plan_desc:0 "Une France socialiste exige que nous organisions notre économie sur la base d'une planification économique. À l'instar de nos camarades ailleurs, nous devrions lancer un plan quinquennal afin d'améliorer notre économie."
FRA_second_five_year_plan:0 "Le plan quinquennal"
FRA_second_five_year_plan_desc:0 "Fort du succès de notre premier plan quinquennal, nous pouvons passer au suivant en nous appuyant sur les ressources et l'expérience acquises au cours du premier."
FRA_farm_to_factory:0 "Déplacer les agriculteurs dans les usines"
FRA_farm_to_factory_desc:0 "La France a longtemps été une nation agricole, mais ce n'est plus le cas aujourd'hui. Les agriculteurs rétrogrades seront transformés en prolétaires, par la force si nécessaire."
FRA_instigate_workers_revolts:0 "Provoquer la révolution ouvrière"
FRA_instigate_workers_revolts_desc:0 "Maintenant que nous avons l'expérience nécessaire pour lancer et soutenir des révolutions ouvrières, nous pouvons exporter ce modèle dans le monde entier. Les travailleurs du monde entier seront libres !"
FRA_instigate_workers_revolution_general:0 "Provoquer la révolution ouvrière"
FRA_two_successful_revolutions_tt:0 "Nous avons mené à bien deux révolutions ouvrières couronnées de succès."
FRA_general_confederation_of_labor:0 "Confédération Générale du Travail"
FRA_general_confederation_of_labor_desc:0 "La Confédération générale du travail (CGT) a été créée en 1895 en tant que confédération de syndicats et a toujours entretenu des liens étroits avec le Parti communiste. Même si l'on peut aujourd'hui considérer que les travailleurs sont représentés par l'État, nous ne devons jamais oublier nos racines et utiliser les syndicats comme un outil permettant d'organiser le travail et la société." 
fpmnewrev.5.t:0 "La Question Russe"
fpmnewrev.5.d:0 "Bien que nous nous soyons distanciés du gouvernement soviétique à Moscou, nous ne pouvons nier que leur expérience socialiste est antérieure à la nôtre. Nous devons élaborer une politique sur la manière de les aborder."
fpmnewrev.5.a:0 "Mort aux révisionnistes !"
fpmnewrev.5.b:0 "Camarades, ensemble !"
FRA_the_russian_question:0 "La Question Russe"
FRA_the_russian_question_desc:0 "Bien que nous nous soyons distanciés du gouvernement soviétique à Moscou, nous ne pouvons nier que leur expérience socialiste est antérieure à la nôtre. Nous devons élaborer une politique sur la manière de les aborder."


FRA_tank_s35:0 "Mettre le S35 en production"
FRA_tank_s35_desc:0 "Le dernier chouchou de la cavalerie, le S35, est l'un des chars les plus modernes au monde. Nous devons le mettre en production rapidement pour être prêts en cas de guerre."


fpmdiploevents.29.t:0 "Soutenir le Parti travailliste"
fpmdiploevents.29.d:0 "Les membres du Parti travailliste britannique nous ont contactés pour nous demander de les soutenir, affirmant que cela ferait avancer la cause du socialisme démocratique en Grande-Bretagne. D'un autre côté, la Grande-Bretagne pourrait ne pas apprécier que nous nous impliquions dans sa politique."
fpmdiploevents.29.a:0 "Donnons-leur tout ce dont ils ont besoin."
fpmdiploevents.29.b:0 "Ils peuvent bénéficier d'une petite aide"
fpmdiploevents.29.c:0 "Vous êtes seul"

FRA_private_research_grants:0 "Subventions de recherche privées"
FRA_private_research_grants_desc:0 "Le secteur privé a toujours été à l'avant-garde en matière d'innovation. Nous devrions encourager ces efforts en accordant des subventions de recherche."
autonomy_lon_mandate:0 "Mandat de la Société des Nations"
FRA_centralize_the_european_union:0 "Centraliser l'Union européenne"
FRA_centralize_the_european_union_desc:0 "Nous devrions prendre des mesures pour approfondir l'intégration de l'Union européenne, maintenant que nous avons entamé un processus de fédéralisation."
FRA_wwi_truma:0 "Crise démographique"
FRA_wwi_truma_desc:0 "La France est sortie victorieuse de la Grande Guerre, mais à quel prix ?\n\n  Une génération a été sacrifiée dans les tranchées, et la France souffre aujourd'hui d'une population recrutable bien inférieure à celle de ses voisins. Les pertes humaines considérables de la guerre ont conduit de nombreuses personnes en France à s'opposer à un nouveau conflit à tout prix."
FRA_demographic_crisis_tt:0 "\nRenforcer notre loi sur la conscription au-delà de §YService Court§! entraînera une pénurie de main-d'œuvre dans les usines."

FRA_anglo_french_war_council2:0 "Commandement suprême allié"
FRA_anglo_french_war_council2_desc:0 "Pendant la Première Guerre mondiale, Ferdinand Foch fut nommé commandant suprême des forces alliées afin de diriger les armées combinées de la France, du Royaume-Uni et des États-Unis. Maintenant que nous sommes à nouveau unis dans les armes, nous devrions rétablir un tel commandement !"
FRA_ally_with_italy:0 "S'allier à l'Italie"
FRA_ally_with_italy_desc:0 "Bainville admirait Mussolini de son vivant, louant ses politiques visant à renforcer la puissance nationale et l'ordre public. Nous devrions suivre ses traces et chercher à conclure une alliance avec l'État italien."
fpmdiploevents.28.t:0 "Le Parti travailliste propose un nouveau gouvernement"
fpmdiploevents.28.d:0 "Récemment, nous avons appris une nouvelle inquiétante, la France semble s'immiscer dans notre politique intérieure en soutenant secrètement le Parti travailliste ! Il est clair que son intention est d'installer un gouvernement socialiste à la tête de la Grande-Bretagne, à l'image de celui qui a pris le pouvoir dans son propre pays. Cela a conduit le Parti travailliste à faire pression sur nous pour que nous le laissions diriger le gouvernement. Tant que nous resterons alliés aux Français, ils continueront certainement à soutenir la politique socialiste dans notre pays."
fpmdiploevents.28.b:0 "Ils devraient cesser d'interférer dans notre politique."
FPM_labour_party_long:0 "Parti travailliste"
FPM_labour_party: "Parti travailliste"
FRA_labour_government:0 "Imposer un gouvernement travailliste"
FRA_labour_government_desc:0 "Maintenant que nous faisons partie de la même faction que les Britanniques, nous devrions faire pression sur leur gouvernement pour qu'il adopte une forme de gouvernance plus socialiste. À cette fin, nous demanderons au Parti travailliste de diriger leur gouvernement."
FRA_labour_government_tt:0 "\n[ENG.GetFlag]§Y[ENG.GetName]§! seront plus enclins à accepter plus leur support au§YCommunisme§! est haut."
FRA_international_socialism:0 "Socialisme international"
FRA_international_socialism_desc:0 "Nous sommes devenus la puissance socialiste prédominante au sein de notre alliance. Il est temps désormais de prendre les rênes afin que la France puisse devenir le leader de ce nouvel ordre mondial."
FRA_fund_socialist_parties:0 "Financer les partis socialistes"
FRA_fund_socialist_parties_desc:0 "La cause du socialisme démocratique ne peut se limiter à la France. Nous devons soutenir des mouvements similaires dans le monde entier. Pour les travailleurs du monde entier !"
FRA_invest_in_our_weaker_allies_tt:0 "Pour chaque pays de notre faction qui compte moins d'usines militaires que [FRA.GetFlag]§Y[FRA.GetName]§!, construit §G3§! §YMilitary Factory§! chez eux, et ajoute §G10800§! §YCapacité économique§! pour nous." 
FRA_little_entente_tech_sharing_name:0 "Commission de coordination du réarmement"
FRA_little_entente_tech_sharing_desc:0 "$FRA_coordinate_rearmament_desc$"
FRA_coordinate_rearmament2:0 "Stratégie commune de réarmement"
FRA_coordinate_rearmament2_desc:0 "Si nous voulons que nos alliés mineurs constituent un rempart efficace contre le fascisme, nous devons coordonner notre stratégie de réarmement avec eux, en veillant à ce qu'ils aient le meilleur accès possible aux équipements militaires les plus récents." 
FPM_demsoc_rally:0 "Les socialistes démocrates se sont ralliés"
FPM_demsoc_rally_desc:0 "$FRA_fund_socialist_parties_desc$"
FPM_demsoc_rally_tt:0 "Si nous atteignons 50 % de support §YCommuniste§!, alors que cet esprit national règne, des élections auront lieu. Si les socialistes démocrates l'emportent, notre pays basculera vers le §YCommunisme§!."
fpmdiploevents.31.t:0 "Élections anticipées"
fpmdiploevents.31.d:0 "La montée soudaine du mouvement socialiste démocratique de [ROOT.GetName] a poussé beaucoup de gens à réclamer des élections anticipées, élections que ce nouveau mouvement socialiste a de très bonnes chances de remporter. Néanmoins, il existe toujours une possibilité qu'il perde."
fpmdiploevents.31.a:0 "pour le peuple de [ROOT.GetName]!"
fpmdiploevents.31.b:0 "Un gouvernement non socialiste est préférable." FRA_fund_socialist_parties_tt:0 "Chaque membre de notre faction §YDémocratique§! et §YNon-Aligné§! \n\nGains §Y'$FPM_demsoc_rally$'§! qui donne (Soutien quotidien au communisme; §G+0.07§!, Défense contre la dérive idéologique; §R-10%§!, $FPM_demsoc_rally_tt$) pour §Y730§! jour(s)." 
FRA_protect_czechoslovakia:0 "Protéger la Tchécoslovaquie"
FRA_protect_czechoslovakia_desc:0 "Les Tchèques jouent un rôle essentiel dans la stabilité de l'Europe centrale. Nous devons les protéger contre toute agression fasciste ou impérialiste contre [CZE.GetName] en les invitant à rejoindre une alliance militaire à part entière."
lar_franco_soviet_treaty.4.t:0 "Activation du traité franco-soviétique"
lar_franco_soviet_treaty.4.desc:0 "Aux termes du traité franco-soviétique, [ROOT.GetName] est tenue de se joindre à l'autre puissance dans toute guerre défensive contre les puissances fascistes en Europe. Devrions-nous nous joindre à elle ?"
lar_franco_soviet_treaty.4.a:0 "Mort au fascisme !"
lar_franco_soviet_treaty.4.B:0 "Nous préférons nous abstenir."
FRA_secure_hungary:0 "Sécuriser la Hongrie"
FRA_secure_hungary_desc:0 "L'État réactionnaire hongrois représente une menace dangereuse pour la paix en Europe centrale et orientale. Nous devons le pacifier avant qu'il ne puisse s'allier à d'autres puissances dangereuses."
FRA_socialist_science:0 "Sciences Socialiste"
FRA_socialist_science_desc:0 "La science ne peut être limitée par les frontières ! Nous devons rassembler les esprits les plus brillants de notre monde dans un effort scientifique commun !"
FRA_heavy_industry:0 "Donner la priorité à l'industrie lourde"
FRA_heavy_industry_desc:0 "En ces temps dangereux, nous ne pouvons pas nous permettre de produire des biens de consommation futiles. Nous devons donner la priorité à l'industrie lourde pour la production de guerre, afin d'éviter que la France ne tombe sous le joug du fascisme."
FRA_detatch_the_rhine:0 "Détacher le Rhin"
FRA_detatch_the_rhine_desc:0 "Au cours des 70 dernières années, l'Allemagne nous a envahis à trois reprises. Nous devons mettre un terme à cela et établir en Rhénanie un gouvernement dont nous savons qu'il nous sera favorable."
FRA_eastern_pact:0 "Le Pacte Oriental"
FRA_eastern_pact_desc:0 "Avant d'être assassiné en 1934, Louis Barthou avait plaidé en faveur de la création d'un « pacte oriental » regroupant la Pologne, les États baltes et la Finlande, dans le but de contenir l'Allemagne ! Nous devrions inviter ces États à rejoindre notre alliance." 
FRA_franco_soviet_treaty_tt:0 "Dans le cas d'une guerre défensive en Europe contre une puissance fasciste, [FRA.GetFlag]§Y[FRA.GetName]§! et [SOV.GetFlag]§Y[SOV.GetName]§! s'engagent à se défendre mutuellement et seront appelés à rejoindre la guerre via un événement." 
FRA_join_the_ententes_tt:0 "\n[ENG.GetFlag]§Y[ENG.GetName]§! est peu susceptible de se joindre à moins que les tensions mondiales ne s'intensifient, que la [FRA.GetFlag]§Y[FRA.GetName]§! risque de capituler, et/ou [FRA.GetFlag]§Y[FRA.GetName]§! est engagé dans une guerre défensive contre [GER.GetFlag]§Y[GER.GetName]§!, et [SOV.GetFlag]§Y[SOV.GetName]§!." 
france.340.d2:0 "Après l'interdiction de sa Ligue, la Croix de Feu, François de La Rocque a décidé de réorganiser son mouvement en un parti politique plus modéré et plus formel, le « Parti social français », qui a connu une croissance rapide ces derniers temps, devenant le premier parti de droite organisé de masse en France. \n\nEn raison de cette notoriété accrue, alors que De La Rocque tenait une réunion du PSF à Clichy, bastion de la SFIO, de nombreux militants socialistes et communistes ont organisé une contre-manifestation pour dénoncer la conférence. Un millier de ces contre-manifestants ont tenté de pénétrer dans le cinéma où se tenait la réunion et, bien que l'événement fût sous contrôle policier, la situation a rapidement dégénéré. Des coups de feu ont retenti et la garde mobile est intervenue."
clichy_tt:0 "Parce que nous avons sévi contre les §YViolences politiques§!, cet incident sera passé sous silence. Si nous le souhaitons, nous pouvons élire le §YParti social français§! sous François de La Rocque, lors des prochaines élections."
francepm.25.t:0 "Pétrole roumain sécurisé"
francepm.25.d:0 "Maintenant que nous avons réussi à aligner le gouvernement roumain sur nos objectifs de politique étrangère, nous pouvons entamer le processus de saisie des champs pétrolifères de Ploiești. Cela nous permettra de disposer d'importantes réserves de pétrole pour notre effort de guerre, mais surtout, d'en priver nos ennemis."
francepm.25.a:0 "L'étau se resserre."





france.360.t:0 "Exposition des Croisières Citroën"
france.360.d:0 "Les exploits des Croisières Citroën - de la traversée du Sahara à la Croisière Noire, jusqu'à la récente Croisière Jaune - continuent de fasciner le public. Des expositions itinérantes à travers toute la France mettent en avant les avancées technologiques et scientifiques de ces expéditions. Des milliers de kilomètres parcourus dans la brousse, dans des conditions presque insurmontables, ont été franchis grâce aux autochenilles Citroën : une véritable prouesse technique ! Les cinémas et les salles d'exposition sont pleins à craquer. La publicité Citroën fonctionne, et le prestige de la France à l'international s'en trouve renforcé. André Citroën, malgré avoir fais faillite juste avant sa mort, a bel et bien couvert sa marque de gloire."
france.360.a:0 "Impossible n'est pas Français !"

france.361.t:0 "Le développement de la TPV reprend"
france.361.d:0 "Avant la guerre, Citroën avait commencé le développement de la TPV (Toute Petite Voiture), mais le projet s'est arrêté avec la guerre et tous les prototypes cachés pendant l'occupation. Maintenant que la libération est accomplie, Citroën décide de relancer le projet, même si les matériaux viennent à manquer... Mais le véhicule n'est visiblement toujours pas prêt, et la future voiture du peuple paraît encore loin d'être commercialisée surtout si l'État ne donne aucune impulsion... Cette voiture sera-t-elle un succès ? La question se pose."
france.361.a:0 "Il faut aider au développement"
france.361.b:0 "Nous avons d'autres choses à faire..."

FPMMarshalPlan:0 "Le plan Marshall"
FPMNoMarshalPlan:0 "Reconstruire la France"
FPMMarshalPlanDesc:0 "Le plan Marshall, qui tire son nom du secrétaire d'État américain George Marshall, est un plan audacieux visant à aider à la reprise économique de l'Europe occidentale, maintenant que la guerre est terminée. Nous accepterons toute l'aide possible pour reconstruire la France."
FPMNoMarshalPlanDesc:0 "Maintenant que la guerre est terminée, nous pouvons commencer la reprise économique. Même si la guerre a été dévastatrice et que cela prendra certainement beaucoup de temps, la France s'en sortira."


FRA_FOURTH_REPUBLIC_democratic:0 "République Française"
 FRA_FOURTH_REPUBLIC_democratic_def:0 "la Quatrième République Française"

syria.101.t:0 "Hashim al-Atassi remporte l'élection présidentielle syrienne"
 syria.101.d:0 "Après avoir dirigé une délégation en France pour négocier l'indépendance de la Syrie et l'intégration des régions druzes et alaouites dans la République, Hashim al-Atassi est revenu en Syrie en héros et a été élu président."
 syria.101.a:0 "Super !"
FPM_savior_of_france:0 "Sauveur de la France"
fpmprovgov.1.t:0 "Charles de Gaulle démissionne"
 fpmprovgov.1.d:0 "Après d'importantes tensions avec les principaux partis de la République au sujet du pouvoir exécutif dans le futur gouvernement français, le général de Gaulle a choisi de démissionner, estimant qu'il ne pouvait diriger un tel gouvernement. Il a été remplacé par le politicien socialiste Félix Gouin."
 fpmprovgov.1.a:0 "Et ainsi, le général s'en va..."
FPM_christian_democrat:0 "Démocrate-chrétien"
FPM_resistance_leader:0 "Membre de la résistance" 
FRA_MRP_long:0 "Mouvement Républicain Populaire"
FRA_MRP:0 "MRP" 
FRA_georges_bidault:0 "Georges Bidault"
FRA_fourth_republic_constitution_modifier:0 "Constitution de la Quatrième République"
 FRA_4_rep_start:0 "Quand §Y$FRA_the_fourth_republic$§! est complétée, modifie §Y$FRA_fourth_republic_constitution_modifier$§! par:"
 FRA_sideline_assembly_mod:0 "$FRA_4_rep_start$ \nStabilité: §G+10%§!"
 FRA_presidential_democracy_mod:0 "$FRA_4_rep_start$ \nSoutien à la guerre: §G+10%§ \nLimite de Capitulation: §G+15%§!"
 FRA_reestablish_senate_mod:0 "$FRA_4_rep_start$ \nGain de poids politique: §G+20%§"
 FRA_council_of_republic_mod:0 "$FRA_4_rep_start$ \nGain de poids politique:: §G+10%§ \nCout des conseillers et des lois: §G-25%§!"
 FRA_unicameralism_mod:0 "$FRA_4_rep_start$ \nCout des conseillers et des lois: §G-50%§!"
 FRA_second_third_mod:0 "$FRA_4_rep_start$ \nSoutien quotidien à la démocratie: §G+0.15§!"
 FRA_rep_of_assembly_mod:0 "$FRA_4_rep_start$ \nGain de poids politique: §G+0.10§!"
FRA_fourth_republic_constitution_modifier_desc:0 "Notre nouvelle république doit avoir une nouvelle constitution. Tout comme le monde qui nous entoure évolue, la France doit elle aussi entrer dans une nouvelle ère."
4_republic_tt:0 "Obtiens §Y$FRA_fourth_republic_constitution_modifier$§!, avec des modificateurs déterminés par des priorités antérieures."
FRA_paul_ramadier:0 "Paul Ramadier"
 FRA_robert_schuman:0 "Robert Schuman"
 FRA_andre_marie:0 "André Marie"
 FRA_henri_queuille:0 "Henri Queuille" 
fpmdiploevents.22.t:0 "La France propose au Schleswig-Holstein"
 fpmdiploevents.22.d:0 "Après leur récente conquête de l'Allemagne, la France nous a proposé de prendre le contrôle du Schleswig-Holstein à leur place. Ils nous ont assuré que le transfert se ferait dans le calme et qu'il ne devrait y avoir que peu de résistance."
 fpmdiploevents.22.a:0 "On le prend."
 fpmdiploevents.22.b:0 "Non merci."
 fpmdiploevents.23.t:0 "Le Danemark annexe le Schleswig-Holstein"
 fpmdiploevents.23.d:0 "Conformément à notre plan de partition de l'Allemagne, le Danemark a pris possession du Schleswig-Holstein. Les garnisons françaises sont déjà en train de quitter les lieux, et le transfert se déroule sans heurts."
 fpmdiploevents.23.a:0 "Bien"
 fpmdiploevents.24.t:0 "Le Danemark rejette le Schleswig-Holstein"
 fpmdiploevents.24.d:0 "Le gouvernement danois a rejeté l'annexion du Schleswig-Holstein. Nous devrions plutôt chercher à y former un État fantoche."
 fpmdiploevents.24.a:0 "Bon, tant pis."
fpmdiploevents.25.t:0 "La France réclame le Kurdistan !"
 fpmdiploevents.25.d:0 "Invoquant leur revendication dans le traité de Sèvres, aujourd'hui caduc, et leur volonté de « faire respecter les traités de la Première Guerre mondiale », la France nous a demandé de lui céder le Kurdistan, sous peine de guerre si nous ne nous plions pas à sa demande ! Que devons-nous faire ?"
 fpmdiploevents.25.a:0 "Le Kurdistan cause plus de problèmes qu'il n'en vaut la peine."
 fpmdiploevents.25.b:0 "Nous ne céderons pas un pouce de territoire !"
 fpmdiploevents.26.t:0 "[FROM.GetName] Cèdes le Kurdistan"
 fpmdiploevents.26.d:0 "Le gouvernement [FROM.GetName] a judicieusement décidé de se conformer à notre demande et nous a transféré l'administration de la région du Kurdistan. Des garnisons françaises occupent déjà la région, conformément à nos objectifs initiaux à Sèvres."
 fpmdiploevents.26.a:0 "Magnifique"
 fpmdiploevents.27.t:0 "[FROM.GetName] refuse de céder le Kurdistan"
 fpmdiploevents.27.d:0 "Comme des imbéciles, le gouvernement de [FROM.GetName] ont refusé de nous céder le Kurdistan, affirmant que toute violation de leur souveraineté territoriale équivaudrait à une déclaration de guerre. La crise étant dans l'impasse, il semble qu'une guerre se profile à l'horizon."
 fpmdiploevents.27.a:0 "C'est la guerre alors"
FRA_economic_intervention:0 "Programmes d'intervention économique"
 FRA_imperial_research:0 "Financement de la recherche impériale"
 FRA_levee_en_masse:0 "Instaurer la conscription générale"
 FRA_strengthen_imperial_authority:0 "Renforcer l'autorité impériale"
 FRA_legitimize_war:0 "Légitimer nos guerres" 












FRA_worker_shortage_desc:0 "$FRA_wwi_truma_desc$"

FRA_natural_allies:0 "Alliés naturels"
FRA_natural_allies_desc:0 "Malgré tous les coups dans le dos que nos alliés Anglos-Saxons nous ont faits depuis la fin de la grande guerre (annuler les réparations allemandes, partir de notre accord de défense, désarmer notre pays, etc...), ce sont nos alliés naturels et la France doit se tenir à leurs côtés."
FRA_kill_belgium:0 "S'emparer de la Belgique"
FRA_kill_belgium_desc:0 "La Belgique est une entité créée de toute pièce, elle met la sécurité de notre pays en péril car le pays constitue la voie d'invasion la plus facile vers la France. Nous devons nous occuper de lui."
FRA_russian_mission:0 "Alliance Franco-Russe"
FRA_russian_mission_desc:0 "Pendant la Grande guerre, l'alliance franco-russe a été des plus utiles. Malgré nos différences politiques depuis la révolution de 1917, les peuples russes et français sont amis et une alliance entre nos deux pays aurait tout à fait sa place d'un point de vue stratégique."


FRA_economic_devastation:0 "Dévastation économique"
FRA_economic_devastation_desc:0 "La guerre a ruiné l'économie locale."
FPM_rebuilding_france:0 "Reconstruire la France"
FPM_rebuilding_france_desc:0 "La guerre a dévasté la France. Une longue occupation a mis l'économie à rude épreuve. Nous devons reconstruire."
FRA_rebuild_state:0 "Aide économique pour [FROM.GetName]"
FPM_social_security:0 "Le cout les décisions sont réduites de moitié pour §Y$FPM_rebuilding_france$§!." 


FML_escaut_or_dyle:0 "Choisir entre:"
FRA_french_influence:0 "Influence Française"
 FRA_french_influence_desc:0 "Bien que la France nous ait accordé l'indépendance, elle continue d'exercer une influence considérable sur notre économie."
francepm.36.t:0 "Reynaud démissionne à cause de la crise des Sudètes"
 francepm.36.d:0 "Même si Reynaud semblait venir d'être nommé Premier ministre, son incapacité à défendre la Tchécoslovaquie lors de la crise des Sudètes l'a conduit à démissionner. Farouche opposant à la politique d'apaisement, il a démissionné lorsque le Parlement a refusé de se rallier à sa position en faveur de la défense de la Tchécoslovaquie. La droite étant au pouvoir depuis la crise du 6 février 1934, nombreux sont ceux qui espèrent voir la France dirigée par un gouvernement plus modéré."

lar_low_stability_civil_war.3.t:0 "Guerre civile imminente"
lar_low_stability_civil_war.3.desc:0 "Les tensions politiques en France ont atteint un point critique. Des milices paramilitaires se forment déjà et il semble que d'un jour à l'autre, le pays pourrait sombrer dans des combats similaires à ceux qui ont eu lieu en Espagne, au sud de notre pays. Des mesures drastiques doivent être prises dès maintenant pour éviter que le pire ne s'abatte sur la France."
lar_low_stability_civil_war.3.a:0 "C'est terrible"
FPM_trans_indochinois:0 "Compléter le Transindochinois"
FPM_trans_indochinois_desc:0 "Nous devrions achever la construction du chemin de fer Transindochinois, qui reliera le Nord et le Sud du Vietnam."



fpm_play_britain:0 "§RVous jouerez le rôle de la Grande-Bretagne si celle-ci accepte.§!"
FPM_fall_of_paris:0 "§RSi Paris tombe aux mains des Allemands, certains membres du gouvernement feront pression pour obtenir un armistice.§!"
newsfml.121.t:0 "L'Afrique aux Alliés"
newsfml.121.d:0 "En réponse à l'opération Torch déclenchée par les Alliés, et ayant pour but l'occupation de l'Afrique du Nord, les troupes françaises qui avaient pour ordre donné par Vichy de défendre l'empire contre l'envahisseur, n'ont globalement pas voulu se battre contre leurs anciens alliés. L'Amiral Darlan a même été envoyé et vient de signer un cessez-le-feu dans la zone de l'Afrique du Nord. En réaction, les Allemands viennent d'envahir Vichy, et la zone libre est maintenant occupée. Les soldats français en Afrique, voyant que Vichy n'existe plus, rejoignent maintenant la France libre en nombre pour continuer le combat comme ils le pourront."
newsfml.121.a:0 "Un changement d'alliance notable"
fra.5.t:0 "Les troupes Vichystes se joignent à nous"
fra.5.d:0 "Voyant que Vichy a été envahie par les Allemands, les troupes Vichystes stationnées en Afrique du Nord décident en masse de nous rejoindre pour continuer le combat contre les Allemands. Mais les accepter pourraient créer des tensions entre certains de nos soldats qui les considèrent comme des traîtres..."
fra.5.a:0 "Bonne nouvelle !"
fra.5.b:0 "Non aux traitres"
FRA_organise_army:0 "Organiser notre armée"
FRA_organise_army_desc:0 "Notre nouvelle armée doit etre organisée de sorte à ce qu'elle soit parfaitement effective."

FRA_gendarmerie:0 "Corps Francs"
FRA_gendarmerie_desc:0 "Durant la Grande Guerre, l'élite de la troupe pouvait se trouver dans un Corps Franc, opérant profondément dans les lignes ennemies pour récupérer du renseignement, des prisonniers et effectuer des coups de main. Cela pourrait s'avérer de nouveau très utile !"
FRA_corp_francs:0 "Corps Francs"
FRA_return_pow:0 "Retour des Prisonniers"
FRA_return_pow_desc:0 "Les nombreux prisonniers de la Bataille de France peuvent maintenant rentrer chez eux!"
FRA_propaganda_minister:0 "Ministère de la Propagande"
FRA_propaganda_minister_desc:0 "Il est temps de mettre en place un ministère de la propagande pour contrer l'influence de nos ennemis."
FRA_maginot_politic:0 "Rassurer les politiciens"
FRA_maginot_politic_desc:0 "Le seul endroit où les politiciens sont prêts à allouer des fonds à l'armée qui subit des coupes budgétaires chaque année est au sein de la ligne Maginot. En effet, fabriquer trop de chars paraît pour eux être une action offensive alors que la ligne Maginot a une fonction exclusivement défensive..."
FRA_heavy_armor_focus_desc:0 "Après une défense bien organisée, la contre-attaque de l'ennemi se fera à l'aide de chars lourds pour percer les lignes adverses !"
VIC_old_generals:0 "Mettre les vieux généraux à la retraite"
VIC_old_generals_desc:0 "Même si la bataille de France a été en grande partie perdue par les politiques, les militaires ont eu aussi leur rôle à jouer. Commençons, comme les Allemands l'ont fait avant la guerre, à écarter les vieux généraux des affaires. Cela permettra de donner des idées nouvelles à notre armée."
VIC_cult_of_france:0 "Culte de la France"
VIC_cult_of_france_desc:0 "La France a vécu des époques difficiles, a failli mourir de nombreuses fois, mais est toujours ressortie plus forte. Cette fois-ci ce ne sera pas différent."
VIC_cult:0 "Culte de la France"
VIC_armee_nouvelle:0 "Armée Nouvelle"
VIC_armee_nouvelle_desc:0 "Notre armée, limitée en nombre, sera compensée par une élite jeune et entraînée ainsi qu'un équipement moderne." 
VIC_allies:0 "Rejoindre les alliés"
VIC_allies_desc:0 "Nous avons besoin des alliés pour pouvoir vaincre l'Allemagne, reprendre le combat à leur côté devrait avoir un bon impact sur le moral de la population."
VIC_front_beurre:0 "Front du Beurre"
VIC_front_beurre_desc:0 "Pour échapper aux pénuries créées par les Allemands, de nombreux citoyens ont recours au marché noir. Cela a souvent pour effet d'enrichir encore plus la bourgeoisie, mais d'un autre côté cela redonne vie à l'économie nationale"
VIC_pillar_of_france:0 "Aides aux grandes familles"
VIC_pillar_of_france_desc:0 "La France souffre de problèmes de natalité depuis le 19e siècle, aider les grandes familles devrait aider à résoudre ce problème !"
VIC_bad1:0 "Restrictions de l'armée"
VIC_bad2:0 "Restrictions de l'armée"
VIC_army1:0 "Armée d'armistice"
VIC_army2:0 "Armée nouvelle"
VIC_army3:0 "Armée nouvelle"
VIC_work:0 "Travail"
VIC_work_desc:0 "Le travail est une partie importante de la vie d'un homme. Fini avec le travail acharné dans les usines, les racines de la France ont toujours été le noble travail du paysan, cultivant la riche terre du pays."
VIC_fatherland_desc:0 "Le patriotisme a depuis longtemps été délaissé en France, il est temps de redonner envie aux gens d'aimer notre glorieux pays !"
VIC_fatherland:0 "Patrie".
VIC_family:0 "Famille"
VIC_family_desc:0 "La famille est la base de la construction sociale de n'importe quel individu, de plus notre pays, avec sa natalité faible, doit tout faire pour promouvoir une famille forte et unie pour continuer d'exister."
VIC_tradition:0 "Tradition Catholique"
VIC_tradition_desc:0 "La République a toujours nié et essayé de détruire la tradition Catholique de notre pays, autrefois appelée la fille aînée de l'église. Cela doit cesser !"
VIC_army_of_africa:0 "Armée D'Afrique"
VIC_army_of_africa_desc:0 "Nous avons envoyé le grand général Weygand en Afrique du Nord pour créer une force bien entraînée capable de reprendre un jour. Cela implique bien sûr de tricher un peu sur les quotas allemands !"
VIC_no_factions:0 "Politique étrangère neutre"
VIC_prosecute_the_losers:0 "Procès de Riom"



FRA_war_industry:0 "Renvoyer les spécialistes en armement"
FRA_war_industry_desc:0 "Avec la quasi-totalité de la population masculine mobilisée au front, notre base industrielle commence à souffrir d'une grave pénurie de personnel, et la production devient très difficile. Selon notre ministre de l'Armement, Raoul Dautry il faut envoyer des femmes dans les usines et rappeler les spécialistes de l'armement qui avaient été mobilisés pour pouvoir enfin concurrencer nos voisins... "

FRA_regain_colonies_shortcut:0 "Appel aux colonies"
FRA_the_resitance_shortcut:0 "La résistance"
FRA_rebuild_army_shortcut:0 "Reconstituer une armée"
FRA_prov_gov_shortcut:0 "Gouvernement Provisoire"

FRA_national_bloc_shortcut:0 "Politique: non-Historique"
FRA_historical_path_shortcut:0 "Politique: Historique"
FRA_economic_path_shortcut:0 "Économie"
FRA_naval_doctrine_shortcut:0 "La Marine"
FRA_air_doctrine_shortcut:0 "L'Armée de l'Air"
FRA_military_doctrine_shortcut:0 "L'armée de Terre"

FRA_lets_go_alger:0 "Départ pour Alger"
FRA_the_fight_continue:0 "Le Combat Continue"
FRA_colonial_factories:0 "Usines Coloniales"
FRA_colonial_dockyard:0 "Maintenir la Marine à Flots"

FRA_the_fight_continue_desc:0 "Alors que tout semble perdu du côté militaire, notre pays a montré sa résilience et s'est uni contre l'envahisseur, les Français ont laissé leurs différences de côté et sont prêts à se battre jusqu'au bout !"
FRA_colonial_factories_desc:0 "De nombreuses usines ont été perdues en métropoles à cause des récentes défaites, heureusement notre large empire est presque inatteignable pour l'ennemi, nous devons construire nos nouvelles usines là-bas"
FRA_colonial_dockyard_desc:0 "La Marine permet la liaison avec l'empire, nous devons à tout prix la maintenir à flots malgré les dures épreuves qu'elle a subies !"
FRA_lets_go_alger_desc:0 "Il faut continuer le Combat depuis l'Afrique, mettons d'abord l'administration en place !"


FRA_relative_peace:0 "Défiance envers le Gouvernement"
FRA_relative_peace_desc:0 "Le début des années 30 a bouleversé le pays encore paisible qu'était la France. L'insouciance après la grande guerre a succédé à un réveil brutal avec la crise économique qui a touché le pays. De nombreux scandales politiques, manifestations et instabilité gouvernementale gangrènent le pays depuis. Le peuple souffrant du chômage et de ces crises successives ne croit plus en la République et cela se traduit par une montée des extrêmes."
FRA_foreign_guest_workers_desc:0 "Inviter des travailleurs étrangers pourrait avoir le bénéfice de pouvoir libérer de la main-d'œuvre pour l'envoyer sur le front et régler notre problème démographique."
FRA_encourage_immigration_desc:0 "Encourager l'immigration pourrait être la solution pour régler notre problème croissant de population depuis la grande guerre..."
FRA_wwi_truma:0 "Crise Démographique"
FRA_wwi_truma_desc:0 "La France est sortie vainqueur de la Grande Guerre, fournissant un effort considérable, mais tout cela a quel prix ?\n Une génération a été sacrifiée dans les tranchées, et le pays souffre maintenant d'une population bien inférieure à celle de ses voisins. Cela laisse à la France la tâche difficile de reconstruire une armée puissante avec une population bien moins grande qu'en 1914, car ces dernières années, les tensions en Europe laissent présager le pire..."

FRA_reynaud_tooltip:0 "§OPaul Reynaud doit être le dirigeant du pays ou être un conseiller pour accéder aux nouvelles lois permettant d'abroger la législation socialiste.§!"

france.342.t:0 "Grèves générale des service publiques à Paris"
france.342.d:0 "A Paris, des grèves ont eu lieu, touchant principalement les transports en commun. Les Grévistes demandant une augmentation de leur indemnité ainsi que de leur salaire. Après de vives échanges entre la CGT et le gouvernement, un compromis mitigé a finalement été trouvé à Matignon. De nombreux ouvriers sont déçus de cette absence de soutien du gouvernement. Il faut croire que les victoires sociales n'ont pas été aussi éclatantes que promises..."
france.342.a:0 "Le Front Populaire s'effrite..."

FRA_armistice1_tooltip:0 "§RPour jouer la France Libre§!"
FRA_armistice2_tooltip:0 "§RPour jouer Vichy§!"


BEL_bad_forts:0 "Fortifications anciennes"
BEL_bad_forts_desc:0 "Les fortifications belges, bien que parmi les plus impressionnantes de la planète, ne sont pas très modernes pour une nouvelle guerre. De plus, elles maintiennent l'armée dans un dangereux état d'immobilité..."
FRA_auphan:0 "Gabriel Auphan"

