newsfml.116.title:0 "Le pacte Hoare-Laval"
newsfml.116.desc:0 "Après plusieurs semaines de négociations entre la France, l’Italie et l’Éthiopie, un accord de paix a été conclu pour mettre fin à la Seconde guerre italo-éthiopienne, basé sur les principes du pacte Hoare-Laval, qui avait fuité en décembre 1935, rédigé par le secrétaire britannique aux Affaires étrangères Samuel Hoare et le président du Conseil français Pierre Laval. Bien que peu populaire dans leur pays respectif, ayant conduit à la démission de Hoare en décembre dernier, le gouvernement français a mené la proposition de paix à son terme et, avec le consentement de [ITA.GetLeader] et [ETH.GetLeader], la guerre a pris fin par médiation, l’Éthiopie cédant de vastes parties de son territoire à l’Italie, ainsi que d’importantes concessions économiques aux Italiens, en échange de la garantie de son indépendance par la France."
newsfml.116.a:0 "Nous avons obtenu la paix !" 
newsfml.116.b:0 "Aurions-nous pu obtenir davantage ?" 
newsfml.116.c:0 "L’Occident nous a trahis..."
newsfml.116.d:0 "Au moins, ils sont encore en vie ?" 
