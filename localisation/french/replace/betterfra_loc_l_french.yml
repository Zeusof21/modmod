FRA_continue_colonial_policies:0 "Poursuivre les politiques coloniales"
FRA_continue_colonial_policies_desc:0 "Nous poursuivrons le système de l'empire français avec la France à sa tête, accomplissant la mission civilisatrice sans aucune illusion d'égalité."
FRA_continue_colonial_policies_tt:0 "Débloque la loi d'occupation Police coloniale dans les États africains et asiatiques."
