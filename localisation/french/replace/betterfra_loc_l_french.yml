FRA_frankish_empire_category:0 "L'héritage de Charlemagne"
FRA_frankish_empire_category_desc:0 "Charlemagne a autrefois régné sur une grande partie de l'Europe ; il fut le premier en Occident à porter le titre d'empereur des Romains après la chute de Rome d'Occident. Nous rendrons hommage à son héritage en rétablissant ce qu'il a autrefois créé."
FRA_frankish_empire_formable_tt:0 "Tous les États situés dans la zone surlignée sont entièrement détenus et contrôlés par la [FRA.GetName]."
FRA_frankish_empire_cores_tt:0 "Nous gagnerons des états nationaux dans tous les États mis en évidence."

FRA_move_capital_to_aachen:0 "Transférer la capitale à Aix-la-Chapelle"
FRA_move_capital_to_aachen_desc:0 "Aix-la-Chapelle était la capitale de l'empire de Charlemagne. Nous y réinstallerons notre capitale, comme il se doit."
FRA_frankish_empire_formed:0 "Nous avons fondé l'Empire franc."
fpmleagues.16.t:0 "Rénovation d'Aix-la-Chapelle"
fpmleagues.16.d:0 "La restauration de l'Empire franc s'est accompagnée d'une rénovation tout aussi importante de l'ancienne capitale impériale, Aix-la-Chapelle. Après d'importants travaux, l'heure est venue de transférer officiellement la capitale à Aix-la-Chapelle."
fpmleagues.16.a:0 "Génial !"
fpmleagues.17.t:0 "[FRA.GetNameDef] intègre notre État"
fpmleagues.17.d:0 "Le gouvernement [FRA.GetAdjective] a décidé que, dans le cadre de son objectif visant à restaurer la gloire de [FRA.GetAdjective] et à intégrer notre État, nous ne pouvons pas faire grand-chose."
fpmleagues.17.a:0 "Malheureux"
fpmleagues.18.t:0 "[FROM.GetName] Accepte l'intégration"
fpmleagues.18.d:0 "Le gouvernement [FROM.GetAdjective] s'est intégré au nôtre, et nous administrons désormais leur territoire, cette intégration se déroulant sans heurts."
fpmleagues.18.a:0 "Bien"
FRA_form_hre:0 "$form_hre$"
FPM_emperor_of_the_romans:0 "Empereur des Romains"
FRA_crown_leader_emperor:0 "Couronne [FRA.GetLeader] Empereur des Romains"
FPM_new_sun_king:0 "Le nouveau Roi Soleil"
FRA_latin_empire_tt:0 "Gagne des états nationaux sur tout les états §YEspagnoles§!, §YItaliens§!, et §YPortugais§!"

FRA_SNCASO_corneuve_organization:0 "SNCASO Courneuve"
FRA_helicopter_development:0 "SNCASO Corneuve"
FRA_helicopter_development_desc:0 "Les équipes de développement de la SNCASO à Corneuve se sont récemment lancées dans la conception d'hélicoptères. Nous devrions investir davantage dans ces projets."
FRA_helicopter_development_tt:0 "§YSNCASO Courneuve§! gagnera des niveaux équivalents au niveau actuel de la §YSNCASO§!" 

FRA_air_reformer:0 "Réformateur aérien"
fpmdiploevents.53.t:0 "L'héritage français"
fpmdiploevents.53.d:0 "Avec le retour des Bourbons au pouvoir en France, la question d'une union franco-espagnole est revenue sur le devant de la scène publique. La France, gouvernée par le Bourbon [FRA.GetLeader] prétend également au trône d'Espagne. Le fait de le reconnaître comme roi nous offrirait l'occasion d'unifier nos pays pour former une entité plus grande, même si la France serait sans aucun doute le partenaire principal dans cette relation. De plus, sa prétention au trône descend de la lignée isabélienne plutôt que de la lignée carliste, ce qui a suscité une forte opposition de la part des carlistes les plus intransigeants."
fpmdiploevents.53.a:0 "¡Viva el rey!"
fpmdiploevents.53.b:0 "Nous n'accepterons jamais un monarque isabellin !"
fpmdiploevents.54.t:0 "L'héritage espagnol"
fpmdiploevents.54.d:0 "Les carlistes espagnols ont sagement décidé de renoncer à s'opposer à l'unification de nos deux États bourbons, et nos deux pays sont désormais gouvernés dans le cadre d'une union personnelle."
fpmdiploevents.54.a:0 "Nous rejetons le traité d'Utrecht !"
fpmdiploevents.55.t:0 "Le refus espagnol"
fpmdiploevents.55.d:0 "Les carlistes espagnols ont pris la décision insensée de s'opposer à l'unification des deux pays, rejetant catégoriquement notre prétention au trône au motif qu'il descend de la lignée isabélienne et non de la lignée carliste."
fpmdiploevents.55.a:0 "Nous n'hésiterons pas à recourir à la force s'il le faut !"

FRA_french_flanders:0 "Réunifier la Flandre française"
FRA_french_flanders_desc:0 "Le comté de Flandre faisait partie des territoires d'origine de la France avant que les Habsbourg ne nous le ravissent injustement. Il est temps d'y rétablir notre autorité."

FRA_disunite_italy_tt:0 "Nous allons soit annexer, soit réduire en vassalité l'§YItalie du Sud§! en fonction de nos priorités précédentes, tandis que le §YNord§! et l'§YItalie Centrale§! seront divisés en plusieurs États subjectes."

FRA_legacy_of_the_rif_war:0 "L'héritage de la guerre du Rif"
FRA_legacy_of_the_rif_war_desc:0 "La guerre du Rif a vu la France s'allier à l'Espagne pour réprimer les rebelles rifains dans le nord du Maroc, ce qui a mis en évidence les liens entre nos deux pays et contribué à préparer notre armée à de futurs conflits. Nous devons rendre hommage à ceux qui ont combattu pendant cette guerre et les saluer, tout en renforçant notre emprise sur le Maroc afin qu'une telle rébellion ne se reproduise plus jamais."
FRA_return_to_versailles:0 "Retour à Versailles"
FRA_return_to_versailles_desc:0 "Autrefois, la Cour de France siégeait à Versailles, hors de portée des agitateurs de Paris. Avec le retour des véritables rois de France sur le trône, il est tout à fait naturel que nous réintégrions notre palais là-bas."
FRA_invite_carlist_theorists:0 "Inviter les théoriciens de Carlist"
FRA_invite_carlist_theorists_desc:0 "Le mouvement carliste ultratraditionnaliste espagnol présente de nombreux points communs avec notre mouvement légitimiste ; en effet, avec le décès de leur dernier prétendant au trône, on peut considérer que leur lignée s'est unie à la nôtre. Nous devrions inviter leurs penseurs à venir se joindre à nous. Nous avons beaucoup à apprendre d'eux."
FPM_el_africano:0 "El Africano"
FRA_reestablish_new_france:0 "Rétablir la vice-royauté de la Nouvelle-France"
FRA_new_france_trigger_tt:0 "Tous les États situés dans la zone surlignée sont entièrement contrôlés par [FRA.GetName] ou un sujet."
FRA_new_france_effect_que_tt:0 "§Y[QUE.GetName]§! deviendra propriétaire de l'ensemble du territoire mis en évidence et en contrôlera les ressources, et sera désormais connu sous le nom de §YNouvelle-France.§!"
FRA_new_france_effect_no_que_tt:0 "Nous céderons le territoire mis en évidence à §YNouvelle-France§! sur le territoire mis en évidence, et ils en deviendront ainsi les propriétaires à part entière et en détiendront les états nationaux."
FRA_adopt_corporatism:0 "Adopter le corporatisme"
FRA_adopt_corporatism_desc:0 "La société moderne doit reposer sur la collaboration entre les classes dans l'intérêt national. À cette fin, nous mettrons en place plusieurs organismes chargés d'assurer la médiation entre le monde du travail et le monde des affaires, et nous créerons une instance nationale centrale permettant à ces groupes d'organiser leurs intérêts."
FRA_corporatist_governance:0 "Gouvernance corporatiste"
FRA_return_to_india:0 "Retour en Inde"
FRA_return_to_india_desc:0 "La France exerçait autrefois une grande emprise sur l'Inde, contrôlant de vastes étendues de territoire et exerçant une influence considérable sur le reste du sous-continent, avant que les Britanniques ne nous les arrachent. Il est temps que nous y retournions."
FRA_return_to_india_tt:0 "Réduit les coûts pour faire un état Fantoche de [RAJ.GetFlag]§Y[RAJ.GetName]§! par §G50%§!."

FRA_cooperate_with_maurras:0 "Collaborer avec Maurras"
FRA_cooperate_with_maurras_desc:0 "Charles Maurras et son mouvement, l'Action française, bien qu'initialement orléanistes, ont fini par apporter leur soutien à notre mouvement, dans la mesure où celui-ci défend également les intérêts catholiques et français. Nous devrions les intégrer pleinement à notre mouvement et offrir à Maurras un siège au sein de notre gouvernement."
FRA_unite_the_catholic_bloc:0 "Unir le bloc catholique"
FRA_unite_the_catholic_bloc_desc:0 "En ces temps troublés, nous devons rassembler les nations catholiques sensées d'Europe au sein d'un bloc d'alliance afin de nous défendre contre la radicalisation croissante de la politique."
FRA_catholic_faction:0 "Bloc catholique"
FRA_reconnect_to_latin_america:0 "Renouer avec l'Amérique latine"
FRA_reconnect_to_latin_america_desc:0 "La civilisation latine et catholique ne se limite pas à l'Europe, mais englobe également les pays d'Amérique latine. Anciennes colonies espagnoles, notre nouvelle union devrait chercher à renouer des liens avec ces États et à les intégrer dans notre alliance officielle."
FPM_national_integralist:0 "$national_integralist$"
FPM_national_integralist_2:0 "$national_integralist$"

FRA_proclaim_the_latin_empire:0 "Proclamez l'Empire latin"
FRA_proclaim_the_latin_empire_desc:0 "La véritable civilisation européenne se définit avant tout par son caractère latin et catholique. Tout comme nous étions autrefois unis sous l'égide de Rome, il est temps de réunir à nouveau nos peuples."
FRA_the_new_sun_king:0 "Le nouveau Roi Soleil"
FRA_the_new_sun_king_desc:0 "Louis XIV, surnommé le « Roi Soleil », a hissé la France au rang de puissance dominante en Europe. Nous irons encore plus loin, afin qu’aucun autre État ne puisse plus jamais nous défier."
FRA_restore_the_frankish_empire:0 "Restaurer l'Empire franc"
FRA_restore_the_frankish_empire_desc:0 "L'Empire franc incarnait la France à son apogée. Il était à la tête d'un empire universel auquel tous les autres étaient subordonnés. Nous ferions bien de le rétablir."




france.309.t:0 "Déclaration d'Indépendance du Vietnam"
france.309.d:0 "La paix avec le Japon est enfin arrivée, et l’Indochine a été profondément secouée par la guerre. L’administration de Vichy avait réussi à maintenir l’ordre, malgré le coup de force japonais, et était parvenue à rester en place. Tout cela prit fin lors de l’invasion totale des Nippons. Les troupes françaises, bien que massacrées, livrèrent un combat acharné sous forme de guérilla contre les forces impériales. Finalement, la défaite du Japon a laissé l’Indochine sans véritable administration. Aujourd’hui, profitant de ce vide de pouvoir, un certain Hô Chi Minh proclame l’indépendance du Vietnam. Certaines régions restent encore, plus ou moins, sous notre contrôle, et des négociations pourraient sans doute ramener cette colonie à la raison si nous acceptons de lui accorder une autonomie accrue…"
france.309.a:0 "Un projet mort-né..."
france.310.t:0 "Bombardement du port de Haïphong"
france.310.d:0 "Ces Asiatiques n’ont rien voulu entendre. Nos efforts pour reconnaître leur nouvel État n’ont abouti qu’à un accord précaire nous permettant de récupérer quelques villes et bases stratégiques sous notre contrôle, tandis que l’Indochine demeure profondément sceptique quant aux projets d’Union française. Il faut dire que la proclamation unilatérale de la République de Cochinchine par l’amiral d’Argenlieu n’a fait qu’envenimer la situation, et les incidents entre nos forces et les nationalistes vietnamiens n’ont cessé de se multiplier. Cette bombe à retardement qu’est l’Indochine vient finalement d’exploser ce matin, lorsque nos bâtiments de guerre ont bombardé le port de Haïphong en réponse à de nouvelles provocations. La guerre d’Indochine commence…"
france.311.t:0 "Guerre en Indochine"
france.311.d:0 "En Extrême-Orient, dans notre colonie d’Indochine, les communistes se soulèvent actuellement contre le pouvoir colonial à la suite de représailles menées par nos troupes. Une situation qui s’était envenimée au cours des dernières années vient désormais d’exploser. Une question se pose alors : devrions-nous nous engager dans une nouvelle guerre ? La France est épuisée, et l’Occupation a causé d’énormes souffrances humaines et matérielles. Notre armée est en ruine, et l’Indochine se situe à près de 10 000 kilomètres de la métropole. Une guerre menée si loin pour une simple colonie risque d’être profondément impopulaire, mais refuser d’intervenir serait une humiliation majeure pour la nation…"
france.310.a:0 "L'empire s'effrite..."
france.311.a:0 "Pour l'honneur et les copains !"
france.311.b:0 "Mieux abandonner l'Indochine..."
FRA_icn_war:0 "Guerre d'Indochine"

VIC_africa_army:0 "Armée D'Afrique"
VIC_africa_army2:0 "Armée D'Afrique"
VIC_africa_army_desc:0 "L'armée d'Afrique, formée dans le dos des Allemands par Weygand, est une force redoutable et bien formée, dans le culte de la revanche contre l'envahisseur. Seulement les gaullistes purs au sein de notre armée acceptent mal cette force d'origine fidèle à Vichy et qui s'est ralliée tardivement à notre cause..."
VIC_africa_army2_desc:0 "L'armée d'Afrique, formée dans le dos des Allemands par Weygand, est une force redoutable et bien formée, dans le culte de la revanche contre l'envahisseur. Nous avons réussi a l'integrer bien que mal au sein de notre armée, et les tensions ont fini par s'appaiser, le but commun étant d'en finir avec les boches !"
FRA_merge_our_forces:0 "Unir nos armées"
FRA_merge_our_forces_desc:0 "L'armée d'Afrique, formée dans le dos des Allemands par Weygand, est une force redoutable et bien formée, dans le culte de la revanche contre l'envahisseur. Seulement les gaullistes purs au sein de notre armée acceptent mal cette force d'origine fidèle à Vichy et qui s'est ralliée tardivement à notre cause... Il est temps de mettre un terme à tout cela pour la cause commune !"

FRA_pierre_cot:0 "Pierre Cot"


france.320.t:0 "Mort de Lev Sedov"
france.320.d:0 "Lev Sedov, fils de Trotsky et connu pour son profond engagement dans la cause de son père, est mort aujourd’hui à Paris des suites d’une opération chirurgicale. Son dernier ouvrage, paru en 1937, dans lequel il critique le procès des Seize, avait déjà mis sa vie en danger et il avait échappé la même année à une tentative d’assassinat. Sa mort reste pourtant une énigme, la clinique l’ayant opéré étant tenue par des Russes blancs, son secrétaire, agent du NKVD, l’ayant orienté vers cette clinique, et le médecin l’ayant anesthésié étant aussi informateur du NKVD. Les trotskystes crient à l’assassinat, et même si cette affaire fait peser de lourds soupçons, nous n’avons pas encore la certitude sur les véritables circonstances de ces événements."
france.320.a:0 "Louche...."
france.321.t:0 "Libération de Weygand"
france.321.d:0 "L’ancien généralissime des armées françaises, jouissant d’un immense prestige de par sa ténacité lors de la bataille de France et son double jeu vis-à-vis des Allemands afin de reconstruire l’armée d’Afrique, servant à la libération du territoire national, a aujourd’hui été libéré par les troupes américaines, suite à son internement provoqué par des actions jugées suspectes par les autorités allemandes. Le général a reçu tous les honneurs de la VIIe Armée américaine, puis a été remis à la 1re Armée française ; il est accueilli avec les honneurs militaires, et le général de Lattre met même sa voiture personnelle à sa disposition. Pourtant, une lettre du gouvernement indique qu’il faut l’interner avec d’autres personnalités liées au régime de Vichy, ce qui a profondément énervé de nombreuses personnes au sein de l’armée."
france.321.a:0 "Ce serait indigne !"
france.321.b:0 "Pas de traitement de faveur"
france.322.t:0 "Weygand non-coupable"
france.322.d:0 "Le général Maxime Weygand, incarcéré il y a un an juste après sa libération de sa prison allemande, selon les vœux du gouvernement en raison de ses relations avec Vichy, a aujourd’hui été déclaré non coupable. Le général a organisé lui-même sa défense et a été dégagé de toute responsabilité, ainsi que relevé de l’indignité nationale. Il s’adonne désormais à la longue rédaction de ses mémoires et projette également d’écrire celles de son ami, le général Frère, assassiné, ainsi qu’une critique du général de Gaulle avec qui les relations sont plus que froides..."
france.322.a:0 "Un retraité très Actif !" 




FRA_reshuffle_the_air_ministry:0 "Remaniement du ministère de l'Air"
FRA_reshuffle_the_air_ministry_desc:0 "Nous avons besoin d'un leadership cohérent et compétent à la tête du ministère de l'Air. Plusieurs candidats sont en lice pour ce poste, nous devons donc choisir le meilleur."
shocked_officer:0 "Surpris par la percée ennemie"
shocked_officer_desc:0 "Cet officier, qui se croyait en sécurité grâce à un plan parfait et à des années de fortifications, est aujourd'hui surpris par la violente percée de l'ennemi sur le territoire national."
france.333.t:0 "Percée inattendue" 
france.333.d:0 "L'ennemi a percé nos lignes de manière inattendue à plusieurs endroits. Cela a semé le chaos au sein de l'état-major général, et le choc a été si grand qu'il a démoralisé de nombreux officiers supérieurs. Même si nous pouvons être certains que ce problème sera résolu, nous devons survivre jusque là."
france.333.a:0 "Nous devons contre-attaquer !"
france.444.t:0 "Redressement de l'armée" 
france.444.d:0 "Bien que secouée par le choc et pas encore complètement remise de cette percée, notre armée se réorganise lentement et l'état-major reprend confiance dans la victoire. La reprise des opérations visant à chasser l'ennemi du territoire a été décidée, et les troupes commencent à se mettre en position."
france.444.a:0 "Nous avons vécu pire sur la marne en 1914 !"


