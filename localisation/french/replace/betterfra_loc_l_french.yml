FRA_french_union_tt:0 "Des référendums seront organisés dans différentes parties de notre empire colonial. Certaines régions pourraient choisir de devenir totalement indépendantes. En accomplissant certaines tâches pour investir dans ces territoires, en réduisant leur autonomie et en renforçant l'opinion des marionnettes dans la région, et en obtenant un niveau élevé de conformité dans les territoires, vous augmenterez leurs chances de voter en faveur de l'union."

