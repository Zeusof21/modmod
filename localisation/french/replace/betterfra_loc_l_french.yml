lar_france_political_violence.6.t:0 "Émeutes de gauche"
 lar_france_political_violence.6.desc:0 "À la suite des récentes mesures prises par le gouvernement, plusieurs partis de gauche et organisations syndicales ont organisé des manifestations massives à Paris, accompagnées d'une brève grève générale, au cours desquelles de nombreux participants ont délibérément évoqué l'esprit de 1871.\n\nSi la police s'était préparée à ce que les manifestations dégénèrent en violences, elle n'était pas prête à faire face à leur ampleur, de nombreux quartiers de Paris, notamment la Ceinture Rouge, ayant été totalement occupés par les grévistes.\n\nFinalement, après quelques jours, les grévistes se sont dispersés et les manifestations ont pris fin après que le gouvernement ait réprimé le mouvement, mais ils ont montré que le siège de notre gouvernement se trouve dans une ville instable."
FRA_promote_motherhood_tt:0 "Après une période de cinq ans :"

FRA_united_against_fascism:0 "Unis contre le fascisme"
FRA_united_against_fascism_desc:0 "Le Front populaire rassemble les communistes, les socialistes et les radicaux contre le fascisme ! Ce n'est qu'unis que nous pourrons protéger la France contre cette menace."
FRA_hawk:0 "Faucon"
FRA_promote_motherhood_tt:0 "Après une période de cinq ans :"
FRA_wwi_truma:0 "Les cicatrices de la Grande Guerre"
FRA_wwi_truma_desc:0 "La France est sortie victorieuse de la Grande Guerre, mais à quel prix ?\n\n  Une génération a été sacrifiée dans les tranchées, et la France souffre aujourd'hui d'une population recrutable bien inférieure à celle de ses voisins."
FRA_demographic_crisis_tt:0 "\nRenforcer notre loi sur la conscription au-delà de §YService Court§! entraînera une pénurie de main-d'œuvre dans les usines."
FRA_wwi_truma2:0 "Se remettre de la Grande Guerre"
FRA_heal_from_ww1:0 "Guérir les traumatismes sociétaux"
FRA_heal_from_ww1_desc:0 "Les souffrances de la Première Guerre mondiale sont profondément ancrées dans la psyché française. À Versailles, on nous a refusé de mettre fin au Boche, et ces dernières années, il a de nouveau menacé la France. Mais c'est fini."
francepm.36.t:0 "Reynaud démissionne en raison des politiques d'apaisement"
francepm.36.d:0 "Même si Reynaud semblait venir d'être nommé Premier ministre, son incapacité à convaincre le gouvernement d'adopter une position plus ferme à l'égard des puissances révisionnistes en Europe a conduit à sa démission. Farouche opposant à la politique d'apaisement, il a démissionné lorsque le Parlement a refusé de se rallier à sa position en faveur de la défense de la Tchécoslovaquie. La droite étant au pouvoir depuis la crise du 6 février 1934, nombreux sont ceux qui espèrent voir la France dirigée par un gouvernement plus modéré."

FRA_furia_franceses:0 "Furia Francese"
FRA_furia_franceses_desc:0 "Cette expression est popularisée par les Italiens en 1495 pendant la première guerre d'Italie. Elle souligne l'impétuosité, le courage et la grande violence des troupes françaises."
FRA_furia_france:0 "Furia Francese"


newsfml.122.t:0 "Refus de l'Armistice"
newsfml.122.d:0 "Juste avant que la France vaincue ne signe l’armistice, un général encore peu connu, Charles de Gaulle, s’est rendu à Londres. L’événement aurait pu paraître anodin : il n’était alors que sous-secrétaire d’État à la Guerre. Pourtant, malgré les demandes pressantes du gouvernement français, il refuse de rentrer. Il commence meme à poser les bases d’un gouvernement français en exil, en total désaccord avec les décisions prises en métropole. Son intention est claire : continuer la guerre aux côtés des Alliés jusqu’à la victoire finale. Mais pour l’instant, une grande partie des Français pense surtout à la reconstruction d’un pays une fois de plus ravagé par la guerre, plutôt qu’à l’idée de poursuivre le combat ou d’entrer en résistance après le choc brutal de la défaite..."
newsfml.122.a:0 "La France n'a pas dit son dernier mot !"

