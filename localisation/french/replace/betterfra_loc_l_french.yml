RULE_OPTION_GER_RANDOMATTACK_DESC:0 "L'Allemagne choisira l'une des trois options ci-dessous et envahira les Pays-Bas à cette date."
RULE_OPTION_GER_SPRING40:0 "MAI 1940"
RULE_OPTION_GER_SPRING40_DESC:0 "L'Allemagne attaquera en mai 1940, comme cela s'est produit historiquement."
RULE_OPTION_GER_WINTER40:0 "Janvier 1940"
RULE_OPTION_GER_WINTER40_DESC:0 "L'Allemagne attaquera en janvier 1940, comme prévu avant l'incident de Mechelen"
RULE_OPTION_GER_FALL39:0 "Novembre 1939"
RULE_OPTION_GER_FALL39_DESC:0 "L'Allemagne attaquera en novembre 1939, à peu près à la date initialement prévue."
