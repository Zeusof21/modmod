l_french:
LOADING_TIP_156:0 "Le Français a vraiment l'air d'avoir été abandonné par tous les bons esprits, sinon il aurait pu et aurait dû empêcher cela.\n (Fedor Von Bock, apprenant la percée de Sedan)"
LOADING_TIP_157:0 "Tout n'est qu'une question d'heures.\n(Maurice Gamelin à propos du déclenchement de la contre-attaque alliée, qui n'aura lieu que trois jours plus tard)"
LOADING_TIP_158:0 "Lieutenant, êtes-vous content de moi ?.\n(Les derniers mots d'un artilleur français du 237e régiment d'artillerie lourde, les deux jambes arrachées et sur le point de mourrir)"
LOADING_TIP_159:0 "La guerre commence infiniment mal. Il faut donc qu’elle continue.\n(Charles de Gaulle)"
LOADING_TIP_160:0 "La France a perdu une bataille, mais la France n'a pas perdu la guerre.\n(Charles de Gaulle)"
LOADING_TIP_161:0 "C’est le coeur serré que je vous dis aujourd’hui qu’il faut cesser le combat..\n(Philippe Pétain)"
LOADING_TIP_162:0 "J'accepte la lourde charge que vous me demandez d'assumer. Je ferai ce que je peux, mais je ne peux garantir le succès.\n(Maxime Weygand à Reynaud lorsqu'il remplace Gamelin au poste de généralissime)"
LOADING_TIP_163:0 "Les troupes françaises se sont battues comme des lions!\n(Walter von Reichenau)"
LOADING_TIP_164:0 "Il nous faudra absolument, après la guerre, forger une alliance capable de contenir un pays capable de prouesses militaires qui étonnent le monde comme à Bir Hakeim.\n(Adolf Hitler)"
LOADING_TIP_165:0 "Il y a trois batailles que je n'oublierai jamais, Stonne, Stalingrad et Montecassino.\n(Paul Wagner)"
LOADING_TIP_166:0 "Malgré notre écrasante supériorité numérique, les Français contre-attaquent sur plusieurs points. Je ne comprends pas comment ces soldats, combattant parfois 1 sur 20, trouvent la force de prendre d'assaut.\n(Georg von Küchler)"
LOADING_TIP_167:0 "Nous recevions des mauvaises nouvelles, des mauvaises nouvelles tout le temps. Une ambiance incroyable, une sorte d'usure morale, après cette accumulation en huit jours de nouvelles catastrophiques.\n(André Beaufre)"
LOADING_TIP_168:0 "N'interrompez jamais votre ennemi lorsqu'il fait une erreur.\n(Napoléon Bonaparte)"
LOADING_TIP_169:0 "Si vous construisez une armée de 100 chiens et que leur chef est un lion, tous les chiens se battront comme un lion.\n(Napoléon Bonaparte)"
LOADING_TIP_170:0 "Je suis inquiet. Nous allons voir à présent ce que vaut Gamelin.\n(Paul Reynaud)"
LOADING_TIP_171:0 "Ah les cons ! S'ils savaient...\n(Édouard Daladier à propos de la réactions des gens après la conférence de Munich)"
LOADING_TIP_172:0 "Il n'y a ni armistice, ni suspension d'armes. La bataille continue.\n(Benoit Besson après l'annonce de l'armistice)"
LOADING_TIP_173:0 "Du moment qu’on démolit l’armée, j’en suis.\n(Léon Blum, votant contre la production de Chars en 1934)" 
LOADING_TIP_174:0 "Aujourd'hui, 10 juin 1940, la main qui tenait le poignard l'a plongé dans le dos de son voisin.\n(Franklin Roosevelt, après la déclaration de guerre de Mussolini)"
LOADING_TIP_175:0 "Nous allons vers un nouveau Sedan et plus terrible encore que celui de 1870.\n(Gaston Bilotte)"
LOADING_TIP_176:0 "Si les Allemands me faisaient vraiment le plaisir d’attaquer, je leur offrirai un milliard de francs.\n(Maurice Gamelin)"
LOADING_TIP_177:0 "C’est la vie de la France qui est en jeu dans cette bataille, toute la civilisation occidentale, le sort des petites puissances, la dignité de l’homme. Arrêter d’abord, battre ensuite.\n(Maxime Weygand)"
LOADING_TIP_178:0 "Dangereux, mais précieux. Et ayant une énorme qualité : sachant faire son travail sans en parler, sans qu’on en parle.\n(Georges Clémenceau à propos de Weygand)"
LOADING_TIP_179:0 "Nous ne sommes pas disposés à laisser placer Strasbourg sous le feu des canons allemands.\n(Albert Sarraut, après la remilitarisation de la Rhénanie)"
LOADING_TIP_180:0 "Quand nous aurons réduit nos armements, elle imposera ce qu’elle voudra : la Sarre, l’Anschluss, l’expansion vers l’est, l’Alsace, etc...\n(Maxime Weygand)"
LOADING_TIP_181:0 "Nous ne tardames pas a toucher du doigt qu'une armistice ne se négocie pas.\n(Camille Chautemps)"
LOADING_TIP_182:0 "Il faut bannir l’idée d’un état militaire défensif, terme auquel je ne vois d’équivalent que celui d’impuissance, conception qui peut séduire parce qu’elle favorise un moindre effort, mais qui postule la défaite et l’éloignement de nos amis.\n(Maxime Weygand)"
LOADING_TIP_183:0 "Pour les braves, le fusil n'est que le manche de la baionette !.\n(Napoléon Bonaparte)"
LOADING_TIP_184:0 "La résistance héroïque de l'armée française a sauvé les Britanniques et leur a permis de poursuivre la guerre.\n(Winston Churchill)"
LOADING_TIP_185:0 "Souhaitons aussi que notre pays s’arrête sur la mauvaise pente où il continue à glisser et se remette à la remonter. A cet égard, l’année 1938 s’ouvre sous un ciel bien sombre.\n(André Corap)"
LOADING_TIP_186:0 "Gamelin, c’est comme nos casemates. Les flèches que je lui envoie ricochent.\n(Pierre Héring)"
LOADING_TIP_187:0 "Le général Weygand à la tête de nos armées, c’est l’âme de Foch qui inspire la résistance et exalte la volonté de vaincre.\n(Journal le Temps)"
LOADING_TIP_188:0 "Un optimiste c'est un homme qui plante 2 glands et qui s'achète un hamac.\n(Jean de Lattre de Tassigny)"
LOADING_TIP_189:0 "Je hais les mensonges qui vous ont fais tant de mal.\n(Philippe Pétain)"
LOADING_TIP_190:0 "C'est moi seul que l'Histoire jugera.\n(Philippe Pétain)"
LOADING_TIP_191:0 "Très sérieux effort ennemi vers la Meuse.\n(Rapport de renseignement de l’armée de l’air Française)"
LOADING_TIP_192:0 "Je ne pense pas que les Allemands aient jamais pensé à attaquer dans la région de Sedan.\n (Charles Huntziger)"
LOADING_TIP_193:0 "Dunkerque m’apporte la preuve que le soldat français est l’un des meilleurs du monde.\n (Georg von Küchler)"
LOADING_TIP_194:0 "Chez moi, tout le monde tient. On est encerclé, mais on tient. Un groupe du 304e d’artillerie vient de contre-attaquer et de faire 150 prisonniers. J’ai la conviction absolue que l’armée française est en train de se sauver.\n (Aubert Frère)"
