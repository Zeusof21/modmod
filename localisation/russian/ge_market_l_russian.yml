 ge_market.1.t:0 "Предложение о покупке территории"
 ge_market.1.d:0 "Иностранное государство вышло на нас с выгодной сделкой: они хотят выкупить один из наших регионов за §G[?global.ge_state_offer_price|0]$§!.\n\nСогласимся ли мы и уступим землю?"
 ge_market.1.a:0 "Принять. Деньги нам не помешают."
 ge_market.1.b:0 "Отказать. Земля не продаётся."
 
 ge_market.2.t:0 "Сделка принята"
 ge_market.2.d:0 "Отличные новости! Иностранное правительство приняло наше предложение. Регион официально перешёл под наше управление."
 ge_market.2.a:0 "Хорошее пополнение наших владений."
 
 ge_market.3.t:0 "Сделка отклонена"
 ge_market.3.d:0 "Иностранное правительство отвергло наше предложение выкупить их территорию. Они заявили, что суверенная земля не продаётся.\n\nНаша предоплата в размере §G[?global.ge_state_offer_price|0]$§! полностью возвращена."
 ge_market.3.a:0 "Глупцы. Заберём силой."
 
