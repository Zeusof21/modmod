 ge_market.4.t:0 "Военная добыча: [ge_loser_country.GetNameDefCap]"
 ge_market.4.d:0 "После полной капитуляции и аннексии страны [ge_loser_country.GetNameDef] наши войска взяли штурмом ее столицу и захватили государственную казну.\n\nВсе офшорные счета, золотые запасы и средства на черном рынке, принадлежавшие бывшему правительству, были конфискованы.\n\nВсего получено средств: §G[?ge_latest_loot|0]$§!"
 ge_market.4.a:0 "Победителю достаются трофеи!"
 
 ge_market.5.t:0 "Военные репарации: [ge_loser_country.GetNameDefCap]"
 ge_market.5.d:0 "В рамках реорганизации страны [ge_loser_country.GetNameDef] недавно назначенная марионеточная администрация согласилась выплатить нашему правительству значительные военные репарации.\n\nМы ликвидировали большую часть их национальных резервов и перевели их в нашу собственную казну.\n\nВсего получено средств: §G[?ge_latest_loot|0]$§!"
 ge_market.5.a:0 "Они заплатят за свои преступления."