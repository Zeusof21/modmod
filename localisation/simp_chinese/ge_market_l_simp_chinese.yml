 ge_market.1.t:0 "领土购买提议"
 ge_market.1.d:0 "一个外国国家向我们提出了一项极具吸引力的报价。他们希望以 §G[?global.ge_state_offer_price|0]$§! 购买我们的一个州。\n\n我们是否接受并放弃该领土？"
 ge_market.1.a:0 "接受，我们需要这笔钱。"
 ge_market.1.b:0 "拒绝！土地不出售。"
 ge_market.2.t:0 "提议被接受！"
 ge_market.2.d:0 "好消息！该外国政府接受了我们的慷慨报价。该省份已正式划归我方管理。"
 ge_market.2.a:0 "祖国的一次重大扩张。"
 ge_market.3.t:0 "提议被拒绝"
 ge_market.3.d:0 "该外国政府正式拒绝了我方购买其领土的提议，并表示其主权不可出售。\n\n我们最初支付的 §G[?global.ge_state_offer_price|0]$§! 已全额退还。"
 ge_market.3.a:0 "愚蠢之举，那就用武力夺取。"
