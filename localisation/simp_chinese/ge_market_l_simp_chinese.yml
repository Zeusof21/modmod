 ge_market.4.t:0 "战利品：[ge_loser_country.GetNameDefCap]"
 ge_market.4.d:0 "随着[ge_loser_country.GetNameDef]的彻底投降和被吞并，我们的军队已经突入他们的首都并夺取了国库。\n\n属于前政府的所有离岸账户、黄金储备和黑市资金都已被没收。\n\n获得的总资金：§G[?ge_latest_loot|0]$§!"
 ge_market.4.a:0 "战利品属于胜利者！"
 ge_market.5.t:0 "战争赔款：[ge_loser_country.GetNameDefCap]"
 ge_market.5.d:0 "作为重组[ge_loser_country.GetNameDef]的一部分，新成立的傀儡政府已同意向我国政府支付巨额战争赔款。\n\n我们已经清算了他们的大部分国家储备，并将其转移到了我们自己的国库中。\n\n获得的总资金：§G[?ge_latest_loot|0]$§!"
 ge_market.5.a:0 "他们将为自己的罪行付出代价。"
 
