l_english:
 USA_the_new_deal:0 "Affirm the New Deal"
 USA_the_new_deal_desc:0 "With Roosevelt's first term finishing up, he must make official his New Deal policies."
 USA_progressive_1936:0 "Progressive President"
 USA_progressive_1936_desc:0 "A president with progressive policies has stood victorious in the 1936 elections, who will seek reformist policies and is supportive of the New Deal."
 USA_liberal_1936:0 "Liberal President"
 USA_liberal_1936_desc:0 "A president with liberal policies has stood victorious in the 1936 elections, who will seek moderate policies."
 USA_conservative_1936:0 "Conservative President"
 USA_conservative_1936_desc:0 "A president with conservative policies has stood victorious in the 1936 elections, who will seek conservative values and be against the New Deal."
 USA_gridlock:0 "Gridlock of 1936"
 USA_gridlock_desc:0 "With no party achieving over 50% of the electoral college vote, and Congress unable to select a president, a gridlock has occured as no president can be truly elected."
 USA_macarthur_regime:0 "The MacArthur Regime"
 USA_macarthur_regime_desc:0 "Douglas MacArthur has taken control of the government following the rioting in the country, and must now start to secure his position."
 USA_deal_with_depression:0 "Dealing with the Depression"
 USA_deal_with_depression_desc:0 "To restore America's greatness, MacArthur has decided to prepare for Depression recovery."
 USA_encourage_meritocracy:0 "Encourage Meritocracy"
 USA_encourage_meritocracy_desc:0 "MacArthur's first step in his reforms is encouraging meritocracy, so that the government can have more qualified individuals in power. This will allow the government to be more efficient in its reforms."
 USA_compensate_veterans:0 "Compensate Veterans"
 USA_compensate_veterans_desc:0 "The veterans, especially of the Great War, have been hardest hit by the depression. MacArthur has pushed for them to be justly compensated after being denied of their economic relief."
 USA_encourage_small_business:0 "Encourage Small Businesses"
 USA_encourage_small_business_desc:0 "MacArthur, being a conservative, has been a staunch supporter of small business and is willing to help them out to save the economy."
 USA_silver_shirt_collaboration:0 "Silver Shirts Collaboration"
 USA_silver_shirt_collaboration_desc:0 "We must reach out to the Silver Shirts if we want to legitimize our government. Being less popular, it will absolutely won't benefit our stability, but at least they are more ideologically aligned with us."
 USA_right_wings_collaboration:0 "Ally the Conservative Coalition"
 USA_right_wings_collaboration_desc:0 "We must reach out to the Congress' Conservative Coalition if we want to legitimize our government. Being more popular, it will resonate more with the populace, however it will take some concessions as they are less ideologically aligned with us."
 USA_attack_commies:0 "Stamp Out Revolutionaries"
 USA_attack_commies_desc:0 "The actions of American communists have been nothing but treason recently. Their horrible actions must be stopped, and we will crush them until they die."
 USA_dismantle_constitution:0 "Destroy the Constitution"
 USA_dismantle_constitution_desc:0 "The Constitution has limited the powers of the President too much. Our government will be extrordinarily weak if we continue to limit MacArthur's power. Therefore, the Constitution must begone."
 USA_democratic_lip_service:0 "Democratic Lip Service"
 USA_democratic_lip_service_desc:0 "Our supporters, while conservative, still want democracy. We value them, so we will give into their requests of the return of elections. Just don't expect them to be §4too§! free or fair..."
 USA_a_new_face:0 "Find New Leadership"
 USA_a_new_face_desc:0 "MacArthur has served us well, but he was only a temporary solution to get rid of our instability. Now that our nation has been stabilized, we shall seek to find better leadership, in someone who will truly lead our nation to glory."
 USA_stick_with_macarthur:0 "Rally Around MacArthur"
 USA_stick_with_macarthur_desc:0 "MacArthur is an excellent general and an even better leader for our republic. He needs to stay for us to make our nation even greater! A change in leadership will only result in instability, and MacArthur is now a proven leader."
 USA_bring_in_eisenhower:0 "Bring in Eisenhower"
 USA_bring_in_eisenhower_desc:0 "Eisenhower is a leader of the people, for the people. We need him, and he will be a much better President than MacArthur."
 USA_silver_shirt_takeover:0 "Silver Shirt Takeover"
 USA_silver_shirt_takeover_desc:0 "The Silver Shirts may have once been a small supporter, but now they are a large influence. Now, they have forced MacArthur to leave the government and bring them into power."
 USA_alliance_with_jerries:0 "Alliance with the Germans"
 USA_alliance_with_jerries_desc:0 "The Germans seem to have more in common with us than we thought. We will send them a delegation, showing our intention to ally with them."
 USA_alliance_with_brits:0 "Alliance with the British"
 USA_alliance_with_brits_desc:0 "The British seem to have more in common with us than we thought. We will send them a delegation, showing our intention to ally with them."
 USA_our_own_alliance:0 "Our Own Alliance"
 USA_our_own_alliance_desc:0 "America must always come first - no matter what! Therefore, we must make our own alliance, for us and for only the most loyal allies."
 USA_join_the_allies:0 "Join the Allies"
 USA_join_the_allies_desc:0 "The world needs our help and we need to collaborate. The Allies share our ideas of containing the evil fascist menaces of Germany, Japan, and Italy."
 USA_congress_coup:0 "The Congressional Coup"
 USA_congress_coup_desc:0 "The country has fallen on very hard times and Congress believes that the only way to solve our problems is by putting absolute power in the President of the Senate. The means of "fixing" this country are certainly questionable, no doubt, but the President has decided to keep his lips sealed on this one."
 USA_falling_apart:0 "Falling Apart"
 USA_falling_apart_desc:0 "With our refusal of the last-ditch effort to rescue our nation, we now face an impending collapse. Civil war seems inevitable to many."
 USA_side_with_nation:0 "Side With the Government"
 USA_side_with_nation_desc:0 "We will stay loyal to the country and the government, forever and ever! We will never stand down to those evil traitors!"
 USA_side_with_people:0 "Side With the People"
 USA_side_with_people_desc:0 "The government has betrayed the country. We need a return to a government that cares for the people."
 USA_civil_war:0 "The Second United States Civil War"
 USA_civil_war_desc:0 "Violence has gone rampant throughout the nation. The people are rioting in the streets. Strikes riddle the factories. The government is in panic. This is no longer a divide between the £party_usa_republicans §tRepublicans§! and the £party_usa_democrats §2Democrats§!; states against feds, this is between the government and the people."
 USA_emergency_arms:0 "Emergency Factory Conversions"
 USA_emergency_arms_desc:0 "While it will absolutely be unpopular, we must convert some civilian industry into arms factories for the war effort."
 USA_mobilize_nation:0 "Mobilize the Nation"
 USA_mobilize_nation_desc:0 "We must rally up the men who wish to fight in our side of this conflict."
 USA_emergency_guns:0 "Emergency Guns"
 USA_emergency_guns_desc:0 "We need more weapons if we want to win this conflict."
 USA_declare_victory_cw:0 "Victory!"
 USA_declare_victory_cw_desc:0 "Finally, the terrible Second United States Civil War is over. Now, we can finally start to mend the divisions that tore our country apart in the first place."
 USA_reconstruction:0 "Reconstruction"
 USA_reconstruction_desc:0 "The country has been torn apart by the civil war; it is now time to bring the country back together."
 USA_united_once_again:0 "United Once Again"
 USA_united_once_again_desc:0 "Finally, we can end reconstruction and now focus elsewhere."
 USA_question_leader:0 "Question of Leadership"
 USA_question_leader_desc:0 "Garner's succesful execution of a victory in the Civil War has done nothing but increase his popularity. However, some say that he should consider stepping down."
 USA_stick_with_garner:0 "Stick With Garner"
 USA_stick_with_garner_desc:0 ""Cactus Jack" has proven to be a great leader. There is no reason to change our ways now."
 USA_old_ways:0 "A Kingdom Arises"
 USA_old_ways_desc:0 "We need a return to the good old days of a rule under a king. However, we won't be the colony this time, we will have colonies."
 USA_deciding_on_king:0 "Deciding on a King"
 USA_deciding_on_king_desc:0 "We need to select a king before we instate a monarchy. So, without further ado, we must get into it."
 USA_drum_up_support:0 "Drum Up Support"
 USA_drum_up_support_desc:0 "Monarchies are quite unpopular in the United States, unsuprisingly. Thankfully we can rectify that by drumming up support for them."
 USA_god_fatherland_king:0 "God, Land, and King"
 USA_god_fatherland_king_desc:0 "Never again shall our great nation face the effects of the mistake that is republicanism! Now that we have support and a monarch, we can instate a monarch!"
 USA_crush_opposition:0 "Crush the Opposition"
 USA_crush_opposition_desc:0 "Opposition has got so bad that even the Democrats and Republicans have united. We must crush them before they become even more of a problem."
 USA_look_to_past:0 "Look to the Past"
 USA_look_to_past_desc:0 "While it's true that what the Confederates were fighting for was wrong, it's undeniable that since the war the federal government has expanded too much since. We need to return to a day where states had much more power and everybody lived more freely. Being a Southerner himself, President Garner can help change people's minds."
 USA_look_to_future:0 "Look to the Future"
 USA_look_to_future_desc:0 "The only way we can continue as a country is not by looking back to the past, but looking to the future."
 USA_corporatism:0 "Corporatism"
 USA_corporatism_desc:0 "We need to collaborate with the biggest of companies if we want our country to be advanced."
 USA_a_great_beautiful_tomorrow:0 "A Great, Big, Beautiful Tomorrow"
 USA_a_great_beautiful_tomorrow_desc:0 "Walt has a great future for our nation. We must see out his ideas."
 USA_tasting_the_feeling:0 "Tasting the Feeling"
 USA_tasting_the_feeling_desc:0 "America might have tasted the feeling, but has everybody else?"
 USA_going_places:0 "Getting to New Places"
 USA_going_places_desc:0 "Ford has great new industrious ideas for our country. We must accept them and bring them to others."
 USA_progressive_convention:0 "Hold the Progressive Convention"
 USA_progressive_convention_desc:0 "We must hold a convention to decide the fate of the party - and in turn, the nation."
 USA_compromise_candidate:0 "The Compromise Candidate"
 USA_compromise_candidate_desc:0 "Norman Thomas may be able to unite the party with ideals that appeal to both sides - he is indeed a socialist, but still with democratic ideals in mind. He is our best choice."
 USA_continue_prog_era:0 "Continue the Progressive Era"
 USA_continue_prog_era_desc:0 "The two Roosevelts' presidencies may have ended, but their ideas have not. Let us continue with them to become a beacon of progressivism."
 USA_workers_unite:0 "Workers of America, Unite!"
 USA_workers_unite_desc:0 "Workers of America, Unite! We have finally overthrown the capitalist scums and established a dictatorship of the proletariat!"
 USA_corporations_question:0 "Question of the Corporations"
 USA_corporations_question_desc:0 "The largest corporations of this country may have survived the Civil War, but will they survive the Revolution?\n\nLet's find out."
 USA_spread_revolution:0 "Spread the Revolution"
 USA_spread_revolution_desc:0 "The Revolution that started in our country is the best! We need to spread it to other countries, and liberate them and their workers."
 USA_restart_chinese_cw:0 "Restart the Chinese Civil War"
 USA_restart_chinese_cw_desc:0 "The people must stand up and depose Kai-Shek's dictatorship! We must reuinite China under a glorious socialist government!"
 USA_reunite_china:0 "Reunite China"
 USA_reunite_china_desc:0 "The time has come! We must take back every state for our Chinese ally, no matter the cost! Onwards!"
 USA_democracy_everywhere:0 "Democracy, Democracy Everywhere!"
 USA_democracy_everywhere_desc:0 "Democracy is the best form of government as it is by the people, for the people. Therefore, we must spread it to everyone, starting with the double continent of North and South America."
 USA_miami_treaty:0 "The Miami Treaty Organization"
 USA_miami_treaty_desc:0 "We must show ourselves as a beacon of liberty. Therefore we will creat a grand alliance that will show ourselves so, and start by inviting the other Democratic bastions of North and South America."
 USA_secularism:0 "Secular Institutions"
 USA_secularism_desc:0 "The First Amendment guarantees peoples' freedom to worship. Therefore, religion has no place in the government."
 USA_catholic_ideas:0 "Catholic Ways"
 USA_catholic_ideas_desc:0 "Al Smith is our first Catholic president. He wishes to spread the ways of tolerance and progressivism througout our great nation."
 USA_christian_socialism:0 "Christian Socialism"
 USA_christian_socialism_desc:0 "While Nortan Thomas is a socialist, he is a Christian at his core. He can now spread his tolerant and socialist values throughout this nation."
 USA_athiesm:0 "State Athiesm"
 USA_athiesm_desc:0 "Religion has no place in this nation. While we are already secular, that is not enough. We will ban all religion, so people can focus on worshipping the state over their God."
 USA_the_square_deal:0 "The Square Deal"
 USA_the_square_deal_desc:0 "We can now finally set out to instill the policies that Theodore Roosevelt wanted. We will provide a square deal for every man, big or small, rich or poor!"
 USA_market_socialism:0 "Institute Market Socialism"
 USA_market_socialism_desc:0 "We must be able to appease both sides. Implementing a full-on communist system would anger more moderate progressives, but keeping capitalism would anger the communists! Therefore, we will implement Market Socialism, which will have ideas of both socialism and capitalism."
 USA_destroy_capitalism:0 "Destroy Capitalism"
 USA_destroy_capitalism_desc:0 "The days of the crony capitalist system are over! We must institute a new, communist system that will appeal to the working class and end the influence of the rich!"
 USA_german_menace:0 "The German Menace"
 USA_german_menace_desc:0 "While they may have no aggression now, the Germans have always been talking about striking at the largest socialist country in Europe, [SOV.getnamedef]. We cannot allow this to happen, so we must strike at them ourselves!"
 USA_no_more_dictators_americas:0 "No More Dictators!"
 USA_no_more_dictators_americas_desc:0 "Many countries in North And South America are ruled by corrupt dictatorships and the people's rights are compromised! Being the democratic bastion, we cannot allow this to occur!"
 USA_industrialize_china:0 "Industrialize China"
 USA_industrialize_china_desc:0 "China's gargantuant population has the oppurtunity for something great. Unfortunately, they lack the industrial might. Thankfully, we can help them become one."
 USA_two_germany_solution_communist:0 "Two-Germany Solution"
 USA_two_germany_solution_communist_desc:0 "We cannot let Germany resurge to become a great power. Therefore, we will divide it into two nations; one for us, and one for our Soviet ally."
 USA_eins_neue_deutschland:0 "Ein Neu Deutschland"
 USA_eins_neue_deutschland_desc:0 "Dividing Germany is not a good idea. However, we will have to rebuild it from the ground up."
 USA_seperate_revolution:0 "Seperate Revolution"
 USA_seperate_revolution_desc:0 "None of the other revolutions work! We will have to create our own, one that is pure and actually for the workers!"
 USA_careful_cooperation:0 "Careful Cooperation"
 USA_careful_cooperation_desc:0 "As painful as it may be, cooperation may be the best choice for the advancement of the revolution."
 USA_the_fake_revolution:0 "Destroy the Fake Revolution"
 USA_the_fake_revolution_desc:0 "Stalin's revolution is fake! We need to bring justice to the ideas of Marx and Lenin that they have terribly ignored!"
 USA_reach_out_to_benelux:0 "Reach Out to the Benelux"
 USA_reach_out_to_benelux_desc:0 "The Benelux has always been the speed bump of Europe. No longer shall they be simply ran over in wars that shouldn't concern them."
 USA_reach_out_to_ireland:0 "Reach Out to Ireland"
 USA_reach_out_to_ireland_desc:0 "There are many Irish living in our great lands following the days of the Great Potato famine. Now they can be our official allies."
 USA_reach_out_to_nordic:0 "Reach Out to the Nordics"
 USA_reach_out_to_nordic_desc:0 "The Nordics, while neutral during the Great War, are undoubtedly targets of a possible second. We must protect them."
 USA_reinforce_old_alliances:0 "Reinforce Old Alliances"
 USA_reinforce_old_alliances_desc:0 "France has been our ally for a long time. They will be an integral part of our great alliance."
 USA_denounce_france:0 "Denounce France"
 USA_denounce_france_desc:0 "France has been very unstable throughout the past two centuries. Unfortunately, strong and good leadership have been lacking recently. No more! We will ensure a great future for the people of France! We must say that their government must go down!"
 USA_legacy_of_liberty:0 "The Legacy of Liberty"
 USA_legacy_of_liberty_desc:0 "We, and [FRA.getnameDEF], share a common goal of preserving and spreading liberty. We must enshrine it with our wonderful alliance."
 USA_destroy_communism:0 "Destroy Communism in Europe"
 USA_destroy_communism_desc:0 "Nations like the USSR claim that they are a federation of equal peoples.\nWe know this isn't true. Therefore, we must stop them and liberate their peoples!"
 USA_destroy_fascism:0 "Destroy Fascism in Europe"
 USA_destroy_fascism_desc:0 "Fascism is the biggest threat to liberty. We must destroy it, and ensure that it can never, ever come back again!"
 USA_brothers_war:0 "Brother War"
 USA_brothers_war_desc:0 "France as a nation in its current state cannot be allowed to continue. It is unstable and a threat to democracy. Therefore, war is the only option."
 USA_dismantle_the_empire:0 "Dismantle the Empire"
 USA_dismantle_the_empire_desc:0 "Being a former colony ourself, we are no stranger to the oppression that the British put upon their subjects. Any sane person knows that this needs to be stopped, even if force is required."
 USA_tear_down_the_old_france:0 "Tear Down the Old France"
 USA_tear_down_the_old_france_desc:0 "Now that we have France under our control, we can decide what to do with them. We must remove the old government, and bring up a new one!"
 USA_disunite_the_kingdom:0 "Disunite the Kingdom"
 USA_disunite_the_kingdom_desc:0 "The United Kingdom cannot be allowed to exist. Scots, Welsh, and Irish alike are being suppressed and nothing is being done about it. Now this can change; freedom will reign over the British Isles!"
 USA_treaty_of_peace:0 "Treaty of Peace"
 USA_treaty_of_peace_desc:0 "War is hell. We can't simply go to war with other countries that share our ideals. To ensure peace, we will sign a pact of non-aggression and friendship with the British."
 USA_greater_cooperation:0 "Greater Cooperation"
 USA_greater_cooperation_desc:0 "Our alliance is great, but we won't be able to stop the threat at hand unless we work closer with our allies. Let us sign a treaty that will integrate our armed forces so we can cooperate."
 USA_kick_out_colonizers:0 "Kick out the Colonizers"
 USA_kick_out_colonizers_desc:0 "The Monroe Doctrine is possibly one of the best documents that we have ever signed. However, it doesn't go far enough as it still allows the European powers to keep their colonies. This may not continue!"
 USA_one_america_plan:0 "One America Plan"
 USA_one_america_plan_desc:0 "Our greater cooperation has proved very successful. However, many suggest that it could be better. Ideas have been floated for a united American state. While it may seem impossible to many, our efforts may bear great fruits."
 one_america_plan_t:0 "§4We will begin to integrate our American allies.§!"
 USA_a_great_america:0 "A New United States"
 USA_a_great_america_desc:0 "A hundred years ago, our nation merely wished to spread across the width of one continent. Now, we have expanded over two entire continents. We will establish a new United States, that will encompass all of the Americas, free from tyranny, and full of freedom for all peoples."
 a_great_america:0 "§4All of our subjects with the "Puppet" autonomy or lower will be annexed into our nation, and we will gain cores on the entirety of North and South America.§!"
 USA_continue_constitutionality:0 "Stick With the Constitution"
 USA_continue_constitutionality_desc:0 "While we may have switched to having a King, we still must adhere to the constitutional values of our country."
 USA_all_power_to_king:0 "All Power to the King"
 USA_all_power_to_king_desc:0 "Constitutions leave the government weak. If we wish to be a great and prosperous empire, we must get rid of any sort of laws that limit their power."
 USA_british_monarch:0 "A British Monarch"
 USA_british_monarch_desc:0 "We have a British monarch in power! A leader with great legitimacy will help our young kingdom, but it absoultely damage our relations with their motherland, [ENG.getnameDEF]."
 USA_german_monarch:0 "A German Monarch"
 USA_german_monarch_desc:0 "We have a German monarch in power! A leader with great legitimacy will help our young kingdom, but it absoultely damage our relations with their fatherland, [GER.getnameDEF]."
 USA_american_monarch:0 "An American Monarch"
 USA_american_monarch_desc:0 "We have an American monarch in power! A popular leader will help our young kingdom, but our aspirations on the continent will absoultely damage our relations with our historical neighbours, Canada and Mexico."
 USA_gateway_to_europe:0 "Our Gateway to Europe"
 USA_gateway_to_europe_desc:0 "We must find an entrance to the European continent as we, in our current state, do not have one. Therefore, we will have to take strategic areas to achieve our later goals."
 USA_demand_liberia:0 "Demand Liberian Submission"
 USA_demand_liberia_desc:0 "[LIB.getnameDEF] was once a colony of us, but they have since become independent. We must fix our mistake of letting them slip through our grasp, and demand their annexation!"
 USA_motherland:0 "The Motherland"
 USA_motherland_desc:0 "It is time that we take back the land that is rightfully ours; it is time to take over Great Britain!"
 USA_vaterland:0 "Das Vaterland"
 USA_vaterland_desc:0 "It is time that we take back the land that is rightfully ours; it is time to take over Germania!"
 USA_proclaim_anglo_american_empire:0 "Proclaim the Anglo-American Empire"
 USA_proclaim_anglo_american_empire_desc:0 "The time is here! Now that we have a legitimate British monarch and great lands, we can proclaim ourselves an empire!"
 USA_proclaim_american_kaiserreich:0 "A German-American Kaiserreich"
 USA_proclaim_american_kaiserreich_desc:0 "The time is here! Now that we have a legitimate German monarch and great lands, we can proclaim ourselves an great Kaiserreich!"
 USA_strike_south:0 "Strike South"
 USA_strike_south_desc:0 "If we want to turn our kingdom into a great Empire, we must take over other lands! Thankfully, our southern neighbour, Mexico, is weak and will fall like a house of cards."
 USA_core_mexico:0 "Integrate Mexico"
 USA_core_mexico_desc:0 "It is obvious that if we want to be united and if we want to avoid rebellion, we must give the Mexicans the same rights as any other citizen and make them a part of our great nation."
 USA_conquer_the_caribbean:0 "Conquer the Caribbean"
 USA_conquer_the_caribbean_desc:0 "The Caribbean are just a bunch of little islands waiting to be taken by a larger power. They will be pushovers."
 USA_conquer_central_america:0 "Break Through the Banana Republics"
 USA_conquer_central_america_desc:0 "Ah, Central America. Stricken with corruption, disunitedness, and instability. But what if it didn't have to be that way? What if they were stable and united under a strong empire?"
 USA_core_caribbean:0 "Integrate the Caribbean"
 USA_core_caribbean_desc:0 "Now that we control what was the last of the Caribbean republics, we can claim them as integral provinces of our empire."
 USA_core_central_america:0 "Integrate Central America"
 USA_core_central_america_desc:0 "Now that we control all of Central America, we can claim the region as integral provinces of our empire."\
 USA_take_canada:0 "Conquer Canada"
 USA_take_canada_desc:0 "Canada has always been a rightful land of ours. Let us now take it."
 USA_proclaim_american_empire:0 "Proclaim the American Empire"
 USA_proclaim_american_empire_desc:0 "America has, for far too long, been stuck with not much land and little prestige. However, the winds of change have proven to blow another way..."
 USA_capture_colombia:0 "Capture Colombia"
 USA_capture_colombia_desc:0 "Greater Colombia is the next place for expansion. Let us take it for ourselves."
 USA_integrate_gran_colombia:0 "Integrate Greater Colombia"
 USA_integrate_gran_colombia_desc:0 "Now that Greater Colombia is under our control, we can fully integrate them into our Empire."
 USA_andes_offenssive:0 "Andes Offensive"
 USA_andes_offenssive_desc:0 "We must now strike south, into the Andes, so we can expand our reach into South America."
 USA_integrate_andes:0 "Integrate the Andes"
 USA_integrate_andes_desc:0 "Now that the Andes are under our control, we can fully integrate them into our Empire."
 USA_break_brazil:0 "Break Brazil"
 USA_break_brazil_desc:0 "Next, we must take the former territories of the once great Brazillian Empire, and make them our own."
 USA_integrate_greater_brazil:0 "Integrate Brazil"
 USA_integrate_greater_brazil_desc:0 "Now that the former territories of the Brazillian Empire are under our control, we can fully integrate them into our Empire."
 USA_pantagonian_push:0 "Pantagonian Push"
 USA_pantagonian_push_desc:0 "If we are to become an empire that spans across both the North and the South of the Americas, we must control the most southern part of South America."
 USA_pantagonian_integration:0 "Pantagonian Integration"
 USA_pantagonian_integration_desc:0 "Now that the we control all of Pantagonia, we can fully integrate them into our Empire."
 USA_strike_guyanas:0 "Grab the Guyanas"
 USA_strike_guyanas_desc:0 "The Guyanas must be ours! We will have to push out the Europeans that control them by force of arms."
 USA_crosser_of_continents:0 "The Crosser of Continents"
 USA_crosser_of_continents_desc:0 "We can now prove that we are the best, strongest nation in the entire world, as we are the Crosser of Continents."
 USA_the_breakaways:0 "Negotiate With the Breakaways"
 USA_the_breakaways_desc:0 "Hawaii and Puerto Rico have broken away from us in the past; a terrible mistake. Thankfully, they now have the opportunity to amend their shortfalls and rejoin us. What will they do otherwise? Resist?"
 USA_retake_stolen_lands:0 "Retake the Stolen Lands"
 USA_retake_stolen_lands_desc:0 "Many years ago, amongst the political turmoil, many of our former colonies were stolen from us by other countries illegally.\nNow, we are out of said turmoil, and can take these lands back."
 USA_islands_of_traitors:0 "The Islands of Traitors"
 USA_islands_of_traitors_desc:0 "Those Philippine traitors left us! Now that we have the chance, we must enact our revenge!"
 USA_protect_philippines:0 "Protect the Philippines"
 USA_protect_philippines_desc:0 "Although they left us, they still have a chance to rejoin us. The Philippines need protection against a mounting Japanese threat..."
 USA_reuinite_ireland:0 "Reunite the Kingdom of Ireland"
 USA_reuinite_ireland_desc:0 "The Kingdom of Ireland is one of our great kingdoms, but we only control the northern part of the island. Let us fix it immediately!"
 USA_retake_dominions:0 "Retake the Dominions"
 USA_retake_dominions_desc:0 "Somehow, the Dominions have broken free. We will have to take them back."
 USA_unite_anglosphere:0 "Unite the Anglosphere!"
 USA_unite_anglosphere_desc:0 "Finally! We rule all of the English-speaking nations in this world, and we can declare a great Imperial Federation!"
 USA_anschluss:0 "Union with Austria"
 USA_anschluss_desc:0 "Austria shouldn't be alone, as their own nation. They were forced to be separate from Germany; a mistake that should've never been made. We shall now fix this!"
 USA_retake_sudetenland:0 "Retake the Sudetenland"
 USA_retake_sudetenland_desc:0 "The Sudetenland is rightful German land that was unjustly stolen from us! We must take it back by force."
 USA_bohemia_slovakia_question:0 "Reorganize Bohemia and Slovakia"
 USA_bohemia_slovakia_question_desc:0 "We must now reorganize the former lands of Czechoslovakia that we now control, making Bohemian and Slovak protectorates."
 USA_retake_the_east:0 "Retake the East"
 USA_retake_the_east_desc:0 "The East was ripped away from us at the end of the Great War. This cannot be allowed to continue, and we must take them back."
 USA_reestablish_monarchies:0 "Reestablish Western Monarchies"
 USA_reestablish_monarchies_desc:0 "We should establish ourselves as a great empire maker and ally maker as we create new monarchy friends."
 USA_blitz_thru_benelux:0 "Blitz Through the Benelux"
 USA_blitz_thru_benelux_desc:0 "The Benelux nations are very weak and they are ripe for the taking. We must take them; they shall serve as a great base and help us invade §Rother nations§!..."
 USA_the_worst_enemy:0 "The Worst Enemy"
 USA_the_worst_enemy_desc:0 "France is an enemy to us; an enemy to all. We will have to destroy them, now that we have the chance."
 USA_iberian_offensive:0 "Iberian Offensive"
 USA_iberian_offensive_desc:0 "Iberia, as of recent, has been a very unstable region. We will have to force them into submission to avoid such problems."
 USA_destroy_italy:0 "Destroy Italy"
 USA_destroy_italy_desc:0 "Italy is a horrible ally who cannot be trusted. They also challenge our influence over the Med. Therefore, we must attack them."
 USA_retake_former_austria_hungary:0 "Retake Habsburg Lands"
 USA_retake_former_austria_hungary_desc:0 "The Balkan lands of the now collapsed Austrio-Hungarian Empire are extremely unstable. We must protect them, to stabilize them."
 USA_destroy_germany:0 "Destroy Germany"
 USA_destroy_germany_desc:0 "Germany is a horrible, horrible, threat. We need to stop them, now!"
 USA_destroy_soviet:0 "Russian Threat"
 USA_destroy_soviet_desc:0 "[SOV.getnameDEF] has been a major threat throughout its existence. However, we now have the chance to stop them! We must subjugate them before they get too powerful..."
 USA_destroy_japan:0 "Threat of the Rising Sun"
 USA_destroy_japan_desc:0 "Japan has been a threat over the Pacific recently. They wish to attack us. Therefore, we must attack them first."
 USA_destroy_britain:0 "Destroy Britain"
 USA_destroy_britain_desc:0 "[ENG.getnamedefcap] has been a historical enemy of ours since our inception. Now they challenge our Imperial dominance. We must crush them."
 USA_expand_chinese_influence:0 "Expand Chinese Influence"
 USA_expand_chinese_influence_desc:0 "China is a vast and unstable land. Now that we have established ourselves as a great power, we can get influence there."
 USA_restore_imperial_lands:0 "Restore Imperial Lands"
 USA_restore_imperial_lands_desc:0 "Now that we control all of the western territories of the German Empire, we can claim their old lands as ours!"
 USA_american_democratic_faction:0 "Form the American Entente"
 USA_american_democratic_faction_desc:0 "The concerns of the British - or any other European powers - are not our own. We must create a grand alliance of only American nations!"
 USA_war_in_pacific:0 "War in the Pacific"
 USA_war_in_pacific_desc:0 "For the first time since the War of 1812, our nation has been attacked by foreign powers. This day shall live in infamy! We shall enforce peace, and ensure that we shall stay independent forever!"
 USA_war_in_europe:0 "War in Europe"
 USA_war_in_europe_desc:0 "Yet again, our nation has been embroiled in a European conflict. Yet, this is not some petty rivalry - some foolish squabble between dimwits... we have been engulfed in the battle of the century, where evil dictators unleash their hatred across the continent! We must not let this happen! Our men must fight onwards - for freedom!"
 USA_operation_torch:0 "Operation Torch"
 USA_operation_torch_desc:0 "The Axis-aligned Vichy French regime currently controls Northern Algeria, a very strategic position. We must take it so we can use it as a base for future operations."
 USA_operation_husky:0 "Operation Husky"
 USA_operation_husky_desc:0 "The days of liberation shall begin. We shall send our armed forces across the Med and into Sicily, there, we will continue our liberation into the rest of Europe!"
 USA_operation_overlord:0 "Operation Overlord"
 USA_operation_overlord_desc:0 "Operation Overlord will be the beginning of the end for the Nazis. We will send hundreds of thousands of men across the English Channel to fight the tryannical powers and end this terrible war once and for all!"
 liberation_of_paris_reward:0 "We, and our §Hallies§! will recieve §Gstability and political power§!"
 USA_liberation_of_paris:0 "Liberation of Paris"
 USA_liberation_of_paris_desc:0 "After years of German occupation, Paris has finally been liberated. We can celebrate this great victory as we march to Berlin!"
 USA_race_to_berlin:0 "Race to Berlin"
 USA_race_to_berlin_desc:0 "Finally, we have made it to Germany proper! Unfortunately, the Russians are too! We can not let them exert any influence over Germany, so we must rush to Berlin before they can!"
 USA_triumph_over_germany:0 "Triumph Over Germany"
 USA_triumph_over_germany_desc:0 "War has ended in Europe as the final German forces have surrendered. What happens next... who knows?"
 USA_fix_pearl_harbor:0 "Fix Pearl Harbor"
 USA_fix_pearl_harbor_desc:0 "We must repair the Pearl Harbor shipyards following [JAP.getnamedef]'s attacks on the area, so our navy can have a powerful hub."
 pearl_harbor_attacked:0 "§HPearl Harbor has been§! §Rattacked§!§H!§!"
 pearl_harbor_attacked_nope:0 "§HPearl Harbor has§! §Gnot been attacked§!§H.§!"
 USA_hawaiian_naval_base:0 "Hawaiian Shipyards"
 USA_hawaiian_naval_base_desc:0 "If we want to expand our naval power projection in the Pacific, we must build more ships. Constructing more shipyards in Hawaii should help us achieve this."
 USA_save_philippines:0 "Save [PHI.getnameDEF]"
 USA_save_philippines_desc:0 "Our ally, [PHI.getnameDEF], is under serious threat. [JAP.getnameDEF], who we are at war with, have serious aspirations for them. We must arm them before the Japanese can take them!"
 filipino_fort:0 "§HWe will build fortifications along the coastline of the Philippines.§!"
 USA_island_hopping:0 "Begin Island Hopping Operations"
 USA_island_hopping_desc:0 "We must now liberate the Pacific islands from Japan, so we can invade them next!"
 USA_foreign_policy:0 "Decide Foreign Policy"
 USA_foreign_policy_desc:0 "The world, in its current state, is a rapidly changing place. We must pick our side, so we can have the best outcome for our country."
 USA_operation_olympic:0 "Operation Olympic"
 USA_operation_olympic_desc:0 "The time is here! We must liberate Japan from their cruel military rule and end this war altogether!"
 USA_triumph_over_japan:0 "Triumph Over Japan"
 USA_triumph_over_japan_desc:0 "War has ended in Asia as the final Japanese forces have surrendered. What happens next... who knows?"
 USA_pass_the_gi_bill:0 "Pass the G.I. Bill"
 USA_pass_the_gi_bill_desc:0 "The Servicemen's Readjustment Act, later to be known as the G.I. Bill, is a bill that will assist veterans. It will create several programs that will help them post-military service."
 USA_ask_to_be_leader:0 "Ask to Lead the Faction"
 USA_ask_to_be_leader_desc:0 "We should ask our faction leader if we can lead the faction instead."
 USA_leader_of_free_world:0 "The Leader of the Free World"
 USA_leader_of_free_world_desc:0 "We have truly shown to be the leader of the free world! We need to mark our place, and defend democracy and liberty worldwide!"
 USA_form_nato_focus:0 "The North Atlantic Treaty Organization"
 USA_form_nato_focus_desc:0 "We must create a great alliance to protect us and the democratic powers of Europe from the evils of communism. NATO can help protect these interests."
 USA_take_down_franco_spain:0 "Take Down Francoist Spain"
 USA_take_down_franco_spain_desc:0 "Spain's current government is evil! We must take them down, even if they could be a possible ally against communism."
 USA_an_ally_against_communism:0 "Ally Against Communism"
 USA_an_ally_against_communism_desc:0 "We must take any possible allies that we can get. Communism is growing, and we must find allies in any places that we can - even if they would seem rather unlikely..."
 USA_invite_turkish:0 "Invite the Turks"
 USA_invite_turkish_desc:0 "The Turkish, bordering the Soviets, have a very good reason to be worried of them. They seem to want to join our alliance, and we will gladly accept them."
 USA_invite_portugal:0 "Invite the Portuguese"
 USA_invite_portugal_desc:0 "The Portuguese, also worried of the advances of communism, and having historical allies in our alliance, seek to join. We won't deny them."
 USA_the_hot_war:0 "The Hot War"
 USA_the_hot_war_desc:0 "No matter the consequences, we must take down the evil superpower of communism once and for all!"
 USA_the_cold_war:0 "The Cold War"
 USA_the_cold_war_desc:0 "As much as we, and the world, despise the USSR, it is simply unrealistic to take on a full-on war with them! We will fight a "cold war" where we only fight proxy wars..."
 USA_only_one:0 "There Can Only Be One"
 USA_only_one_desc:0 "There is currently a problem of there being two states that claim to be China, one communist and one not. We need to solve this issue, and ensure there is only one that is capitalist!"
 USA_more_special_weapons:0 "Produce More Nuclear Weapons"
 USA_more_special_weapons_desc:0 "We need to produce more nuclear weapons, so we have a major advantage over our enemies in any future conflicts."
 USA_the_american_economy:0 "The American Economy"
 USA_the_american_economy_desc:0 "Ever since our recovery from the Great Depression, we should focus on other major parts of our economy."
 USA_follow_legacy_of_the_new_deal:0 "Follow the Legacy of the New Deal"
 USA_follow_legacy_of_the_new_deal_desc:0 "By this point, FDR's once new New Deal policies are cornerstone in our economic system. Let us continue his efforts."
 USA_the_same_old_deck:0 "The Same Old Deck"
 USA_the_same_old_deck_desc:0 "FDR's New Deal policies have caused more harm than good. Therefore, we should return to the old ways, before his administration."
 USA_expand_tva:0 "Expand the TVA"
 USA_expand_tva_desc:0 "The TVA has greatly helped the people of the Tennessee Valley in the wake of the Great Depression. We should continue its efforts."
 USA_institute_single_payer_healthcare:0 "Establish Universal Healthcare"
 USA_institute_single_payer_healthcare_desc:0 "No longer shall the less fortunate of our nation be locked away from healthcare, they must be able to have the same treatment as others!"
 USA_current_healthcare_system:0 "Stick With the Current System"
 USA_current_healthcare_system_desc:0 "There is no need for rediculous reforms. We must stick with the current system!"
 USA_FDIC:0 "Establish the FDIC"
 USA_FDIC_desc:0 "The Federal Deposit Insurance Corporation will help insure bank deposits and supervise them."
 USA_PWA:0 "Establish the PWA"
 USA_PWA_desc:0 "The Public Works Administration shall give jobs to the poor, and help with the economy."
 USA_internal_development:0 "Internal Development"
 USA_internal_development_desc:0 "We should begin on development on our states, so we can improve their infrastructure and economies."
 USA_develop_capital_region:0 "Capital Region Development"
 USA_develop_capital_region_desc:0 "As part of our efforts to build up parts of our country, we should invest in the capital region."
 USA_develop_new_england:0 "New England Development"
 USA_develop_new_england_desc:0 "As part of our efforts to build up parts of our country, we should invest in New England."
 USA_develop_tri_state:0 "Tri-State Development"
 USA_develop_tri_state_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Tri-State area of New York City."
 USA_develop_southeast:0 "Southeast Development"
 USA_develop_southeast_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Southeast."
 USA_develop_southwest:0 "Southwest Development"
 USA_develop_southwest_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Southwest."
 USA_develop_deep_south:0 "Deep South Development"
 USA_develop_deep_south_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Deep South."
 USA_develop_cascadia:0 "Cascadian Development"
 USA_develop_cascadia_desc:0 "As part of our efforts to build up parts of our country, we should invest in Cascadia."
 USA_develop_great_lakes:0 "Great Lakes Development"
 USA_develop_great_lakes_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Great Lakes states."
 USA_develop_greater_texas:0 "Greater Texas Development"
 USA_develop_greater_texas_desc:0 "As part of our efforts to build up parts of our country, we should invest in Greater Texas."
 USA_develop_great_plains:0 "Great Plains Development"
 USA_develop_great_plains_desc:0 "As part of our efforts to build up parts of our country, we should invest in the Great Plains states."
 USA_develop_territories:0 "Non-Contiguous Development"
 USA_develop_territories_desc:0 "As part of our efforts to build up parts of our country, we should invest in the non-contiguous lands."
 USA_establish_interstate_highway_system:0 "Establish the Interstate Highway System"
 USA_establish_interstate_highway_system_desc:0 "Back in 1919, a small army expedition including General Dwight D. Eisenhower traveled across the country, stuggling across the 62-day journey. He would eventually come up with a great plan to create a national highway system, inspired by the Autobahn that would be military grade, as well as connecting our large country and improving our economy."
 USA_the_rise_of_the_sons_of_liberty:0 "The Rise of the Sons of Liberty"
 USA_the_rise_of_the_sons_of_liberty_desc:0 "A new day has arisen. We have finally kicked out those monarchist traitors and established a new republic, free of tyranny, and full of greatness."
 USA_fate_of_the_royals:0 "Fate of the Royals"
 USA_fate_of_the_royals_desc:0 "We currently have the royals imprisoned, but that's only a temporary measure. We must decide what to permanently do with them."
 USA_enshrine_the_second_amendment:0 "Enshrine the Second Amendment"
 USA_enshrine_the_second_amendment_desc:0 "While the old constitution is dead, the ideas are not. The Second Amendment guarantees every citizens' right to bear arms, and we shall follow that idea."
 USA_reinforce_free_trade:0 "Reinforce Free Trade"
 USA_reinforce_free_trade_desc:0 "As staunch Libertarians, we must promote our free trade policies. This policy will certainly help our economy, and will definitely help secure our position as the world's factory."
 USA_state_rights:0 "States' Rights"
 USA_state_rights_desc:0 "To truly allow for our Libertarian ideals, we must whittle away most of what power the federal government has over the states, in preparation for our future ambitions..."
 USA_fate_of_the_democratic_republicans:0 "Fate of the Democratic-Republicans"
 USA_fate_of_the_democratic_republicans_desc:0 "It is time to decide our policy of the Democratic-Republicans. While they have some promising members, many are just some statist crooks! It will be difficult, but we will have to make a decision..."
 USA_future_of_the_sons:0 "The Future of the Sons"
 USA_future_of_the_sons_desc:0 "To secure our great country, we must set out the future for the group that guides the states, the Sons of Liberty."
 USA_the_non_aggression_principle:0 "The Non-Aggression Principle"
 USA_the_non_aggression_principle_desc:0 "Our small government shall follow by one maxim: as long as your actions don't harm others, we don't care.\nThis is the simplicity of the great Non-Aggression Principle. We shall stand by it, and enshrine it into our new constitution."
 USA_unite_against_totalitarianism:0 "Unite Against Totalitarianism"
 USA_unite_against_totalitarianism_desc:0 "While it may be true that that we have major ideological differences with the other democracies of this world, it is even more apparent that the evil totalitarian regimes will continue to expand and oppress more people if we don't work together to stop them."
 USA_freedom_at_all_costs:0 "Freedom at All Costs"
 USA_freedom_at_all_costs_desc:0 "The peoples of this world cannot afford to be oppressed any longer. Therefore, we must start a worldwide revolution that will overthrow evil authoritarian governments and establish new, free ones."
 USA_shatter_communism:0 "Crush Communism"
 USA_shatter_communism_desc:0 "Communism is the ideological enemy of libertarianism. Therefore, it is one of the most oppressive, evil ideology that mankind has ever seen. We must destroy it at all costs!"
 USA_shatter_fascism:0 "Destroy Fascism"
 USA_shatter_fascism_desc:0 "Fascism, like communism, is evil and oppressive. In addition, they dare to pretend that they have capitalist elements, and hate communism, but we know this isn't true. All they care about is the state and not the people! They must end!"
 USA_shatter_autocrats:0 "Annhiliate the Autocrats"
 USA_shatter_autocrats_desc:0 "Before the days of extremist ideologies, there were the days of foolish monarchies. They cared little about the people and only cared about the wealth that they didn't even earn through fair business! They must be taken down, too."
 USA_topple_fake_democracies:0 "Topple the Fake Democracies"
 USA_topple_fake_democracies_desc:0 "So many countries claim that they are beacons of liberty; democratic states that have governments that serve the people. This is a lie that has been told for much time. However, we know that this isn't true. All that these governments care about is taxing their citizens to death and government power. We will enlighten them with the greatness of libertarianism, by force."
 USA_spread_liberty:0 "Spread Liberty"
 USA_spread_liberty_desc:0 "Freedom knows no borders. We must expand the greatness of liberty so every citizen of the Earth can have it."
 USA_prop_up_free_states:0 "Prop Up Free States"
 USA_prop_up_free_states_desc:0 "Now, we must establish free states accross the world so we can slowly integrate them into our great, free nation!"
 USA_a_free_world:0 "A Free World"
 USA_a_free_world_desc:0 "We have truly asserted ourselves as the leader of the free world, and we can now assert ourselves as the protector of democracy!"
 prop_up_freestate_tooltip:0 "Unlocks Decision: §HSet up Free State§!"
 integrate_freestate_tooltip:0 "We will now be able to §Hintegrate§! conquered territories as well as other §HFree States§!."
 USA_united_free_states:0 "Form the United Free States"
 USA_united_free_states_desc:0 "We now stand as the global leader of the libertarian movement, and we must now establish one multinational association of free states!"
 USA_step_down:0 "Step Down"
 USA_step_down_desc:0 ""Ladies and Gentlemen of these United States, it is time that I step down from position of president. It is clear that I have overstayed my welcome, and that we should find a new leader for our great republic. Thank you for your service and loyalty to our nation, and I hope for a bright future.""
 USA_garner_forever:0 "Garner Forever"
 USA_garner_forever_desc:0 "Garner has no need to step down, he is a great leader and should continue to be so!"
 USA_start_the_second_usa_mex_war:0 "The Second Mexican-American War"
 USA_start_the_second_usa_mex_war_desc:0 "Our war with Mexico nearly a century ago was one of disappointment. Even though we even captured their capital, Mexico City, we captured a meager amount of land in comparison. Now, it is time to finish the job."
 USA_the_central_american_republics:0 "The Central American Republics"
 USA_the_central_american_republics_desc:0 "Central America is key in securing our dominance over the "American Mediterranean". Therefore, we must take it for ourselves."
 USA_the_caribbean:0 "The Caribbean Republics"
 USA_the_caribbean_desc:0 "Taking the Caribbean Republics are key in securing our dominance over the "American Mediterranean". Therefore, we must take it for ourselves."
 USA_invade_north_of_the_south:0 "Invade Northern South America"
 USA_invade_north_of_the_south_desc:0 "The Northern South American coast is key in securing our dominance over the "American Mediterranean". Therefore, we must take it for ourselves."
 USA_solidify_the_military_government:0 "Solidify the Military Government"
 USA_solidify_the_military_government_desc:0 "Now that we have decided the leadership question, we can truly solidify the military government."
 USA_set_up_military_governments:0 "Set Up Military Governments"
 USA_set_up_military_governments_desc:0 "Now that we have established a great presence in this world, we should establish our military in our subjects."
 USA_he_has_returned:0 "He Has Returned..."
 USA_he_has_returned_desc:0 "While those traitors have taken the Vaterland that hasn't stopped us from holding our ground! No, we will fight back and retake our homeland!"
 USA_retake_our_homeland:0 "Retake Our Homeland"
 USA_retake_our_homeland_desc:0 "Now is the time to strike; we must retake the Vaterland!"
 USA_back_home:0 "Vaterland Restored"
 USA_back_home_desc:0 "Despite the challenges that we have faced, we have finally retaken our glorious Vaterland!"
 USA_north_american_supremacy:0 "Declare North American Supremacy"
 USA_north_american_supremacy_desc:0 "We have proved ourselves to be the supreme ruler of this continent, North America. Let us lead a period of greatness for our nation!"
 USA_threat_to_trade:0 "The Threat to Trade"
 USA_threat_to_trade_desc:0 "Germany's constant warring has done no good for our trade partners! We will have to stop them ourselves, unless we want to keep losing money..."
 USA_take_over_the_hegemon_of_resource:0 "The Hegemon of Resources"
 USA_take_over_the_hegemon_of_resource_desc:0 "[ENG.getnameDEF] has a bountiful number of resources that we could use for our war machine. We will have to sieze it ourselves..."
 USA_beverages_unite:0 "Coca-Cola Abroad"
 USA_beverages_unite_desc:0 "We need to think bigger.\n\nWhile it is undoubtedly true that our company has seen great successes here in America, who says we can't elsewhere? The ideas of the former republic may be dead, but manifest our destiny we shall."
 USA_animated_propoganda:0 "Animated Propaganda"
 USA_animated_propoganda_desc:0 "Walt has great new plans for the company. He is calling for us to create new animated propaganda films. They will be easy for everyone to understand, and can help get the message across."
 USA_liberate_oil_lol:0 "Oil, Oil Everywhere!"
 USA_liberate_oil_lol_desc:0 "Our government is literally the military so you know we have to liberate oil."
 USA_restart_civilian_government:0 "Restart Civilian Government"
 USA_restart_civilian_government_desc:0 "The military government has served its time well, but we now need a return to a civilian government. It is only right for the people."
 USA_secure_rubber_imports:0 "Secure the Rubber Imports"
 USA_secure_rubber_imports_desc:0 "As a country foucsed on manufacturing vehicles, particularly cars, we should aim to take the lands that produce rubber."
 USA_wmds:0 "Weapons of Mass Destruction"
 USA_wmds_desc:0 "The only way we can ever hope to quickly end wars is by developing highly advanced and destructive weaponry."
 USA_organize_the_america_first_movement:0 "Reorganize the America First Movement"
 USA_organize_the_america_first_movement_desc:0 "The America First Movement, which has been dedicated to the continued neutrality of [ROOT.getnamedef], remains strong but perhaps disorganized. We should organize it into an official committee, and nominate a leader."
 USA_af_neutrality_act:0 "America First Neutrality Act"
 USA_af_neutrality_act_desc:0 "Foreign wars tend to be fought for the interests of nations in far away places, with blood spilled by our men. We were elected on a promise to keep ourselves out of such conflicts, and our policy shall not differ. We will sign an act to officially declare our neutrality in any future conflicts, ensuring our sons aren't lost in another pointless war."
 USA_armed_neutrality:0 "Armed Neutrality"
 USA_armed_neutrality_desc:0 "To continue our neutrality, we must stay strong, just like the nation of [SWI.getnameDEF]. Therefore, we will begin to build up our military industry to ensure that we stay strong to ensure no-one attakcs us!"
 USA_security_over_the_americas:0 "Security Over the Americas"
 USA_security_over_the_americas_desc:0 "With tensions continuing to rise around the world, we must come to realize the possibility of war coming to our continent. With those belligerent [ENG.getadjective] and their bootlickers surrounding us, we must increase our security of the contintent, and perhaps consider the necessity to ensure our security by force."
 USA_peace_at_home:0 "Peace at Home"
 USA_peace_at_home_desc:0 "We will not give into the warmongers! No matter what, we will have our peace, and no nation will ever attack us!\n\n... Right?"
 USA_protrect_canada:0 "Protect [CAN.getnamedef]"
 USA_protrect_canada_desc:0 "[CAN.getnamedefcap] has long been our northern neighbor, and many even see them as a brother to us. However, they are still aligned to [ENG.getnamedef], which has been keen on getting [CAN.getnamedef] involved in their conflicts. We cannot allow this situation to continue, and must ensure that they are securely in our hands."
 USA_operation_paperclip:0 "Operation Paperclip"
 USA_operation_paperclip_desc:0 "The fall of the previous [GER.getadjective] government leaves many bright minds in precarious situations. In exchange for excusing them of their possible crimes, they will serve positions in our own R&D."
 USA_enemies_in_the_south:0 "Enemies in the South"
 USA_enemies_in_the_south_desc:0 "Lying in [MEX.getnamedef] is a home for revolutionaries and cartels, constantly threatening the well-being of not only their, but also our nation. We must ensure that they are aligned to us, so we can prevent any future war - government sanctioned or not."
 USA_restore_the_occupation_zones:0 "Restore the Occupation Zones"
 USA_restore_the_occupation_zones_desc:0 "Throughout the past few decades, Central America and the Caribbean have had a significant amount of instability in their regions. This has led to us needing to occupy them. These days, little has seemed to have changed. Therefore, for the sake of our own national security, we must occupy them ourselves."
 USA_protrect_greenland:0 "Protect Greenland"
 USA_protrect_greenland_desc:0 "We have a much smaller presence on our northern flank and Greenland could serve as the perfect point for an enemy to attack us from. Currently, its owner is in a state of war so now could be our chance to sieze the island and build it up to ensure our security."
 USA_civilian_development:0 "Civilian Production Act"
 USA_civilian_development_desc:0 "With the Great Depression rid of, we must keep our people's minds away from military intervention. By developing our civilian industries, we can continue our neutral stance."
 USA_deterrence:0 "Policy of Deterrence"
 USA_deterrence_desc:0 "With wars arising elsewhere, we must show the world that we are not one to be reckoned with. We shall implement deterrence policies to ensure that we shall never be attacked, no matter what surrounds us."
 USA_criminalize_socialism:0 "Criminalize Socialism"
 USA_criminalize_socialism_desc:0 "The House Committee on Un-American Activities has done a fantastic job of preventing the spread of revolutionary socialist ideas in our country, but we should go a step further. By making even the idea of being socialist illegal, we will be able to continue to ensure the safety of American ideals."
 USA_stricter_immigration_quotas:0 "Stricter Immigration Quotas"
 USA_stricter_immigration_quotas_desc:0 "With the Chinese Exclusion Acts having proven successful, we should expand them to all countries. This will certainly tank our population growth, but will be necessary for the preservation of [USA.getnamedef]."
 USA_just_as_the_founding_fathers_intended:0 "Just as the Founding Fathers Intended"
 USA_just_as_the_founding_fathers_intended_desc:0 "None who have founded our nation would have ever wanted us to be fighting wars for these European powers, and be somewhat of a "global police". With our recent policies, we have thankfully been able to revert this change of course they never wished for, and restored a truly neutral foreign policy."
 USA_supremacy_over_the_continents:0 "Supremacy Over the Continents"
 USA_supremacy_over_the_continents_desc:0 "We stand at the position to conquer the entire double-continent of North and South America, and doing so would ensure our security and that no other Great Power would mess with us. It's in our name, after all."
 USA_necessity_for_alliances:0 "Necessity for Alliances"
 USA_necessity_for_alliances_desc:0 "It appears that, even though we have tried our hardest to maintain our neutrality for some time, securing an alliance may be necessary. This of course will anger our supporters, but realistically what else are we supposed to do?"
 USA_neutral_forever:0 "Neutrality Forever"
 USA_neutral_forever_desc:0 "The world may be a flame, but it does not change the fact that we do not concern ourselves with the affairs of other nations. America shall alaways come first!"
 USA_common_cause_with_axis:0 "Common Cause with the Axis"
 USA_common_cause_with_axis_desc:0 "While having to Unfortunately pick a side in this conflict, it is obvious that the belligerent Axis powers will stand on top at the end. We must align with them, to protect our interests."
 USA_common_cause_with_allies:0 "Common Cause with the Allies"
 USA_common_cause_with_allies_desc:0 "While having to Unfortunately pick a side in this conflict, it is obvious that the Allies, ever defensive of the independence of their members. We must align with them, to ensure that we have protection against the ever-expanding Axis."
 USA_neutral_entente:0 "Form the United Neutral States"
 USA_neutral_entente_desc:0 "Many nations in Europe have found ways to stay completely out of wars within this century, and their efforts are honorable. To collectively defend our interests in neutrality, we will create a sort of alliance."
 USA_america_first_forever:0 "America First Forever"
 USA_america_first_forever_desc:0 "We will not even consider entering an alliance with other nations, as that would be a violation of our ideas! America First Forever!"
 USA_eastern_menace:0 "The Eastern Threat"
 USA_eastern_menace_desc:0 "[JAP.getnamedefcap] is the only country that poses a real threat to us, as they seek to conquer our [PHI.getadjective] protectorate and our Pacific territories. We shall strike them first, to ensure that such threats are subdued."
 USA_presidential_powers_act:0 "Presidential Powers Act"
 USA_presidential_powers_act_desc:0 "Our Great President Charles Lindbergh has long been suspected to be a national socialist, considering his ties with the [GER.getadjective] Fuhrer, Adolf Hitler. Instead of trying to suppress these claims, he should embrace them, and strengthen his grasp over the state to become a full dictator."
 USA_the_chief:0 "The Chief"
 USA_the_chief_desc:0 "Inspired by the fascist dictatorships of [GER.getnamedef] and [ITA.getnamedef], we shall institute a new title for our great leader, The Chief. He shall bring our nation into a new era of prosperity!"
 USA_appoint_loyal_governors:0 "Appoint Loyal Governors"
 USA_appoint_loyal_governors_desc:0 "The governors of the states currently have been protesting the military government, as they feel we are not being democratic. This will have to change, so we will have to implement military-appointed governors. Sure, this won't be very popular with the people, but some things must be done."


 USM_generic_focus:0 "National Focus"
 USM_army_effort:0 "Army Effort"
 USM_army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
 USM_equipment_effort:0 "Equipment Effort"
 USM_equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
 USM_motorization_effort:0 "Motorization Effort"
 USM_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
 USM_doctrine_effort:0 "Doctrine Effort"
 USM_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 USM_equipment_effort_2:0 "Equipment Effort II"
 USM_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 USM_mechanization_effort:0 "Mechanization Effort"
 USM_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
 USM_doctrine_effort_2:0 "Doctrine Effort II"
 USM_doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 USM_equipment_effort_3:0 "Equipment Effort III"
 USM_equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
 USM_armor_effort:0 "Armor Effort"
 USM_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
 USM_special_forces:0 "Special Forces"
 USM_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 USM_aviation_effort:0 "Aviation Effort"
 USM_aviation_effort_tt:0 "Not enough building slots for §YAir Base§!"
 USM_aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
 USM_fighter_focus:0 "Fighter Focus"
 USM_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
 USM_bomber_focus:0 "Bomber Focus"
 USM_bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
 USM_aviation_effort_2:0 "Aviation Effort II"
 USM_aviation_effort_2_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
 USM_CAS_effort:0 "CAS Effort"
 USM_CAS_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
 USM_rocket_effort:0 "Rocket Effort"
 USM_rocket_effort_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
 USM_NAV_effort:0 "NAV Effort"
 USM_NAV_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
 USM_naval_effort:0 "Naval Effort"
 USM_naval_effort_tt:0 "Not enough building slots for §YNaval Dockyards§!"
 USM_naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 USM_GER_naval_effort2:0 "Expand Dockyard Facilities"
 USM_GER_naval_effort2_desc:0 "To truly rebuild a navy worthy of note, we must greatly expand our shipbuilding capacity."
 USM_GER_naval_effort2_tt: "Builds §Y2 Naval Dockyards§! in §Y2§! coastal states currently controlled by §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 USM_flexible_navy:0 "Flexible Navy"
 USM_flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
 USM_large_navy:0 "Large Navy"
 USM_large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
 USM_submarine_effort:0 "Submarine Effort"
 USM_submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
 USM_cruiser_effort:0 "Cruiser Effort"
 USM_cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
 USM_destroyer_effort:0 "Destroyer Effort"
 USM_destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
 USM_capital_ships_effort:0 "Capital Ship Effort"
 USM_capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
 USM_industrial_effort:0 "Industrial Effort"
 USM_industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 USM_industrial_effort_2:0 "Industrial Effort II"
 USM_industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 USM_construction_effort:0 "Construction Effort"
 USM_construction_effort_tt:0 "Not enough building slots for §YCivilian Factories§!"
 USM_construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 USM_production_effort:0 "Armament Effort"
 USM_production_effort_tt:0 "Not enough building slots for §YMilitary Factory§!"
 USM_production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 USM_construction_effort_2:0 "Construction Effort II"
 USM_construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 USM_production_effort_2:0 "Armament Effort II"
 USM_production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 USM_production_effort_3:0 "Armament Effort III"
 USM_production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 USM_infrastructure_effort:0 "Infrastructure Effort"
 USM_infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
 USM_infrastructure_effort_tt:0 "Not enough building slots for §YInfrastructure§!"
 USM_synth_oil_effort_tt:0 "Not enough building slots for §YSynthetic Refinery§!"
 USM_infrastructure_effort_2:0 "Infrastructure Effort II"
 USM_infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 USM_construction_effort_3:0 "Construction Effort III"
 USM_construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 USM_nuclear_effort:0 "Nuclear Effort"
 USM_nuclear_effort_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
 USM_extra_tech_slot:0 "Extra Research Slot"
 USM_extra_tech_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 USM_extra_tech_slot_2:0 "Extra Research Slot II"
 USM_extra_tech_slot_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
 USM_technology_sharing:0 "Technology Sharing"
 USM_technology_sharing_desc:0 "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
 USM_secret_weapons:0 "Secret Weapons"
 USM_secret_weapons_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
 USM_the_travelling_crown:0 "The Travelling Crown"
 USM_the_travelling_crown_desc:0 "All the time, our royal family keeps moving from place to place! We must bring this to an end, and assert our dominance over this country, then [USA.getnamedef]!"
 USM_excavation_effort:0 "Excavation Efforts"
 USM_excavation_effort_desc:0 "We have a large natural wealth which we can exploit by developing proper methods. Let us divert some of our resources to do this."
 USM_internal_security:0 "Internal Security"
 USM_internal_security_desc:0 "We must be sure to assert our control over our state, given that we are a foreign government."
 USM_royal_expansions:0 "Royal Expansions"
 USM_royal_expansions_desc:0 "We must expand our lands as quickly as possible to secure our power."
 USM_our_own_alliance:0 "Form our own Alliance"
 USM_our_own_alliance_desc:0 "We should seek to form our own alliance, to secure our interests."
 USM_attack_our_neighbours:0 "Attack Our Neigbors"
 USM_attack_our_neighbours_desc:0 "We must seek to expand our borders by attacking a neighboring country, then we can secure their lands and make them ours!"
 USM_take_back_the_homeland:0 "Take Back the Homeland"
 USM_take_back_the_homeland_desc:0 "Those damnned traitors overthrew our great monarch! We must enact our revenge on them, now!"
 USM_a_new_constitution:0 "A New Constitution"
 USM_a_new_constitution_desc:0 "Let's learn from the mistakes of the past! Our nation should have a constitution, that will be a great compromise and hopefully appease a lot of people."
 USM_right_to_rule:0 "Right to Rule"
 USM_right_to_rule_desc:0 "We must stand on our principled ideas: it is the monarchy, and the monarchy alone that will rule this nation! Not some stupid constitution..."

 USA_historical_politics:0 "Politics: Historical"
 USA_alternate_politics:0 "Politics: Gridlock"
 USA_alternate_politics_2:0 "Politics: America First"