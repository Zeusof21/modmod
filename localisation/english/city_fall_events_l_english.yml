l_english:
 city_fall_news.8.t:0 "Fall of Bordeaux"
 city_fall_news.8.d:0 "Bordeaux, known for its fascinating history and cultural significance for all of France, has fallen to [new_controller.GetAdjective] troops. While the [old_controller.GetAdjective] army mounted a strong defense, the [new_controller.GetAdjective] army advanced along the Garonne river and captured Port de la Lune, the key of the city.\n\nReports from Bordeaux itself indicate that most of the cultural architecture, including the Place de la Bourse and the Grand Théâtre, has suffered little to no damage. However, the city's harbor has been practically destroyed after intense battles for it, and the new [new_controller.GetAdjective] administration has already ordered local workers to repair it for future use as a naval base."
 city_fall_news.8.a:0 "Oh no..."
 city_fall_news.8.b:0 "Great!"
 city_fall_news.8.c:0 "The war is taking an unexpected turn."
 city_fall_news.9.t:0 "Fall of Marseille"
 city_fall_news.9.d:0 "The battle of Marseille has recently ended with a decisive [new_controller.GetAdjective] victory. After capturing the center of the city and its naval facilities, [new_controller.GetAdjective] troops moved to secure the suburbs and clear out pockets of enemy resistance up to Aix-en-Provence. Before retreating, the [old_controller.GetAdjective] army managed to blow up the Marseille Transporter Bridge to slow down the [new_controller.GetAdjective] advance.\n\nTense urban warfare has left its mark on the city's infrastructure, as the Old Port of Marseille bears the scars of the battle, along with the city's Old Town. Nevertheless, [new_controller.GetNameDEF] is now in full control."
 city_fall_news.9.a:0 "Unfortunate..."
 city_fall_news.9.b:0 "Great news!"
 city_fall_news.9.c:0 "A major victory for [new_controller.GetNameDEF]."
  city_fall_news.56.t:0 "Fall of Tunis"
 city_fall_news.56.d:0 "Today, the battle for Tunis has ended with a decisive victory for [new_controller.GetNameDEF]. While it was a tough fight, [new_controller.GetAdjective] forces managed to outrun the [old_controller.GetAdjective] troops stationed in the area and trap them. After this, [new_controller.GetAdjective] units entered the city and secured its deep water port, thus securing their victory.\n\nAfter the capture of Tunis by [new_controller.GetAdjective] forces, they held a victory parade where [new_controller.GetAdjective] soldiers marched along Avenue Gambetta, with locals curiously watching them."
 city_fall_news.56.a:0 "Unfortunate."
 city_fall_news.56.b:0 "The Tunisian Campaign is a success!"
 city_fall_news.56.c:0 "Interesting."
 city_fall_news.57.t:0 "Fall of Dakar"
 city_fall_news.57.d:0 "Today, [new_controller.GetAdjective] troops have entered the West African city of Dakar. After a short battle for it, during which [old_controller.GetAdjective] troops tried to defend the city, as well as the Cap-Vert peninsula, [new_controller.GetAdjective] troops secured the city and its small port.\n\nIn Africa, Dakar is the westermost city and most important port on its Atlantic coast, the gate to West Africa, which means that [new_controller.GetNameDEF] now has the most important base of operations in the region."
 city_fall_news.57.a:0 "Unfortunate."
 city_fall_news.57.b:0 "Senegal is in our hands!"
 city_fall_news.57.c:0 "[new_controller.GetNameDEFCap] has a gateway to West Africa now."
  city_fall_news.65.t:0 "Fall of Damascus"
 city_fall_news.65.d:0 "After heavy fighting, the city of Damascus has fallen to [new_controller.GetAdjective] troops. After entering the outskirts of the city, they encountered [old_controller.GetAdjective] forces stationed there, which tried to launch a counterattack, but the [new_controller.GetAdjective] units held firm. After defending their position, they advanced forward and took control of the stone forts overlooking Damascus, with particularly brutal fights in the Mazzeh region of the city and near the Barada river.\n\nWith the Syrian capital, as well as hights surrounding it, in [new_controller.GetAdjective] hands, their positions in the Middle East are heavily strengthened."
 city_fall_news.65.a:0 "Damn it!"
 city_fall_news.65.b:0 "Great!"
 city_fall_news.65.c:0 "What consequences will this have for the Middle East?"
  city_fall_news.75.t:0 "Fall of Hanoi"
 city_fall_news.75.d:0 "Recent reports from Hanoi have now confirmed that the city has fallen to advancing [new_controller.GetAdjective] troops. As per the [new_controller.GetAdjective] battle plans, they tried to envelop the city center by taking control of its outskirts, which forced the [old_controller.GetAdjective] garrison to retreat.\n\nWith the most important city in Indochina in [new_controller.GetAdjective] hands, positions of [new_controller.GetNameDEF] in the region are now heavily strengthened, while [old_controller.GetNameDEF] has suffered a major defeat."
 city_fall_news.75.a:0 "We will reclaim it!"
 city_fall_news.75.b:0 "Great!"
 city_fall_news.75.c:0 "[new_controller.GetNameDEFCap] gets a foothold in Indochina."