 GE_TARGET_STATE_FOUND:0 "§GTarget Acquired§!"
 GE_TARGET_STATE_NONE:0 "§RNone Selected§!"
 GE_BUY_STATE_TT:0 "§YSend Purchase Offer§!"
 GE_BUY_STATE_TT_DELAYED:0 "Send a diplomatic offer to the owner of the selected state. If they accept, you will pay your proposed offer of §G[?global.ge_state_offer_price|0]$§! and annex the state. If they decline, your money will be refunded."
 
 ge_market.1.t:0 "Territory Purchase Offer"
 ge_market.1.d:0 "A foreign nation has approached us with a lucrative offer. They wish to purchase one of our states for §G[?global.ge_state_offer_price|0]$§!.\n\nDo we accept this deal and forfeit the land?"
 ge_market.1.a:0 "Accept the deal. We need the money."
 ge_market.1.b:0 "Refuse! Our land is not for sale."
 
 ge_market.2.t:0 "Offer Accepted!"
 ge_market.2.d:0 "Excellent news! The foreign government has accepted our generous offer. The state has been formally transferred to our administration."
 ge_market.2.a:0 "A great addition to our nation."
 
 ge_market.3.t:0 "Offer Declined"
 ge_market.3.d:0 "The foreign government has formally rejected our offer to purchase their territory. They stated that their sovereign land is not for sale.\n\nOur initial payment of §G[?global.ge_state_offer_price|0]$§! has been fully refunded."
 ge_market.3.a:0 "Fools. We will take it by force then."

