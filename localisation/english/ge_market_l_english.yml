 GE_MIL_TOOLTIP_DELAYED:0 "Finance the construction of a military factory completely hidden from the map (Off-map). It cannot be bombed or captured by enemies."
 GE_CIV_TOOLTIP:0 "§YBuild Hidden Civilian Factory§!"
 GE_CIV_TOOLTIP_DELAYED:0 "Finance the construction of a civilian factory completely hidden from the map (Off-map). It will boost your economy safely."

 # ==========================================
 # SAVAŞ GANİMETLERİ EVENTLERİ
 # ==========================================
 ge_market.4.t:0 "War Booty: [ge_loser_country.GetNameDefCap]"
 ge_market.4.d:0 "With the complete capitulation and annexation of [ge_loser_country.GetNameDef], our forces have stormed their capital and seized the national treasury.\n\nAll offshore accounts, gold reserves, and black market funds belonging to the former government have been confiscated.\n\nTotal funds secured: §G[?ge_latest_loot|0]$§!"
 ge_market.4.a:0 "To the victor go the spoils!"
 
 ge_market.5.t:0 "War Reparations: [ge_loser_country.GetNameDefCap]"
 ge_market.5.d:0 "As part of the restructuring of [ge_loser_country.GetNameDef], the newly installed puppet administration has agreed to pay substantial war reparations to our government.\n\nWe have liquidated a large portion of their national reserves and transferred them to our own treasury.\n\nTotal funds secured: §G[?ge_latest_loot|0]$§!"
 ge_market.5.a:0 "They will pay for their crimes."