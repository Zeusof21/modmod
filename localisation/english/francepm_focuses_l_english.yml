l_english:
 FRA_dirigisme_alt:0 "Grow the Arms Industry"
 FRA_dirigisme_alt_desc:0 "With international tensions rising, France must be ready to take measures to rearm the nation. Additionally, these measures may allow us to rejuvinate our economy by growing the arms industry."
 FRA_ratify_the_vienot_accords:0 "Ratify the Viénot Accords"
 FRA_ratify_the_vienot_accords_desc:0 "The people of Syria, being promised independence have grown restless. In order to appease them and avoid an unneccessary colonial conflict, we shall allow them independence, with their eternal friendship as a condition, of course."
 FPM_syrian_revolt_happened:0 "The §YSyrian Revolt§! has not happened."
 FRA_request_emergency_powers:0 "Request Emergency Powers"
 FRA_request_emergency_powers_desc:0 "To resolve this economic crisis, we must take more drastic measures. The current state of affairs cannot stand, so we must take it upon ourselves to request emergency powers to fix the economy."
 FRA_end_capital_flight:0 "End Capital Flight"
 FRA_end_capital_flight_desc:0 "Ever since the Socialists took power, our country has been plagued with capital flight. No longer! We shall invite foreign companies and our old companies back into our nation now that we have repealed the strangulating socialist legislation."
 FRA_promote_the_free_market:0 "Promote the Free Market"
 FRA_promote_the_free_market_desc:0 "The free market is essential to any successful economy. In recent times, the socialists have smothered it with unneccessary bureaucracy and regulations. We shall take the opposite route, and allow for the free market to flourish without government interference."
 FRA_constitutional_reform:0 "Constitutional Reform"
 FRA_constitutional_reform_desc:0 "Just a few years ago, Prime Minister Doumergue tried to revise the constitution to fix the most glaring issues of the republic. While he failed, we should take up his cause and try once more. These reforms include strengthening the position of Prime Minister and weakening the power of the Senate. Too long have bickering politicians held back our nation. We require a strong leader to lead us into the future."
 FRA_law_and_order:0 "Rule by Decree"
 FRA_law_and_order_desc:0 "With the state secured, and our power strengthend we can now focus our efforts on fixing the issues that plague france. We shall start by implementing electoral and economic reforms."
 FRA_the_right_to_vote:0 "Woman's Suffrage"
 FRA_the_right_to_vote_desc:0 "In our fight to create a more equal and free society, we have run into the issue of women's suffrage. There are many within the party who support granting women the vote but also those who think we ought to moderate our demands in the interest of cooperation with the center for the sake of holding together our anti-fascist bloc. We must choose a path forwards."
 FRA_role_of_the_sexes:0 "Question Gender Roles"
 FRA_role_of_the_sexes_desc:0 "We have chosen our approach towards a woman's role in society. In order to better strengthen our political movement and fight against reactionary forces within and without, we shall mobilize our womens movement for our fight against fascism and continue our political reforms related to the role of the sexes."
 FPM_role_of_the_sexes_tt:0 "Upgrades the national spirit given by national focus §Y$FRA_the_right_to_vote$§!."
 FRA_defensive_strategems_tt:0 "The government will no longer push for an §RArmistice§! if §YParis§! falls to [GER.GetFlag]§Y[GER.GetName]§!"
 FPM_popular_front_victory:0 "The §YPopular Front§! has won the 1936 Elections."
 FPM_national_bloc_victory:0 "The §YNational Bloc§! has won the 1936 Elections."
 FPM_emergency_powers:0 "Decision cost to activate any decisions relating to §Y$FRA_economy_dynamic_modifier$§! is halved."
 FPM_syrian_revolt_warning:0 "§RIf Syria is not given independence by 1941 and France has not capitulated, the Syrians may revolt against the government!§!"
 FPM_force_the_issue_tt:0 "The stability penalty depends on the popularity of the §YFascist§! and §YNon-Aligned§! Parties.\n"
 FPM_soviet_concessions_tt:0 "If national focus §YSoviet Concessions§! is taken, and the owner of §YBessarabia§! joins the faction, they will be asked to return the states to [SOV.GetFlag]§Y[SOV.GetNameDef]§!"
 FRA_democratic_socialism:0 "Democratic Socialism"
 FRA_democratic_socialism_desc:0 "In the face of totalitarianism worldwide we show to the world that one can remain both Socialist and Democratic. We shall defend to the death the liberty of the working class."
 FRA_rebuild_eastern_alliances:0 "Rebuild Eastern Alliances"
 FRA_rebuild_eastern_alliances_desc:0 "If we wish to defeat Fascism we will require the support of others. The nations of the Little Entente are perfectly placed to provide a second front in the fight against Fascism."
 FRA_ally_with_the_poles:0 "Alliance with the Poles"
 FRA_ally_with_the_poles_desc:0 "By allying with the Poles we will gain an important ally in the East to put pressure on the Fascist regimes of Central Europe. While Poland does have it's share of problems with the [SOV.GetName], we cannot pass up this opportunity."
 FRA_soviet_concessions:0 "Concessions to the [SOV.GetName]"
 FRA_soviet_concessions_desc:0 "As the first major socialist nation in history, the Soviet Union, despite its differences with us must be accomodated in this new world order we are constructing. It would be best to establish a defensive alliance with them now to ensure the safety of our eastern allies."
 FRA_polish_compliance:0 "Demand Polish Compliance"
 FRA_polish_compliance_desc:0 "Poland lies inbetween the [SOV.GetName] and the reactionary threats of Central Europe. If we wish to dispose of them, the Soviet Union must first be given access through the territory of [POL.GetName]."
 FRA_franco_soviet_econ:0 "Franco-Soviet Mutual Economic Assistance"
 FRA_franco_soviet_econ_desc:0 "As we step into Socialism we must learn from those who have already made their transition to a socialist economy. The [SOV.GetName] has declared that it would support us in our move towards Socialism, and so we shall sign a treaty with them providing for mutual economic assistance."
 FRA_franco_soviet_mil:0 "Mutual Military Industry Support"
 FRA_franco_soviet_mil_desc:0 "The fight against fascists and reactionaries requires many munitions of war. The [SOV.GetName], likewise wishing for help in militarization has indicated that it would support an amendment to the Franco-Soviet Treaty of Economic Assistance to include mutual support in building up military industry."
 FRA_expand_the_deuxime_bureau:0 "Expand the Deuxieme Bureau"
 FRA_expand_the_deuxime_bureau_desc:0 "Our plans to bring about world revolution cannot be achieved through sheer military force. We must invest into espionage so that the workers of the world may rise up of their own accord."
 FRA_export_the_revolution:0 "Export the Revolution"
 FRA_export_the_revolution_desc:0 "The world revolution is upon us, reactionaries tremble in fear. We will continue to expand our espionage capabilities so that those remaining oppressed may rise up and liberate themselves."
 FRA_world_revolution:0 "World Revolution"
 FRA_world_revolution_desc:0 "The people of the world cry out for freedom. We must bring it to them by means of arms. We will not stop until every bourgeoise, reactionary, or otherwise counterrevolutionary state has been dismantled."
 FRA_european_commune:0 "Form the European Commune"
 FRA_european_commune_desc:0 "The dreams of World Revolution have come to pass. We have conquered Europe and made it our own. Away with the concept of borders, we shall integrate all of Western Europe into one single commune to lead the socialist world!"
 FRA_end_asian_fascism:0 "End Asian Fascism"
 FRA_end_asian_fascism_desc:0 "Fascism limits itself not only to Europe. The fascist regimes in Asia are a danger to world peace and must be eliminated just as were the ones in Europe."
  FPM_democratic_socialism:0 "Democratic Socialism"
 FPM_democratic_socialism_desc:0 "In the face of totalitarianism worldwide we show to the world that one can remain both Socialist and Democratic. We shall defend to the death the liberty of the working class."
 FRA_popular_universities:0 "Folk Highschools"
 FRA_popular_universities_desc:0 "The first Folk highschools failed because they were disconnected from the needs of the working class. We must redevelop them taking into account the interests of workers."
 FPM_expand_the_deuxieme_bureau:0 "Expand the Deuxième Bureau"
 FPM_expand_the_deuxieme_bureau_desc:0 "Our plans to bring about world revolution cannot be achieved through sheer military force. We must invest into espionage so that the workers of the world may rise up of their own accord."
 FPM_export_the_revolution:0 "Export the Revolution"
 FPM_export_the_revolution_desc:0 "The world revolution is upon us, reactionaries tremble in fear. We will continue to expand our espionage capabilities so that those remaining oppressed may rise up and liberate themselves."
 FRA_Finish_the_continental_system:0 "Finish the Continental System"
 FRA_Finish_the_continental_system_desc:0 "Portugal may be neutral today, but it remains England's historic ally, and the final piece needed for continental and maritime control of Europe."
 FRA_Take_over_Italy:0 "Take Over Italy"
 FRA_Take_over_Italy_desc:0 "French control over of the Italian peninsula is an obvious necessity, we must retake Rome and restore a government more reliable than the current circus which has lasted for too long.""
 FRA_franco_belgian_accords:0 "Renew the Franco-Belgian Accords"
 FRA_franco_belgian_accords_desc:0 "The Franco-Belgian accords, which had expired in March 1936 had provided for collective defense between France and Belgium. We should renew this treaty, as well as pushing for an additional treaty with Luxembourg so that we may use the territory as a jumping off point by which to project power into Central Europe."
 FRA_franco_belgian_accords_breda_tt:0 "\nIf we have selected the §YDyle-Breda§! plan in the focus §YDyle Plan§!, [HOL.GetFlag]§![HOL.GetNameDef]§! may be invited to our faction, as long as we are at peace with them and they are not already in a faction."
 FRA_franco_italian_tech_exchange:0 "Franco-Italian Technological Exchange"
 FRA_franco_italian_tech_exchange_desc:0 "We should sign a treaty with our new Italian friends so that we may both exchange industrial technologies. With our economies combined, we shall be able to stand up to those great powers with a larger economy than us."
 FRA_anglo_french_war_council:0 "Create the Anglo-French Supreme War Council"
 FRA_anglo_french_war_council_desc:0 "We should create a war council to coordinate our military with [ENG.GetName]. Together our militaries shall prevail over any threat!"
 FRA_implore_patriotism:0 "Implore Patriotism"
 FRA_implore_patriotism_desc:0 "Across the world, totalitarian regimes threaten peace. We must mobilize the people of France for a conflict and put a stop to the pacifist tendencies which have plagued our society since the Great War. Only by means of arms shall we triumph!"
 FPM_implore_patriotism_tt:0 "Adds §YWar Support§! based on current §YDemocratic§! support."
 FRA_scandinavian_intervention:0 "Scandinavian Intervention"
 FRA_scandinavian_intervention_desc:0 "Our enemies look with hunger to Scandinavia. We cannot allow the resources of the region to fall into our enemies hands. We should request an embargo from the states there, as well as the right to station troops in the area."
 FRA_scandinavian_intervention_tt:0 "Countries with a high opinion of us may also be invited to our faction."
 FRA_expedition_to_salonika:0 "The Salonika Expedition"
 FRA_expedition_to_salonika_desc:0 "In the First World War, we managed to tie up significant forces in the Balkans by sending a force to Salonika. With the help of the Greeks, we should be able to achieve the same now."
 FRA_romanian_oil:0 "Requisition Romanian Resources"
 FRA_romanian_oil_desc:0 "With our new foothold in the Balkans, we should begin our next step in our strategy to strangle our enemy of resources, we should ensure that they cannot access the oil fields of Romania. With a resource so vital, we should additionally station troops in the country and strengthen our mutual defense ties."
 FRA_romanian_oil2:0 "Requisition Romanian Resources"
 FRA_romanian_oil2_desc:0 "With our new foothold in Europe, we should begin our next step in our strategy to strangle our enemy of resources, we should ensure that they cannot access the oil fields of Romania. With a resource so vital, we should additionally station troops in the country and strengthen our mutual defense ties."
 FRA_national_unity_government:0 "A New Sacred Union"
 FRA_national_unity_government_desc:0 "In the First World War, politicians from all sides came together to form a government of national unity, the Union Sacrée. As we find ourselves at war once again, we should form such a coalition again, unifying the parties of the left and the right into one common cause. Winning the war."
 FRA_preemptive_strike_on_germany:0 "Preemptive Strike Against Germany"
 FRA_preemptive_strike_on_germany_desc:0 "The longer we wait the more the German military strengthens itself in violation of the Treaty of Versailles. We must take the fight to their lands now before they can rearm themselves any further."
 FRA_end_the_red_menace:0 "End the Red Menace"
 FRA_end_the_red_menace_desc:0 "The Soviet Union is an unpredictable state. It's very existance threatens the stability of Europe with it's revolutionary rhetoric. We must put down the red menace before it can do too much damage. To achieve this, we shall begin the war with a bombing of the [SOV.GetAdjective] oil supplies in Baku, and progress through Turkey into the Caucasus from there."
 FPM_red_menace_finland_tt:0 "If National Focus §YSupport the Finns§! has been taken, [FIN.GetFlag]§Y[FIN.GetName]§! will be invited into your faction."
 FRA_alpine_trade:0 "Increase Alpine Trade"
 FRA_alpine_trade_desc:0 "We should strengthen our ties with Italy by increasing trade across the Alps. While historically the Alps have been a tough barrier to cross, suited more to military defense, we shall go against tradition to celebrate our alliance with our new-found friends."
 FRA_franco_soviet_econ_alt:0 "$FRA_franco_soviet_econ$"
 FRA_franco_soviet_econ_alt_desc:0 "$FRA_franco_soviet_econ_desc$"
 FRA_franco_soviet_mil_alt:0 "$FRA_franco_soviet_mil$"
 FRA_franco_soviet_mil_alt_desc:0 "$FRA_franco_soviet_mil_desc$"
 FRA_democratic_socialism_alt:0 "$FRA_democratic_socialism$"
 FRA_democratic_socialism_alt_desc:0 "$FRA_democratic_socialism_desc$"
 FRA_world_revolution_alt:0 "$FRA_world_revolution$"
 FRA_world_revolution_alt_desc:0 "$FRA_world_revolution_desc$"
 FRA_reshuffle_the_air_ministry:0 "Reshuffle the Air Ministry"
 FRA_reshuffle_the_air_ministry_desc:0 "We need consistent and competent leadership in charge of the Air Ministry. There are several candidates to this position, so we must choose the best."
 FRA_plan_v:0 "Plan V"
 FRA_plan_v_desc:0 "If we wish to win any wars in the future, we must be able to produce aircraft in the same numbers that we did in the last war. To do so, the Air Ministry has called for an ambitious plan, named Plan V, which calls for the construction of thousands of planes."
 FRA_colonial_air_bases:0 "Colonial Air Bases"
 FRA_colonial_air_bases_desc:0 "To defend our global empire we must be able to project our air power across the globe. To do so, we must build airbases in our colonies."
 FRA_airborne_experiments:0 "Regiment De Chasseurs Parachutistes"
 FRA_airborne_experiments_desc:0 "Planes can carry not only bombs but soldiers as well. We should experiment with this new form of warfare."
 FRA_ace_pilots:0 "Fighter Aces"
 FRA_ace_pilots_desc:0 "It is said that a minority of pilots end up shooting down the vast majority of enemy planes. We would do well do find those in the minority and support them further."
 FRA_radar:0 "Intercepting the Enemy"
 FRA_radar_desc:0 "The enemy has developed a new cruel way of war, attempting to bomb us into submission. With development of new RADAR technology however, we can prevent this from happening."
 FRA_fighter_designs:0 "Develop the Dewoitines"
 FRA_fighter_designs_desc:0 "The rest of the world flies past us with their fighter designs, our planes unable to compete. We must design new planes lest we lose the war."
 FRA_bomber_designs:0 "Multirole Bombers"
 FRA_bomber_designs_desc:0 "Our bombers must be able to support our troops on the ground as well as be able to eliminate enemy industry. Our means to achieve this shall be the production of new types of tactical bombers."
 FRA_photo_recon:0 "Aerial Reconnaissance"
 FRA_photo_recon_desc:0 "Our airforce reforms call for the production of not just bombers and fighters, but also reconnaissance aircraft. Such planes would help us greatly in detecting enemy movements before they happen."
 FRA_naval_blockades:0 "Starving out the Enemy"
 FRA_naval_blockades_desc:0 "What won us the last war was the prolonged naval blockade against Germany. We must replicate this success again and develop strategies to strangle our enemies overseas trade, preventing the need for a costly ground campaign."
 FRA_convoy_tactics:0 "Convoy Tactics"
 FRA_convoy_tactics_desc:0 "In the last war we experienced a determined effort on the part of the Germans to cut off our trade via submarines, which we countered by developing convoy tactics. The next war will likely be no different."
 FRA_rebuild_the_battlefleet:0 "Rebuild the Battlefleet"
 FRA_rebuild_the_battlefleet_desc:0 "Before the Great War we had among one of the greatest fleets in history. While we still remain among the great powers, the realities of the interwar period has led to us neccessarily cutting naval spending. In this new period of turmoil however, we cannot afford to cut spending anymore. We must rebuild our navy to it's previous heights!"
 FRA_cooperation_with_the_left:0 "Cooperation with the Left"
 FRA_cooperation_with_the_left_desc:0 "While the Left has historically been an enemy of monarchism, our dedication to anti-fascism has made some friends among those who desire to defeat the fascism at all costs. We should expand this friendship and bring the left onboard with our plans."
 FRA_unlock_leftist_ministers:0 "Unlocks §YCommunist§! Ministers."
 FRA_unlock_rightist_ministers:0 "Unlocks §YFascist§! Ministers."
 FRA_freedom_of_knowledge:0 "Freedom of Knowledge"
 FRA_freedom_of_knowledge_desc:0 "As a free nation in an increasingly unfree world, we have the unique opportunity as being a safe haven for scientists who would otherwise be oppressed in their homelands. We should give them a place to work, so that they may contribute to our nation."
 FRA_appeal_to_absolutists:0 "Appeal to the Absolutists"
 FRA_appeal_to_absolutists_desc:0 "There are many in the Orleanist Cause who wish for a conservative autocracy. While we cannot promise the last part, Christian politics and traditional French values still have their place in our nation."
 FRA_anti_fascism:0 "The Anti-Fascist Crusade"
 FRA_anti_fascism_desc:0 "France finds herself besieged all around by fascist forces. Just as the Kingdom of France took up arms against the Muslims centuries ago to free Jerusalem, we must take up arms now to free all peoples of the world."
 FRA_action_francais:0 "Action Française"
 FRA_action_francais_desc:0 "The King wishes for a Constitutional Monarchy, ruled by effeminate liberals who would bring the same devastation to the country that we just worked so hard to remove. We cannot allow this to happen. We should take control into our own hands, and keep the King's mind off politics."
 FRA_rapproachment_with_church:0 "Rapproachment with the Church"
 FRA_rapproachment_with_church_desc:0 "In 1926 the Pope condemned Action Française, dealing a devastating blow to our movement. In light of our success, he can no longer afford to condemn us in a world full of godless Communists. We should appeal to him to end the Church's condemnnation."
 FRA_catholic_diplomacy:0 "Catholic Diplomacy"
 FRA_catholic_diplomacy_desc:0 "Catholicism is the base on which French Society is built upon. It ties us together, and to the other nations of the faith. We would do well to emphasize our Catholic roots and build our friendships upon it."
 FRA_camelots_du_roi:0 "Camelots du Roi"
 FRA_camelots_du_roi_desc:0 "The Camelots du Roi have provided a great service for our political cause. We should strengthen them."
 FRA_maurrassisme:0 "Maurrassisme"
 FRA_maurrassisme_desc:0 "The Republic was based on a set of degenerate intellectual traditions which have ultimately led to France being left behind in many aspects. We must rebuild France from the ground up, based on the ideals of Maurrassisme, based on nationalism, and a return to France's traditional values."
 FRA_maurrassisme2:0 "$FRA_maurrassisme$"
 FRA_maurrassisme2_desc:0 "$FRA_maurrassisme_desc$"
 FRA_seize_kurdistan:0 "Seize Kurdistan"
 FRA_seize_kurdistan_desc:0 "Kurdistan was promised to us after our victory in the Great War. While the republic of old may have failed to seize it, with our new leadership, we should take up arms and attack!"
 FRA_embrace_counterrevolution:0 "Embrace Counterrevolution"
 FRA_embrace_counterrevolution_desc:0 "The values of the Enlightenment have only led to death and destruction. Worst of all are the Marxists, professing the advent of a Utopia which can never exist. We must destroy these failed experiments once and for all."
 FRA_constitutional_monarchy:0 "Constitutional Monarchy"
 FRA_constitutional_monarchy_desc:0 "The values upon which France is based, Liberty, Equality, Fraternity, have traditionally been associated with the Republic. But there is no reason why a Monarchy, restricted by checks on it's power, cannot also fulfill these ideals."
 FRA_defender_of_liberty:0 "Defender of Liberty"
 FRA_defender_of_liberty_desc:0 "The King should not only to be be the symbol of the Nation, but it's greatest defender. The liberty of the people finds itself threatened by without and within. The King must take an active role in protecting it, lest the monarchy fall into irrelevance."
 FRA_reconcile_the_pretenders:0 "Reconcile the Pretenders"
 FRA_reconcile_the_pretenders_desc:0 "In 1883 the house of Orleans and house of Bourbon compromised on Henri, Count of Chambord, as the next in line for King of France, if they were to restore the Monarchy. While they failed, we should emphasize our cooperation and our common lineage back to Charlemagne. There is no reason for us to fight when France faces so many enemies."
 FRA_restore_bourbon_italy:0 "Restore Bourbon Italy"
 FRA_restore_bourbon_italy_desc:0 "The Bourbons once ruled over much of Italy. We should restore our rule to the Peninsula, which had been taken from us so unjustly by the House of Savoy."
 FRA_invest_in_spain:0 "Invest in Spain"
 FRA_invest_in_spain_desc:0 "With Spain now in our hands, we should help repair the damage of the Civil War, and industrialize it to the same extent as France."
 FRA_disunite_italy:0 "Disunite Italy"
 FRA_disunite_italy_desc:0 "The unification of Italy was a mistake. A strong Italy on France's borders can no longer be tolerated again, and thus we should split it up into multiple states, including restoring the lands of the Pope, who would do well to be be very grateful."
 FRA_disunite_russia:0 "Disunite Russia"
 FRA_disunite_russia_desc:0 "The Soviet Union was the home of dozens of people, after its final defeat, we must raise armies among them and turn those into proper states."
 FRA_reclaim_new_france:0 "Reclaim New France"
 FRA_reclaim_new_france_desc:0 "France one controlled vast swathes of the American Continent, only to have it stolen From us by the British, bankrupting us and bringing us into revolution. That time has ended. It is time to reclaim the New World."
 FRA_ending_the_enlightenment:0 "Ending the Enlightenment"
 FRA_ending_the_enlightenment_desc:0 "The Enlightenment was a mistake. The revolutionary wave which hit France and sparked the flames of Republicanism have led to the deaths of millions, and endless political chaos. It is time to put down the states which have unfortunately followed France."
 FRA_eastern_latins:0 "Invite the Eastern Latins"
 FRA_eastern_latins_desc:0 "The Romanians find themselves seperated from the rest of the Latin world by Slavs and Magyars. Nevertheless, they are Latin all the same, and we should invite them into our alliance."
 FRA_partition_switzerland:0 "Partition Switzerland"
 FRA_partition_switzerland_desc:0 "Switzerland is an artificial construct. It's people are German, French, and Italian. The country of bankers must come to an end."
 FRA_proletarian_nationalism:0 "Proletarian Nationalism"
 FRA_proletarian_nationalism_desc:0 "The Proletariat are decieved by Communism. We must bring them to our side, and promise social programs that would help out the poor and needy."
 FRA_celebrate_motherhood:0 "$VIC_celebrate_motherhood$"
 FRA_celebrate_motherhood_desc:0 "$VIC_celebrate_motherhood_desc$"
 FRA_long_term_economic_planning:0 "Long-Term Economic Planning"
 FRA_long_term_economic_planning_desc:1 "While it is tempting to see the current situation as so important that it supersedes all other concerns, we must not forget that there are things that take a long time to implement. By creating a series of economic plans, we can grow our economy in an efficient manner."
 FRA_aid_small_businesses:0 "Aid Small Businesses"
 FRA_aid_small_businesses_desc:2 "The many small companies that make up our economy have been hit hard by the recent economic troubles. We should try to remedy this in order to help them survive."
 FRA_venerate_the_craftsman_desc:0 "For too long has the discussion of labour focused on the industrial worker, who works in a large factory for a big company. It is time to show the accomplishments of the skilled craftsman, working in his own workshop, providing for his family."
 FRA_the_national_bureau_of_statistics:0 "The National Bureau of Statistics"
 FRA_the_national_bureau_of_statistics_desc:0 "If we are to lead our people into a better future, we need hard data to base our decisions on. We should form a new agency tasked with generating this data."
 FRA_the_legionary_service_order:0 "The Legionary Service Order"
 FRA_the_legionary_service_order_desc:0 "With our military stretched too thin to protect all of France, we need a new organization of patriots to support the regime."
 FRA_form_the_milice:0 "Form the Milice"
 FRA_form_the_milice_desc:0 "We should to create a force that can take the fight to rebels and insurrectionists. We will recruit only the most patriotic of members and give them far-ranging freedom to act as they see fit to bring these terrorists to heel."
 FPM_orleanists_ruling_party:0 "§YParti orléaniste§! becomes the ruling party.\nPublic elections will be held."
 FPM_legitimist_ruling_party:0 "§YParti légitimiste§! becomes the ruling party.\nPublic elections will not be held."
 FPM_bonapartist_ruling_party:0 "§YParti de l'Appel au peuple§! becomes the ruling party.\nPublic elections will be held."
 FPM_af_ruling_party:0 "§YAction française§! becomes the ruling party. \nPublic elections will not be held."
 fpmfascgtneu:0 "§Y[FRA.GetFascistParty]§! has more support than §Y[FRA.GetNeutralParty]§!"
 fpmneugtfasc:0 "§Y[FRA.GetNeutralParty]§! has more support than §Y[FRA.GetFascistParty]§!"
 FPM_one_strongest_claimant:0 "A §YClaimant§! to the §YFrench Throne§! has more points than either of his competitors."
 FRA_integrate_the_balkan_entente:0 "Integrate the Balkan Entente"
 FRA_integrate_the_balkan_entente_desc:0 "We should expand our influence in the Balkans by inviting the Greeks and Turks into our alliance. This should give us greater control over the Bosphorus, allowing us to project power into the Black Sea, and giving us vital allies in the eastern Mediterranean."
 FRA_commit_to_appeasement:0 "Commit to Appeasement"
 FRA_commit_to_appeasement_desc:0 "We cannot afford a war anytime soon. We must appease our enemies until our military and industry is prepared. While it is unfortunate that others must sacrifice themselves for this, once we are prepared, their liberation will be soon at hand."
 FRA_liberation:0 "Liberation"
 FRA_liberation_desc:0 "The time for liberation is at hand! We have reestablished our seat of government in Paris and now the rest of France must join us in resisting the occupier! We shall throw them out of France and over the Rhine!"
 FRA_imperial_plebiscite:0 "National Plebiscite"
 FRA_imperial_plebiscite_desc:0 "Just because the Bonapartes rule France with authority, does not mean that the wishes and desires of the French population can be neglected. We shall put to vote important issues and initiatives that the government wishes to act on, so that the people of France may have their say."
 FRA_support_ethiopia:0 "Support Ethiopia"
 FRA_support_ethiopia_desc:0 "An example of dedication and resistance against oppression, the Ethiopians are fiercely resisting the invader. We should help them!"
 FRA_the_workers_state:0 "The Workers State"
 FRA_the_workers_state_desc:0 "With the dictatorship of the proletariat firmly established, we can now set about recreating the nation in a way that puts the interests of the proletariat firmly at the forefront of politics. Everything from the way we educate our children, to the way we organize our factories shall be completely overhauled."
 FRA_class_war:0 "Class War"
 FRA_class_war_desc:0 "The very idea of a Popular Front is flawed. The proletariat can never be truly free as long as they are exploited by the bourgeoisie. Only by uncompromisingly pursuing the strategy of class war will we achieve this long-awaited freedom, regardless of whether this means fighting on all fronts the entire capitalist and fascist reaction."  
 FRA_JC_empowered:0 "Strengthening the Youth"
 FRA_JC_empowered_desc:0 "The Communist Youth is our organization for preparing and organizing young [ROOT.GetAdjective] people. They will shape our country; we must ensure they are strengthened and well integrated to secure our future."
 FRA_avantgarde:0 "A New Avant-Garde"
 FRA_avantgarde_desc:0 "France has always been the homeland of authors and artists, the land of the Surrealists. Our revolution must emulate the arts to awaken the spirit of the proletariat."
#  FRA_one_great_union:0 "One Great Union"
#  FRA_one_great_union_desc:0 "Now, proletarians of Europe have liberated themselves, even to the very gates of the first workers' state; the USSR. Likewise, we have united all the soviets against the reactionaries of the world, and have been victorious; the Paris Commune is avenged! We must complete our dream, abolish our borders, and unite in a single Union; the red flag may fly from Brest to Vladistok!"
 FRA_natural_allies:0 "Natural Allies"
 FRA_natural_allies_desc:0 "Despite all the backstabbing our Anglo-Saxon allies have done since the end of the Great War (cancelling German reparations, leaving our defense agreement, disarming our country, etc.), they are still our natural allies, and France must stand by their side."
 FRA_kill_belgium:0 "Take Over Belgium"
 FRA_kill_belgium_desc:0 "Belgium is a fabricated entity; it endangers our country's security because it constitutes the easiest invasion route to France. We will take care of this."
 FRA_russian_mission:0 "Franco-Russian Alliance"
 FRA_russian_mission_desc:0 "During the Great War, the Franco-Russian alliance was extremely useful. Despite our political differences since the October Revolution, the Russian and French peoples are friends, and an alliance between our two countries would be perfectly appropriate from a strategic point of view."
 FRA_POL_LIT_union:0 "$POL_LIT_union$"
 FRA_POL_LIT_union_desc:0 "Poland has always been a reliable ally of France. We must strengthen them in the east, restoring the Commonwealth of old, in preparation for our march into Russia."
 FRA_private_research_grants:0 "Private Research Grants"
 FRA_private_research_grants_desc:0 "The private sector has always lead the way forwards in terms of innovation. We should encourage these endeavors by issuing research grants."
 FRA_ally_with_italy:0 "Ally with Italy"
 FRA_ally_with_italy_desc:0 "Bainville admired Mussolini while he was still alive, praising it's policies of national strength and public order. We should follow in his footsteps and pursue an alliance with the Italian state." 
 FRA_labour_government:0 "Force a Labour Government"
 FRA_labour_government_desc:0 "Now that we are in a faction with the British, we should put some pressure on their government to adopt a more socialist form of governance. To these ends we shall ask the Labour Party to lead their government."
 FRA_international_socialism_tt: "§Y[FRA.GetName]§! will become Faction Leader if it is part of a faction."
 FRA_labour_government_tt:0 "\n[ENG.GetFlag]§Y[ENG.GetName]§! will be more likely to accept the higher their §YCommunism§! support is."
 FRA_international_socialism:0 "International Socialism"
 FRA_international_socialism_desc:0 "We have risen to become the predominant socialist power in our alliance. Now is time to seize leadership, so that France may become the leader of this new world order."
 FRA_fund_socialist_parties:0 "Fund Socialist Parties"
 FRA_fund_socialist_parties_desc:0 "The cause of democratic socialism cannot be limited to France. We must support similar movements worldwide. For the workers of the world!"
 FRA_fund_socialist_parties_tt:0 "Every §YDemocratic§! and §YNon-Aligned§! member of our faction: \n\nGains §Y'$FPM_demsoc_rally$'§! which grants (Daily Communism Support: §G+0.07§!, Ideology Drift Defense: §R-10%§!, $FPM_demsoc_rally_tt$) for §Y730§! day(s)."
 FRA_coordinate_rearmament2:0 "United Rearmament Strategy"
 FRA_coordinate_rearmament2_desc:0 "If we wish for our minor allies to prove an effective bulwark against fascism, we must coordinate our rearmament strategy with them, ensuring they have the finest access to the latest military equipment."
 FRA_protect_czechoslovakia:0 "Protect Czechoslovakia"
 FRA_protect_czechoslovakia_desc:0 "The Czechs are critical to the stability of Central Europe. We must guarantee them against any fascist or otherwise imperialist aggression against [CZE.GetName] by inviting them into a full military alliance."
 FRA_secure_hungary:0 "Secure Hungary"
 FRA_secure_hungary_desc:0 "The reactionary Hungarian State poses a dangerous threat to the peace of Central and Eastern Europe. We should pacify it before it can join with other dangerous powers."
 FRA_socialist_science:0 "Socialist Science"
 FRA_socialist_science_desc:0 "Science cannot be limited by borders! We must bring together the brightest of our world into one unified scientific endavor!"
 FRA_heavy_industry:0 "Prioritize Heavy Industry"
 FRA_heavy_industry_desc:0 "In these dangerous times, we cannot afford to produce frivolous consumer goods. We must prioritize heavy industry for war production, lest France fall to fascism."
 FRA_detatch_the_rhine:0 "Detatch the Rhine"
 FRA_detatch_the_rhine_desc:0 "Over the past 70 years, Germany has invaded us three times. We must put a stop to this, and establish a government in the Rhineland that we know will be friendly to us."
 FRA_eastern_pact:0 "The Eastern Pact"
 FRA_eastern_pact_desc:0 "Before Louis Barthou was killed in 1934, he advocated for the formation of an 'Eastern Pact', which included Poland, the Baltic States and Finland, meant to contain Germany! We should invite those states to our alliance."
 FRA_franco_soviet_treaty_tt:0 "In the case of any defensive war in Europe against any fascist power, [FRA.GetFlag]§Y[FRA.GetName]§! and [SOV.GetFlag]§Y[SOV.GetName]§! pledge to defend each other, and will be called to join the war via event."
 FRA_join_the_ententes_tt:0 "\n[ENG.GetFlag]§Y[ENG.GetName]§! is unlikely to join unless World Tension is heightened, [FRA.GetFlag]§Y[FRA.GetName]§! is at risk of capitulation, and/or [FRA.GetFlag]§Y[FRA.GetName]§! is in a defensive war with both [GER.GetFlag]§Y[GER.GetName]§!, and [SOV.GetFlag]§Y[SOV.GetName]§!."
 FRA_first_five_year_plan:0 "The Five Year Plan"
 FRA_first_five_year_plan_desc:0 "A socialist France demands that we organize our economy on the basis of economic planning. Like our comrades elsewhere, we should begin a Five Year Plan to improve our economy."
 FRA_second_five_year_plan:0 "The Five Year Plan"
 FRA_second_five_year_plan_desc:0 "With the success of our first five year plan, we can move onto our next five year plan, using the resources and experience gained during the first."
 FRA_farm_to_factory:0 "Move the Farmers into Factories"
 FRA_farm_to_factory_desc:0 "France has long been an agricultural nation, but no longer. Backwards farmers will be transformed into Proletarians, by force, if neccessary."
 FRA_instigate_workers_revolts:0 "Instigate Workers Revolutions"
 FRA_instigate_workers_revolts_desc:0 "Now that we have experience in launching and supportings workers revolutions, we can export this model worldwide. The workers of the world will be free!"
 FRA_instigate_workers_revolution_general:0 "Instigate Workers Revolution"
 FRA_instigate_workers_revolution_general_desc:0 "The workers cry out for liberation. We will bring it to them."
 FRA_two_successful_revolutions_tt:0 "We heve successfully instigated two successful workers revolutions."
 FRA_general_confederation_of_labor:0 "Confédération Générale du Travail"
 FRA_general_confederation_of_labor_desc:0 "The General Confederation of Labour, or Confédération Générale du Travail, was formed in 1895 as a confederation of Trade Unions, and has always had deep ties to the Communist Party. Even though workers can now be said to be represented through the state, we must never forget our roots, and use the unions now as a tool by which to organize labor and society."
 FRA_the_russian_question:0 "The Russian Question"
 FRA_the_russian_question_desc:0 "While we have distanced ourselves from the Soviet Government in Moscow, we cannot deny that their socialist experiment predates ours. We need to come up with a policy on how to approach them."
 FRA_global_unity:0 "Global Unity"
 FRA_global_unity_desc:0 "Anti-fascism demands a global response! We cannot stand alone in these times. Democratic and socialist governments alike must unite!"
 FRA_global_unity_tt:0 "Every independent §YDemocratic§! and §YCommunist§! country not already in a faction will be invited to ours."
 FRA_anti_fascist_militias:0 "Anti-Fascist Militias"
 FRA_anti_fascist_militias_desc:0 "The people must take defense into their own hands! We will strengthen our anti-fascist militias in order to bolster our army."
 FRA_knowledge_hub:0 "Knowledge Hub"
 FRA_knowledge_hub_desc:0 "Our bastion as a democratic state friendly to the working class has brought intellectuals from all across the globe to our universities. Exiled thinkers from anti-intellectual states are free here to contribute to our cause."
 FRA_non_intervention_committee:0 "The Non-Intervention Committee"
 FRA_non_intervention_committee_desc:0 "We cannot let a global war start because of the crisis in Spain. We must get the major powers of this world to agree to non-intervention."
 FRA_invite_spain:0 "The Spanish Alliance"
 FRA_invite_spain_desc:0 "Our southern border with Spain is long and mostly unguarded. We should secure our southern flank and invite them into our alliance."
 FRA_enforce_non_intervention:0 "Enforce Non-Intervention"
 FRA_enforce_non_intervention_desc:0 "Even though we have formed the Non-Intervention Committee, countries continue to openly play sides in the war, risking a global war. We must call upon the League of Nations to put a stop to this."
 FRA_mediate_peace_in_ethiopia:0 "Mediate Peace in Ethiopia"
 FRA_mediate_peace_in_ethiopia_desc:0 "Now that we are secure in our government following the elections, we can follow up on attempting to mediate peace between Italy and Ethiopia based on the terms of the Hoare-Laval Pact."
 FRA_mediate_peace_in_ethiopia_acceptance_tt:0 "[ITA.GetFlag]§Y[ITA.GetName]§! and [ETH.GetFlag]§Y[ETH.GetName]§! are unlikely to accept unless their opinions of us are over §G50§!."
 FRA_le_prince_rouge:0 "Le Prince Rouge"
 FRA_le_prince_rouge_desc:0 "Napoléon-Jérôme Bonaparte was nicknamed 'Le Prince Rouge' due to his radical politics, often sympathizing with the Republicans! While it may sound strange, we should follow in his footsteps, creating a new red France."
 FRA_the_liberal_empire:0 "Republican Monarchy"
 FRA_the_liberal_empire_desc:0 "Bonapartism has never truly been about Kings or Emperors, it has been about France! France led by a single, strong central ruler, who derives his legitimacy from the people. Napoleon I was once Consul and Napoleon III president. Let us do away with antiquated titles and rule France simply as the Republic."
 FRA_classical_bonapartism:0 "Classical Bonapartism"
 FRA_classical_bonapartism_desc:0 "Many throw around radical ideas, on the left and the right. Napoleon I, correctly, synthesized the ideals of the radical revolution with the principles of monarchy. We shall uphold this tradition."
 FRA_jeunesses_patriotes:0 "Jeunesses Patriotes"
 FRA_jeunesses_patriotes_desc:0 "Many in the modern Bonapartist movement hold an affinity for Italian style fascism. Of particular note, and one of the largest Bonapartist movements in France as of this time, is the right-wing league of the Jeunesses Patriotes. We should empower them."
 FRA_renovate_paris:0 "Renovate Paris"
 FRA_renovate_paris_desc:0 "During the Second Empire, Napoleon III and Georges-Eugène Haussmann began a process of renovating Paris, making it the city it is today. Just as he did, we should invest into the city to ensure it remains the cultural capital of the world."
 FRA_corsican_favoritism:0 "Corsican Favoritism"
 FRA_corsican_favoritism_desc:0 "As a Corsican himself, Napoleon I felt a deep connection to the people of the island, and indeed, many there, even today, many hold sympathies for Bonapartist politics. We shall reward their loyalties by investing into the island, ensuring it reaches the standards of the rest of France."
 FRA_taittinger_champagne:0 "Taittinger Champagne"
 FRA_taittinger_champagne_desc:0 "The Jeunesses Patriotes are led by a certain champagne producer, Pierre Taittinger, who is himself a Bonapartist. We will invest in his company, showing the whole world that the best drinks in the world are French."
 FRA_legitimize_our_dynasty:0 "Legitimize our Dynasty"
 FRA_legitimize_our_dynasty_desc:0 "The House of Bonaparte, despite having led France to greatness, is often referred to as illegitimate in many monarchist circles. We shall prove to the world that we are just as worthy to lead France as any other king or president."
 FRA_imperial_ambitions:0 "Imperial Ambitions"
 FRA_imperial_ambitions_desc:0 "Though we have only recently come to power, there is little time to rest. As the situation in the rest of the world grows restless, we must move with haste, and make our ambitions to secure French dominance over Europe clear."
 FRA_ally_mussolini:0 "Ally [ITA.GetLeader]"
 FRA_ally_mussolini_desc:0 "Italy has rebuilt it's country on a foundation of strength. By reaching out to them, we can secure our southeastern border."
 FRA_over_the_alps:0 "Over the Alps"
 FRA_over_the_alps_desc:0 "The Italian State poses a danger to us, aligning too closely with other dangerous powers in Europe. So once did Napoleon I, Charlemagne, and Hannibal once cross the alps, so too shall we." 
 FRA_empire_francais_desc:0 "In the aftermath of the Great War, Russia was strucken by revolution, Italy embroiled with political chaos, the Austro-Hungarian and Turkish empires had collapsed, the Anglo-American powers had turned once more to isolation, and Germany was saddled with defeat. We stood at the pinnicle of Europe. We cannot let this slip away."
 FRA_our_natural_borders:0 "Our Natural Border on the Rhine"
 FRA_our_natural_borders_desc:0 "The natural borders of France are the Alpes, Meditteranean, Pyrenees, Atlantic, and lastly, the Rhine. Our security will always be threatened until we have them."
 FRA_restore_eastern_alliances:0 "Restore our Eastern Alliances"
 FRA_restore_eastern_alliances_desc:0 "In the political chaos of the past few years, our international agreements with our eastern allies have lapsed. We should renew them, reaffirming our system of alliances in Eastern Europe."
 FRA_see_to_the_colonies:0 "See to the Colonies"
 FRA_see_to_the_colonies_desc:0 "Second only to London, France possesses a massive colonial Empire. While it has given us much benefits, it also means we are tied up in many international affairs."
 FRA_maintain_the_entente:0 "Maintain the Entente" 
 FRA_maintain_the_entente_desc:0 "Despite their persistent disregard for French wellbeing in recent troublesome times, the English have proven to be a valuable ally to France. We must reaffirm the Entente Cordiale, and gain their commitment to mutual defense."
 FRA_algerian_industry:0 "Invite Investors to Algeria"
 FRA_algerian_industry_desc:0 "We will consolidate our rule over Algeria by inviting in businessmen and investors from around France to the region, ensuring it's integration into the metropolitan economy."
 FRA_reaffirm_polish_independence:0 "Reaffirm Polish Independence"
 FRA_reaffirm_polish_independence_desc:0 "The Poles are a bulwark against both the Germans and the Russians, forming an essential component of European defense. Furthermore, they have always had a close tie to the Bonapartes, and indeed, many in Poland praise Napoleon to this day for freeing them. We should reaffirm our commitment to their defense." 
 FRA_protect_romania:0 "Protect Romania"
 FRA_protect_romania_desc:0 "Romania has been slipping away from our influence in recent years. We will reach out to them and bring them back into our continental sphere, guaranteeing their current borders."
 FRA_alliance_with_belgrade:0 "Alliance with Belgrade"
 FRA_alliance_with_belgrade_desc:0 "The Serbs have been an ally of the French since the Great War, and the establishment of the Yugoslav state is something we supported greatly. We should continue this alliance."
 FRA_alliance_with_belgrade_tt:0 "[YUG.GetFlag]§Y[YUG.GetName]§! is unlikely to join us if we are allied to [ITA.GetFlag]§Y[ITA.GetName]§!."
 FRA_protect_wallonia:0 "Unify with Belgium"
 FRA_protect_wallonia_desc:0 "Belgium has long been an ally of France, but our common defense in these troublesome times cannot be threatened by their worriesome insistence on neutrality. We must ensure their cooperation and bring their state into ours."
 FRA_unify_belgium_tt:0 "[BEL.GetFlag]§Y[BEL.GetName]§! will be more likely to accept if they have a high opinion of us, and/or they have the same ideology."
 FRA_secure_portugal:0 "Secure Portugal"
 FRA_secure_portugal_desc:0 "The Portuguese are all that stand in our way from domination over Iberia. Though they managed to resist us before, they will not succeed this time."
 FRA_liberate_spain:0 "Liberate Spain"
 FRA_liberate_spain_desc:0 "Reactionary forces have unfortunately managed to seize control of Spain, despite our best efforts. We must bring freedom back to the Iberian peninsula."
 FRA_liberate_spain_tt:0 "Gains §YPuppet (Focus)§! war goal against any Fascist or Nonaligned Spanish governments."
 FRA_class_against_class:0 "Class Against Class"
 FRA_class_against_class_desc:0 "Now that the threat of fascism has been largely eliminated, we can return to the policies of the Third Period, and once more focus our efforts on destroying bourgeoise democracy."
 FRA_iberian_alliance:0 "Iberian Alliance"
 FRA_iberian_alliance_desc:0 "The nations of Iberia are natural allies of France. Latin like us, and historically Francophilic. We will draw them into our bloc."
 FRA_strengthen_the_entente:0 "Strengthen the Entente"
 FRA_strengthen_the_entente_desc:0 "The Entente Cordial, signed in 1904 proves to be our best alliance to this day. We must pivot away from the Anglophobic beliefs many in our government hold."
 FRA_romanian_maurrasisme: "Romanian Maurrassisme"
 FRA_romanian_maurrasisme_desc:0 "Romania is a fellow Latin brother of ours, and in fact, Maurras's ideas have become quite popular amongst conservatives there. We would do well to integrate them into our sphere."
 FRA_form_austria_hungary_tt:0 "Becomes owner and controller of §Yall former Austro-Hungarian territory§! in Austria, Hungary, Czechoslovakia, and Yugoslavia."
 FRA_demand_brabant:0 "The Breda Plan" 
 FRA_demand_brabant_desc:0 "Our security can only be complete with the integration of the whole southern bank of the Rhine in our hands. We must petition the Dutch government to give it to us, allowing us a secure defensive line in the Low Countries."
 FRA_demand_brabant_tt:0 "[HOL.GetFlag]§Y[HOL.GetName]§! will be more likely accept if we have good relations, and/or we have a considerably larger army than them."
 FRA_reorganize_the_dutch_tt:0 "Reduces the cost to take Dutch states by §G50%§!."
 FRA_helvetic_republic:0 "New Act of Mediation"
 FRA_helvetic_republic_desc:0 "The Swiss are not amenable to the Bonapartist sort of Governance we have implemented elsewhere, but we still require their cooperation in our efforts to dominate Europe. In exchange for them keeping their current form of government, we will propose they cede part of some of their French-speaking territories, and align with our interests."
 FRA_reorganize_southern_europe:0 "Reorganize Southern Europe"
 FRA_reorganize_southern_europe_desc:0 "The Mediterranean, once a hotbed for conflict, has been united by us. We will reorganize it in our image, for the glory of France."
 FRA_united_states_of_europe:0 "United States of Europe"
 FRA_united_states_of_europe_desc:0 "In exile on Helena, Napoleon once spoke of a United States of Europe. Now that we have united the continent, we should fulfill his dream!"
 FRA_adopt_neosocialism:0 "Adopt Neosocialism"
 FRA_adopt_neosocialism_desc:0 "Much of the left still stands in opposition to our government, but there are those willing to defect to the Imperial cause. We will invite them to our government."
 FRA_a_new_tilsit:0 "A New Tilsit"
 FRA_a_new_tilsit_desc:0 "The Russians have been our historic ally, and though many have rejected them in recent times due to their new government, in the spirit of Tilsit, we will come together once more."
 FRA_joint_war_planning:0 "Joint War Planning"
 FRA_joint_war_planning_desc:0 "Just as in the Great War, we must coordinate our forces with Britain for our joint victory."
 FRA_retake_saint_domingue:0 "Retake Saint Domingue"
 FRA_retake_saint_domingue_desc:0 "The Haitian Revolution threw off French control of Saint Domingue, significantly weakening our power in the Carribean. We will now return."
 FRA_joint_weapons_development:0 "Joint Weapons Development"
 FRA_joint_weapons_development_desc:0 "We will deepen our cooperation with the British by ensuring the both of us have the best weapons to arm ourselves in the world, by sharing our research with one another."
 FRA_third_invasion_of_mexico:0 "Third Intervention in Mexico"
 FRA_third_invasion_of_mexico_desc:0 "Napoleon III once invaded Mexico but unfortunately failed. We will succeed where he did not, securing ourselves an ally in the Americas."
 FRA_a_trip_to_quebec:0 "A Trip to Quebec"
 FRA_a_trip_to_quebec_desc:0 "Ever since our alignment with the British, Napoleon has mused on  going on trip to Quebec, to meet with the Francophones there. Let's make that trip happen!"
 FRA_influence_the_americas:0 "Influence the Americas"
 FRA_influence_the_americas_desc:0 "For too long, the United States has held a near monopoly on influence in the Western Hemisphere, despite the Latin American states sharing much in common with Europe. We will break their diplomatic isolation, and invite those states amenable to us to our bloc."
 FRA_eastern_politics:0 "Reconcile Japan"
 FRA_eastern_politics_desc:0 "Historically, Japan has been an friend to us and the west, but we have let this friendship lapse. We should reach out to them once more."
 FRA_crush_the_threat_to_indochina:0 "Crush the Threat to Indochina"
 FRA_crush_the_threat_to_indochina_desc:0 "The Japanese State with their expansionist ambitions proves to be the biggest threat to our Indochinese holdings. We must proactively strike against them before they can seize it."
 FRA_force_de_frappe:0 "Force de Frappe"
 FRA_force_de_frappe_desc:0 "The Empire needs a strong nuclear force in this new age, and only with it can we truly secure our eternal rule. If anyone threatens to destroy us, they will be met with nuclear fire."
 FRA_austerity_measures:0 "Austerity Measures"
 FRA_austerity_measures_desc:0 "We must cut public spending, particularly the wages of civil servants, in these times, inducing deflation. This will be the best way to ensure the stability of our economy in these times."
 FRA_austerity_meassures_tt:0 "Can be repeated every §Y180§! days."
 FRA_enforce_the_paris_peace_treaties:0 "$little_entente_goal_name$"
 FRA_enforce_the_paris_peace_treaties_desc:0 "$little_entente_goal_desc$"
 FRA_expand_refineries:0 "Expand CFR Refineries"
 FRA_expand_refineries_desc:0 "Under the guidance of the Compagnie Française de Raffinage and Compagnie Française des Pétroles, we have improved France's access to oil in recent years, gaining a large stake in the Iraq Petroleum Company. Crude Oil is imported from Iraq, and then brought to Normandy and Provence, where it is refined. It is time to expand our refinery capabilities to ensure France's fuel security."
 FRA_united_against_fascism:0 "United Against Fascism"
 FRA_united_against_fascism_desc:0 "The Popular Front brings together the Communists, Socialists, and Radicals together against fascism! It is only united that we can protect France from this menace."
 FRA_french_flanders:0 "Reclaim French Flanders"
 FRA_french_flanders_desc:0 "The County of Flanders was one of the original territories of France as before it was unjustly taken from us by the Habsburgs. It is time to restore our rule there."
 #PROV GOV FOCUS TREE
 