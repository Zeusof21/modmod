# shackles
 remove_shackles:0 "Remover Shackles"
 remove_shackles_desc:0 "Para manter o jogo jogável até a década de 1960, a capacidade de países menores de criar exércitos gigantes e produzir grandes quantidades de equipamento foi limitada. Caso você queira jogar com um país menor ou médio que tenha sido afetado por essas limitações, esta decisão removerá essas shackles."
  
 shackles.1.t:0 "Bem-vindo!"
 shackles.1.d:0 "O late game do HoI4 costuma sofrer com quedas severas de desempenho, principalmente por causa da IA produzindo equipamentos em excesso e treinando grandes exércitos, inclusive em países muito pequenos. Esse problema fica ainda mais evidente no multiplayer.\n\nO mod AI Shackles existe para reduzir esse impacto, aplicando limites de produção e recrutamento em países menores, mantendo o jogo mais leve e estável até o fim.\n\nEssas limitações podem ser removidas gratuitamente por decisão caso você jogue com um país menor, e são retiradas automaticamente se o país entrar em guerra ou sofrer uma justificativa. Também é possível desativar o sistema desde o início, mas isso afetará negativamente a performance do jogo."
 shackles.1.b:0 "Obrigado!"
 shackles.1.b.d:0 "Países menores não receberão limitações."
 shackles.1.a:0 "Restringir a IA"
 shackles.1.a.d:0 "Países menores receberão limitações."
 
