 FPM_political_violence_enabled_tt:0 "Certain groups may cause §YPolitical Violence§! if not dealt with. These groups may start a §Rcivil war§! if France's stability drops below 30% while we are at peace or involved in the Spanish Civil War."
 FPM_political_violence_weakened_tt:0 "Certain groups may cause §YPolitical Violence§! if not dealt with. These groups may start a §Rcivil war§! if France's stability drops below 20% while we are at peace or involved in the Spanish Civil War."
