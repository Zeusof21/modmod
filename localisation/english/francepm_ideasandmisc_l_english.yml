 FRA_economy_dynamic_modifier_desc:0 "While still a major industrialized country, France has been left behind in terms of concentration of production capabilities. Major reforms are needed to make our economy more competitive in the global scale. \n\n§GThis national spirit will disappear once all modifiers reach zero. §!\n\n§RInflation will come to a temporary halt if the country finds itself at war.§!"
